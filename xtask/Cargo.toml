[package]
name = "xtask"
description = "Developer tasks for nutsh (cargo xtask <command>)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
# preserve_order: fallback_columns walks schema properties in the order the OpenAPI
# document declares them, so the JSON/YAML object map must not re-sort keys alphabetically.
serde_json = { workspace = true, features = ["preserve_order"] }
serde_yaml_ng.workspace = true
toml.workspace = true
regex = "1"
tokio.workspace = true
rpassword.workspace = true
nutsh-catalog.workspace = true
nutsh-prism.workspace = true

[dev-dependencies]
tempfile.workspace = true
