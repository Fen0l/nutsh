    { label = "Cluster UUID", path = "clusterUUID", kind = "Reference" },
    { label = "Source", path = "sourceEntity.name", kind = "Text" },
    { label = "Source type", path = "sourceEntity.type", kind = "Enum" },
    { label = "Affected", path = "affectedEntities[].name", kind = "Text" },
    { label = "Nodes", path = "impactedEntities.nodes[]", kind = "Reference" },
]

[[kinds."monitoring.serviceability.Alert".detail]]
title = "Timing"
fields = [
    { label = "First seen", path = "creationTime", kind = "Timestamp" },
    { label = "Last seen", path = "lastOccurredTime", kind = "Timestamp" },
    { label = "Updated", path = "lastUpdatedTime", kind = "Timestamp" },
