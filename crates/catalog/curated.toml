#
# **No SNAT IPS column.** The readOnly `snatIps` is empty on all six VPCs of the two recorded
# recordings (2026-09-10) - 0/4 on PC1, 0/2 on sierra - including the five that have an
# external subnet with an active gateway node, which is the configuration that would compute
# one. Empty on both and never sent; the addresses that do arrive sit one level down, at
# `externalSubnets[].externalIps[].ipv4.value`, which is where a column that wants them should
# look.
[kinds."networking.config.Vpc"]
warm = true
columns = [
