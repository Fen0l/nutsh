# ── The name cache's warm set ───────────────────────────────────────────────────────────────
# `core::names` lists one page of each of these at connect and every five minutes after, so a
# `Reference` cell resolves before anything has opened the kind it points at. The set is
# evidence, not taste: these are the kinds the `Reference` paths in the first six columns of
# all 262 kinds actually point at - `cluster.extId` 6 + `cluster.uuid` 3 + `clusterReference` 2,
# `createdBy.extId` 8 + `updatedBy.extId` 6, `host.extId` 4, `vpc.extId` 4,
# `virtualSwitch.extId` 2, the two `*Category.extId` 2 each, then the singletons.
#
# NOT `vmm.ahv.config.Vm`: `vm.extId` appears once, VMs are the largest list on any Prism
# Central, and the VM table warms itself the moment anybody opens it.
#
# The generator refuses `warm` on a kind nothing can list, and on one that would name itself
# with its own extId.
#
# This section is now a note and not a table: every one of the eleven carries `warm = true`
# beside its own columns, because a second TOML table with the same key is a parse error and
# not a merge. They are `clustermgmt.config.Cluster`, `clustermgmt.config.Host` and
# `clustermgmt.config.StorageContainer`; `vmm.content.Image`; `networking.config.Subnet`,
# `networking.config.Vpc`, `networking.config.VirtualSwitch` and `networking.config.Gateway`;
# `prism.config.Category`; and `iam.authn.User` and `prism.config.DomainManager` in Admin
# Center below. `crates/catalog/tests/consistency.rs` asserts the set whole.

# ── Admin Center ────────────────────────────────────────────────────────────────────────────
