    { label = "Resolution", path = "rootCauseAnalysis[].resolution", kind = "Text" },
    { label = "KB", path = "kbArticles[]", kind = "Text" },
]

[[kinds."monitoring.serviceability.Alert".detail]]
title = "Where"
fields = [
