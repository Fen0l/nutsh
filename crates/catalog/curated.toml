    { label = "Resolved", path = "isResolved", kind = "Bool" },
    { label = "Auto-resolved", path = "isAutoResolved", kind = "Bool" },
    { label = "Runnable", path = "isRunnable", kind = "Bool" },
]

[[kinds."monitoring.serviceability.Alert".detail]]
title = "Classification"
