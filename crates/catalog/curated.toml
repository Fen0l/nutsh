# One endpoint, two verbs: hide it and offer the verbs instead. A menu offering "manage alert"
# and then an enum is worse than one offering "Acknowledge" and "Resolve".
[kinds."monitoring.serviceability.Alert".actions."manage-alert"]
hidden = true

[kinds."monitoring.serviceability.Alert".actions."acknowledge"]
from = "manage-alert"
key = "A"
label = "Acknowledge"
danger = "low"
order = 10
body = { actionType = "ACKNOWLEDGE" }

[kinds."monitoring.serviceability.Alert".actions."resolve"]
from = "manage-alert"
key = "R"
label = "Resolve"
danger = "low"
order = 20
body = { actionType = "RESOLVE" }

# The three append-only logs. Each is a collection a Prism Central never trims, so each is
# read newest-first and capped; without an order a budget would keep an arbitrary slice of an
# arbitrary age, which is worse than no budget. Older rows stay reachable: the header prints
# the server's own total beside the shown count (`500/181825`), a page pane may name its own
# `orderby`, and the filter grammar will narrow by time when it lands.
#
# Every `orderby` field below is in its endpoint's `x-odata-fields` allowlist in the spec this
# catalog pins - checked, not guessed, because an order the server does not allow is a 400 on
# the whole list rather than a degraded one.
#
# Two of the three are here; the third, `lifecycle.resources.LcmHistory`, is curated beside the
# other LCM kinds in Admin Center, because a reader looking for it looks there.

# 181 825 audits in the recording at 0.85 s per 100-row page: the collection is 1819 pages, about
# 26 minutes, and the scheduler's blanket 200-page cap stopped the walk at 200 pages and
# about 170 s of every 30 s cycle, with an empty table throughout. The newest 500 arrive in
# five pages, four seconds, matching Alert. `creationTime` is one of the seven `$orderby`
# fields `listAudits` declares in specs/monitoring/v4.3.yaml (L2129); `operationStartTime` is
# another, but `operationEndTime` is not - it is null while an operation is still running.
#
# An audit is who did what and whether it worked, so `status` is second and tints the row.
#
# `clusterReference` is a `monitoring.v4.3.common.EntityReference` (specs/monitoring/v4.3.yaml
# L8820), which declares `name`, but every row of
# `crates/mockpc/fixtures/monitoring/v4.3/serviceability/audits.json` carries an `extId` and no
# `name` there - the shape v4 uses for cluster and host references everywhere - while
# `userReference` and `sourceEntity` on those same rows do carry names. So the cluster is a
# `Reference` over the extId, which the warm-up resolves to a cluster name; as
# `clusterReference.name` with kind `Text` the column would be blank on every row.
[kinds."monitoring.serviceability.Audit"]
orderby = "creationTime desc"
max_rows = 500
columns = [
    { header = "TITLE", path = "title", kind = "Text" },
    { header = "STATUS", path = "status", kind = "Status" },
    { header = "OPERATION", path = "operationType", kind = "Enum" },
    { header = "USER", path = "userReference.name", kind = "Text" },
    { header = "SOURCE", path = "sourceEntity.name", kind = "Text" },
    { header = "STARTED", path = "operationStartTime", kind = "Timestamp" },
    { header = "ENDED", path = "operationEndTime", kind = "Timestamp" },
    { header = "CLUSTER", path = "clusterReference.extId", kind = "Reference" },
]

# The audit log's sibling and the same shape. `creationTime` is one of the three `$orderby`
# fields `listEvents` declares in specs/monitoring/v4.3.yaml, and the only date among them.
# No row count measured in the recording, so it keeps the default budget: ten pages, bounded either
# way, and the order is what makes those ten pages the ten worth having.
#
# An event has no status of any kind: it is a thing that happened, and the row that says what
# it was is the title and the type.
#
# `operationType` and `serviceName` were the audit log's columns copied onto its sibling, and
# the copy does not fit: both are absent from all 100 rows of
# `crates/mockpc/fixtures-lab/monitoring/v4.3/serviceability/events.json` (2026-09-10) while
# `monitoring.serviceability.Audit` fills `operationType` 100/100 from the same Prism Central.
# What an event actually carries, on 100/100, is `eventType` and a typed `sourceEntity`, so
# those take the two slots:
#
# - `TYPE` is `Text` and not `Enum`: `eventType` is free text in CamelCase
#   (`VmRecoveryPointSuccessAudit`), not an enum, and `sentence_case` over an underscore-free
#   token would print `Vmrecoverypointsuccessaudit`.
# - `ENTITY` is `Enum` over `sourceEntity.type`, a lowercase word (`vm`, `volume_group`) that
#   sentence-cases into `VM` and `Volume group` beside the name in `SOURCE`.
[kinds."monitoring.serviceability.Event"]
orderby = "creationTime desc"
columns = [
    { header = "TITLE", path = "title", kind = "Text" },
    { header = "TYPE", path = "eventType", kind = "Text" },
    { header = "SOURCE", path = "sourceEntity.name", kind = "Text" },
    { header = "ENTITY", path = "sourceEntity.type", kind = "Enum" },
    { header = "CLUSTER", path = "clusterName", kind = "Text" },
    { header = "CREATED", path = "creationTime", kind = "Timestamp" },
    { header = "AFFECTED", path = "affectedEntities", kind = "Count" },
]

# ── Monitoring: the rest ────────────────────────────────────────────────────────────────────
# Named for what follows it, because four of the Monitoring sidebar group's six kinds are
