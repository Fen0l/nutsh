# ── Hardware ────────────────────────────────────────────────────────────────────────────────
# A disk carries `hostName` *and* `clusterName`, both of which are `NAME_KEYS`, so without
# `name_path` every disk would name itself after the host it is in - in the cache, the detail
# title and the breadcrumb alike. Its own identity is the serial number.
[kinds."clustermgmt.config.Disk"]
name_path = "serialNumber"
columns = [
    { header = "DISK", path = "serialNumber", kind = "Text" },
    { header = "STATUS", path = "status", kind = "Status" },
    { header = "TIER", path = "storageTier", kind = "Enum" },
    { header = "HOST", path = "hostName", kind = "Text" },
    { header = "CLUSTER", path = "clusterExtId", kind = "Reference" },
    { header = "SIZE", path = "diskSizeBytes", kind = "Bytes" },
    { header = "MODEL", path = "model", kind = "Text" },
    { header = "FIRMWARE", path = "firmwareVersion", kind = "Text" },
    { header = "ONLINE", path = "diskAdvanceConfig.isOnline", kind = "Bool" },
    { header = "REMOVING", path = "diskAdvanceConfig.isMarkedForRemoval", kind = "Bool" },
]

[kinds."clustermgmt.config.Disk".status]
# `DiskStatus` is NORMAL plus three words the shared vocabulary has never seen, so without
# these a disk migrating its data off draws exactly like a healthy one. `NORMAL` is already
# `Ok`; the three removal states are the ones that have to say so.
MARKED_FOR_REMOVAL_BUT_NOT_DETACHABLE = "Warn"
DATA_MIGRATION_INITIATED = "Pending"
DETACHABLE = "Ending"

# `mtuInBytes` is `Text` and not `Bytes` on purpose: an MTU is 1500, and `Bytes` would render
# that as `1.5 KiB`, which is true of the number and false of the thing. `linkSpeedInKbps` is
# `Text` for the same reason and carries its unit in the header, because there is no
# bits-per-second `ColumnKind` and a bare `10000000` is not a speed anybody reads.
#
# **No STATUS column.** `interfaceStatus` is an unconstrained string in the schema, and pc.7.6
# fills it with `"0"` and `"1"` - 17 zeroes and 11 ones over the 28 NICs of
# `crates/mockpc/fixtures-lab/clustermgmt/v4.3/config/host-nics.json` (2026-09-10). A digit is
# neither a word a status vocabulary can colour nor a word a person can read, and the two
# repairs available are both worse than removal: a `[kinds.*.status]` block mapping `0` and `1`
# would tint the row correctly and still print `1` under a heading that says STATUS, and no
# `ColumnKind` turns the string `"0"` into a mark (`Bool` reads `as_bool`, which a string is
# not). The fact the digit carries is already on the row and readable: `linkSpeedInKbps` is
# `10000000` on exactly the eleven NICs whose `interfaceStatus` is `"1"` and `0` on the
# seventeen whose it is `"0"`, and those same eleven are the only ones with an LLDP neighbour.
# So the link state is the speed column, and the slot goes to `virtualSwitchExtId` - 28/28,
# and `networking.config.VirtualSwitch` is warmed, so it reads as the switch's name.
#
# **No VLAN column.** `switchVlanId` is "learned through the discovery protocol" and readOnly,
# and neither Prism Central ever sends it: 0/28 on PC1 and 0/12 on sierra. Seventeen of those
# forty NICs *do* see an LLDP neighbour - they carry `switchDeviceId`, `switchMacAddress`,
# `switchManagementIp` and `switchVendorInfo` - so the field is not missing for want of a
# neighbour to learn it from. Empty on both, and never sent even where it could be.
[kinds."clustermgmt.config.HostNic"]
columns = [
    { header = "NIC", path = "name", kind = "Text" },
    { header = "MAC", path = "macAddress", kind = "Text" },
    { header = "SPEED KBPS", path = "linkSpeedInKbps", kind = "Text" },
    { header = "MTU", path = "mtuInBytes", kind = "Text" },
    { header = "VSWITCH", path = "virtualSwitchExtId", kind = "Reference" },
    { header = "SWITCH", path = "switchDeviceId", kind = "Text" },
    { header = "CLUSTER", path = "clusterExtId", kind = "Reference" },
    { header = "MODE", path = "operatingMode", kind = "Enum" },
    { header = "DRIVER", path = "driverVersion", kind = "Text" },
]

[kinds."networking.config.NicProfile"]
columns = [
    { header = "NAME", path = "name", kind = "Text" },
    { header = "MODE", path = "operatingMode", kind = "Enum" },
    { header = "CAPABILITY", path = "capabilityConfig.capabilityType", kind = "Enum" },
    { header = "OWNER", path = "ownerType", kind = "Enum" },
    { header = "FAMILY", path = "nicFamily", kind = "Text" },
    { header = "HOST NICS", path = "hostNicReferences", kind = "Count" },
]

# Both GPU profiles keep their whole identity under `configuration`, so both need `name_path`:
# without it the fleet-wide GPU tables are one `CLUSTER EXT IDS` count, which is what the nav's
# `Physical GPUs` and `Virtual GPUs` show today.
[kinds."clustermgmt.ahv.config.PhysicalGpuProfile"]
name_path = "configuration.name"
columns = [
    { header = "GPU", path = "configuration.name", kind = "Text" },
    { header = "CLUSTERS", path = "clusterExtIds", kind = "Count" },
]

[kinds."clustermgmt.ahv.config.VirtualGpuProfile"]
name_path = "configuration.name"
columns = [
    { header = "PROFILE", path = "configuration.name", kind = "Text" },
    { header = "FRAME BUFFER", path = "configuration.frameBufferSizeBytes", kind = "Bytes" },
    { header = "HEADS", path = "configuration.numberOfVirtualDisplayHeads", kind = "Text" },
    { header = "RESOLUTION", path = "configuration.maxResolution", kind = "Text" },
    { header = "PER VM", path = "configuration.maxInstancesPerVm", kind = "Text" },
    { header = "CLUSTERS", path = "clusterExtIds", kind = "Count" },
    { header = "LICENSES", path = "configuration.licenses", kind = "Count" },
]

# A PCIe device has no name at all; `description` is the model string, and `SKIP_PROPS` keeps it
# out of every fallback, so it has to be curated to appear.
[kinds."clustermgmt.ahv.config.PcieDevice"]
name_path = "description"
columns = [
    { header = "DEVICE", path = "description", kind = "Text" },
    { header = "STATE", path = "state", kind = "Status" },
    { header = "TYPE", path = "type", kind = "Enum" },
