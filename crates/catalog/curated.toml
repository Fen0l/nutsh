# Curated overlay merged into the generated catalog by `cargo xtask gen-catalog`.
# Keys are kind ids: the schema name with the version removed. Unknown ids fail generation.
# Curated columns use the inline form: columns = [ { header = "NAME", path = "name", kind = "Text" } ]

# ── Compute ─────────────────────────────────────────────────────────────────────────────────
[kinds."vmm.ahv.config.Vm"]
display = "Virtual Machines"
aliases = ["vm", "vms"]
category = "Compute"
poll_secs = 5
# `nics[]` carries both `networkInfo`/`backingInfo` and `nicNetworkInfo`/`nicBackingInfo`,
# identically populated; the first pair is `deprecated: true` in the Nic schema. `host.extId`
# is null for a powered-off VM and renders `-`. `IP` is `Ip` and not `Text` so it stops being
# cut: as `Text` it is `Flex(1)` against a `Flex(6)` name column, and the live frame showed
# `192.0.2.135` where the entity has `192.0.2.135,192.0.2.102`.
columns = [
    { header = "NAME", path = "name", kind = "Text" },
    { header = "POWER", path = "powerState", kind = "Status" },
    { header = "CLUSTER", path = "cluster.extId", kind = "Reference" },
    { header = "HOST", path = "host.extId", kind = "Reference" },
    { header = "IP", path = "nics[].nicNetworkInfo.ipv4Config.ipAddress.value", kind = "Ip" },
    { header = "MEM", path = "memorySizeBytes", kind = "Bytes" },
    { header = "SOCKETS", path = "numSockets", kind = "Text" },
    { header = "PROTECTION", path = "protectionType", kind = "Enum" },
    # The Dashboard's VMs pane asks for the creation time; a pane's columns must be a
    # subsequence of the kind's, and this is a column worth having under `w` anyway.
    { header = "CREATED", path = "createTime", kind = "Timestamp" },
]

# The composed detail (`y`). Modelled on Prism Central's own VM page - Details, Policies and
# Management, Compute, Storage, Infrastructure, External Devices, Guest Details - collapsed to
# what the v4 list response carries. Every path resolves against `vmm.v4.3.ahv.config.Vm`;
# `cargo xtask gen-catalog` is what proves it.
#
# `project.extId` is the nil UUID on 89 of 100 recorded VMs and `ownershipInfo.owner.extId` on 86, so
# both read as a dim `-` rather than as an `00000000` stub wherever the PC means "none". The
# other 11 and 14 carry a real project and a real owner, which is what a `Reference` resolves -
# and is why both stay curated rather than being left to the raw view. `host.extId` is absent on a
# powered-off VM (69 of 100 recorded VMs have it). `guestTools` is present on 3 of 100, which is why
# its section is conditional. `gpus[]` and `serialPorts[]` exist only in the synthetic fixture
# and are omitted; `trunkedVlans` exists in no fixture and is not curated. `numNumaNodes`,
# `apcConfig`, `biosUuid` and `generationUuid` are left to the raw view (`Y`).
[[kinds."vmm.ahv.config.Vm".detail]]
title = "Identity"
fields = [
    { label = "Name", path = "name", kind = "Text" },
    { label = "UUID", path = "extId", kind = "Text" },
    { label = "Description", path = "description", kind = "Text" },
    { label = "Project", path = "project.extId", kind = "Reference" },
    { label = "Owner", path = "ownershipInfo.owner.extId", kind = "Reference" },
    { label = "Cloned from", path = "source.extId", kind = "Reference" },
    { label = "Categories", path = "categories", kind = "Count" },
]

[[kinds."vmm.ahv.config.Vm".detail]]
title = "State"
fields = [
    { label = "Power", path = "powerState", kind = "Status" },
    { label = "Agent VM", path = "isAgentVm", kind = "Bool" },
    { label = "Live migratable", path = "isLiveMigrateCapable", kind = "Bool" },
    { label = "Migrating", path = "isCrossClusterMigrationInProgress", kind = "Bool" },
]

[[kinds."vmm.ahv.config.Vm".detail]]
title = "Compute"
fields = [
    { label = "Sockets", path = "numSockets", kind = "Text" },
    { label = "Cores/socket", path = "numCoresPerSocket", kind = "Text" },
    { label = "Threads/core", path = "numThreadsPerCore", kind = "Text" },
    { label = "Memory", path = "memorySizeBytes", kind = "Bytes" },
    { label = "Machine type", path = "machineType", kind = "Enum" },
    { label = "CPU hotplug", path = "isCpuHotplugEnabled", kind = "Bool" },
    { label = "CPU passthrough", path = "isCpuPassthroughEnabled", kind = "Bool" },
    { label = "Hard pinning", path = "isVcpuHardPinningEnabled", kind = "Bool" },
    { label = "Overcommit", path = "isMemoryOvercommitEnabled", kind = "Bool" },
    { label = "vTPM", path = "vtpmConfig.isVtpmEnabled", kind = "Bool" },
    { label = "Clock timezone", path = "hardwareClockTimezone", kind = "Text" },
]

# `bootConfig` is a LegacyBoot or a UefiBoot and an empty "Boot" section would not say which, so
# each variant carries its own title. Both variants are recorded: the recording's 100 VMs are 44
# `LegacyBoot` and 56 `UefiBoot`, and every one of those 56 fills
# `nvramDevice.backingStorageInfo.storageContainer.extId`.
#
# The tag is compared on its **short name**, because the two spellings of one shape coexist in
# the committed corpus - `disks[].backingInfo` is tagged `vmm.v4.r0.b1.ahv.config.VmDisk` in
# `crates/mockpc/fixtures/vmm/v4.3/ahv/config/vms.json` and `vmm.v4.ahv.config.VmDisk` in the
# `disks.json` beside it and on 198 of the recording's 353 disks. A `when` written against
# the full string would be right on one Prism Central build and silently wrong on the next.
[[kinds."vmm.ahv.config.Vm".detail]]
title = "UEFI boot"
when = "bootConfig.$objectType = UefiBoot"
fields = [
    { label = "Boot order", path = "bootConfig.bootOrder[]", kind = "Enum" },
    { label = "Secure boot", path = "bootConfig.isSecureBootEnabled", kind = "Bool" },
    { label = "NVRAM container", path = "bootConfig.nvramDevice.backingStorageInfo.storageContainer.extId", kind = "Reference" },
]

[[kinds."vmm.ahv.config.Vm".detail]]
title = "Legacy boot"
when = "bootConfig.$objectType = LegacyBoot"
fields = [
    { label = "Boot order", path = "bootConfig.bootOrder[]", kind = "Enum" },
    { label = "Boot bus", path = "bootConfig.bootDevice.diskAddress.busType", kind = "Enum" },
    { label = "Boot index", path = "bootConfig.bootDevice.diskAddress.index", kind = "Text" },
]

# `Disk sizes`, not `Total`: `render_value` shows `first +n` and has no aggregation, so the label
# says what the cell holds. A sum is the strongest candidate for a thirteenth `ColumnKind`.
[[kinds."vmm.ahv.config.Vm".detail]]
title = "Storage"
fields = [
    { label = "Disks", path = "disks", kind = "Count" },
    { label = "Disk sizes", path = "disks[].backingInfo.diskSizeBytes", kind = "Bytes" },
    { label = "Bus", path = "disks[].diskAddress.busType", kind = "Enum" },
    { label = "Containers", path = "disks[].backingInfo.storageContainer.extId", kind = "Reference" },
    { label = "Volume groups", path = "disks[].backingInfo.volumeGroupExtId", kind = "Reference" },
    { label = "From image", path = "disks[].backingInfo.dataSource.reference.imageExtId", kind = "Reference" },
    { label = "CD-ROMs", path = "cdRoms", kind = "Count" },
    { label = "ISO type", path = "cdRoms[].isoType", kind = "Enum" },
    { label = "Flash mode", path = "storageConfig.isFlashModeEnabled", kind = "Bool" },
]

# `nics[]` carries both the deprecated `backingInfo`/`networkInfo` pair and the current
# `nicBackingInfo`/`nicNetworkInfo` pair with identical content; the curated columns already use
# the current one, so the detail does too.
[[kinds."vmm.ahv.config.Vm".detail]]
title = "Network"
fields = [
    { label = "NICs", path = "nics", kind = "Count" },
    { label = "MAC", path = "nics[].nicBackingInfo.macAddress", kind = "Text" },
    { label = "IPv4", path = "nics[].nicNetworkInfo.ipv4Config.ipAddress.value", kind = "Ip" },
    { label = "Learned IPv4", path = "nics[].nicNetworkInfo.ipv4Info.learnedIpAddresses[].value", kind = "Ip" },
    { label = "IPv6", path = "nics[].nicNetworkInfo.ipv6Info.learnedIpv6Addresses[].value", kind = "Text" },
    { label = "Subnets", path = "nics[].nicNetworkInfo.subnet.extId", kind = "Reference" },
    { label = "NIC type", path = "nics[].nicNetworkInfo.nicType", kind = "Enum" },
    { label = "Model", path = "nics[].nicBackingInfo.model", kind = "Enum" },
    { label = "VLAN mode", path = "nics[].nicNetworkInfo.vlanMode", kind = "Enum" },
    { label = "Connected", path = "nics[].nicBackingInfo.isConnected", kind = "Bool" },
]

[[kinds."vmm.ahv.config.Vm".detail]]
title = "Protection"
fields = [
    { label = "Protection", path = "protectionType", kind = "Status" },
    { label = "Policy", path = "protectionPolicyState.policy.extId", kind = "Reference" },
]

[[kinds."vmm.ahv.config.Vm".detail]]
title = "Placement"
fields = [
    { label = "Cluster", path = "cluster.extId", kind = "Reference" },
    { label = "Host", path = "host.extId", kind = "Reference" },
]

[[kinds."vmm.ahv.config.Vm".detail]]
title = "Guest"
when = "guestTools"
fields = [
    { label = "Installed", path = "guestTools.isInstalled", kind = "Bool" },
    { label = "Enabled", path = "guestTools.isEnabled", kind = "Bool" },
    { label = "Reachable", path = "guestTools.isReachable", kind = "Bool" },
    { label = "Version", path = "guestTools.version", kind = "Text" },
    { label = "Available", path = "guestTools.availableVersion", kind = "Text" },
    { label = "Guest OS", path = "guestTools.guestOsVersion", kind = "Text" },
    { label = "OS name", path = "guestTools.guestInfo.guestOsFullName", kind = "Text" },
    { label = "VirtIO", path = "guestTools.guestInfo.installedVirtIoVersion", kind = "Text" },
    { label = "Last boot", path = "guestTools.guestInfo.lastBootUpTime", kind = "Timestamp" },
    { label = "DNS name", path = "guestTools.guestInfo.dnsName.value", kind = "Text" },
    { label = "Capabilities", path = "guestTools.capabilities[]", kind = "Enum" },
]

[[kinds."vmm.ahv.config.Vm".detail]]
title = "Lifecycle"
fields = [
    { label = "Created", path = "createTime", kind = "Timestamp" },
    { label = "Updated", path = "updateTime", kind = "Timestamp" },
]

[kinds."vmm.ahv.config.Vm".actions."power-on"]
key = "p"
label = "Power on"
danger = "low"
order = 10

# The eight power verbs, labelled by what they do to the guest rather than by the API name.
# Three of them cut power where they stand - the spec calls them "Force power off", "Force a
# power-cycle" and "Force reset of a Virtual Machine, without waiting for the guest" - and four
# ask the guest to stop, two through ACPI and two through Nutanix Guest Tools. `Reset` beside
# `Reboot` beside `Power cycle` told a reader none of that, and getting it wrong on a database
# is not a mistake the second attempt fixes.
#
# The keys pair by case: `d`/`D` shut down and `r`/`R` reboot, lower case through ACPI and
# upper case through the guest tools, as `p`/`P` already pairs on and off. `g` would have been
# the mnemonic for "guest" and is the table's "go to the top".
[kinds."vmm.ahv.config.Vm".actions."power-off"]
key = "P"
label = "Power off (cuts power)"
danger = "medium"
order = 20

[kinds."vmm.ahv.config.Vm".actions."power-cycle"]
label = "Power cycle (cuts power)"
danger = "medium"
order = 30

[kinds."vmm.ahv.config.Vm".actions."reset"]
label = "Reset (cuts power)"
danger = "medium"
order = 40

[kinds."vmm.ahv.config.Vm".actions."shutdown"]
key = "d"
label = "Shut down (ACPI, asks the guest)"
danger = "medium"
order = 50

[kinds."vmm.ahv.config.Vm".actions."guest-shutdown"]
key = "D"
label = "Shut down (guest tools)"
danger = "medium"
order = 60

[kinds."vmm.ahv.config.Vm".actions."reboot"]
key = "r"
label = "Reboot (ACPI, asks the guest)"
danger = "medium"
order = 70

[kinds."vmm.ahv.config.Vm".actions."guest-reboot"]
key = "R"
label = "Reboot (guest tools)"
danger = "medium"
order = 80

[kinds."vmm.ahv.config.Vm".actions."migrate"]
label = "Migrate to another cluster"
danger = "medium"
order = 90

[kinds."vmm.ahv.config.Vm".actions."migrate-to-host"]
key = "m"
label = "Migrate to host"
danger = "medium"
order = 100

[kinds."vmm.ahv.config.Vm".actions."clone"]
key = "C"
label = "Clone"
danger = "low"
order = 110
form = [ { name = "name", label = "New name", type = "string", required = true } ]

# Snapshotting a VM is a POST to dataprotection recovery points naming the VM, not a VM action
# at all. `$ext_id` and `$now+30d` are expanded at submit time by `core::actions::build_body`;
# a null expirationTime is an HTTP 400.
[kinds."vmm.ahv.config.Vm".actions."snapshot"]
from = "dataprotection.config.RecoveryPoint:create"
key = "s"
label = "Create recovery point"
danger = "low"
order = 120
form = [
  { name = "name", label = "Name", type = "string", required = true },
  { name = "vmRecoveryPoints[0].vmExtId", type = "string", value = "$ext_id", hidden = true },
  { name = "expirationTime", label = "Expires", type = "string", required = true, value = "$now+30d" },
]

[kinds."vmm.ahv.config.Vm".actions."revert"]
label = "Revert to a recovery point"
danger = "high"
order = 130

[kinds."vmm.ahv.config.Vm".actions."delete"]
key = "ctrl-d"
label = "Delete"
danger = "high"
order = 140

[kinds."vmm.esxi.config.Vm"]
display = "ESXi Virtual Machines"
aliases = ["esxivm", "esxi-vms"]
category = "Compute"
poll_secs = 10
# The AHV VM's columns as far as the ESXi schema has them. The addresses are spelled
# differently - an AHV NIC has one `nicNetworkInfo.ipv4Config.ipAddress`, an ESXi NIC has an
# array at `networkInfo.ipAddressInfo.ipv4Addresses[]` of the same `common.v1.0.config.IPv4Address`
# - and it carries `numCpus` where AHV carries `numSockets`.
columns = [
    { header = "NAME", path = "name", kind = "Text" },
    { header = "POWER", path = "powerState", kind = "Status" },
    { header = "CLUSTER", path = "cluster.extId", kind = "Reference" },
    { header = "HOST", path = "host.extId", kind = "Reference" },
    { header = "IP", path = "nics[].networkInfo.ipAddressInfo.ipv4Addresses[].value", kind = "Ip" },
    { header = "MEM", path = "memorySizeBytes", kind = "Bytes" },
    { header = "CPUS", path = "numCpus", kind = "Text" },
    { header = "GUEST OS", path = "guestOsName", kind = "Text" },
    { header = "HW VERSION", path = "virtualHardwareVersion", kind = "Text" },
    { header = "NICS", path = "nics", kind = "Count" },
    { header = "DISKS", path = "disks", kind = "Count" },
]

# A VM's disks and NICs derive one Count column each from their schema, so the drill-down
# would show a column of "-". These are the fields that make such a row worth reading.
[kinds."vmm.ahv.config.Disk"]
columns = [
    { header = "BUS", path = "diskAddress.busType", kind = "Enum" },
    { header = "INDEX", path = "diskAddress.index", kind = "Text" },
    { header = "SIZE", path = "backingInfo.diskSizeBytes", kind = "Bytes" },
    { header = "CONTAINER", path = "backingInfo.storageContainer.extId", kind = "Reference" },
]

# The non-prefixed pair is deprecated in the one Nic schema (`specs/vmm/v4.3.yaml:63434`).
# `IP` is `Ip` rather than `Text` for the reason the VM table's own `IP` column is.
[kinds."vmm.ahv.config.Nic"]
columns = [
    { header = "TYPE", path = "nicNetworkInfo.nicType", kind = "Enum" },
    { header = "MAC", path = "nicBackingInfo.macAddress", kind = "Text" },
    { header = "IP", path = "nicNetworkInfo.ipv4Config.ipAddress.value", kind = "Ip" },
    { header = "SUBNET", path = "nicNetworkInfo.subnet.extId", kind = "Reference" },
]

# ── Compute & Storage ───────────────────────────────────────────────────────────────────────
# The banner marks where the rest of the nav group is curated, not the whole of it: a second
# TOML table with the same key is an error, so the kinds that already had a table keep their
# columns where that table is - the AHV VM and its disks and NICs, the ESXi VM above, and
# Images, Storage Containers, Volume Groups and Categories below.
#
# A template's identity is its name and the version that is live: `templateVersionSpec` is the
# active version's own record, and `createdBy` is a full `iam` User, so the readable field is
# `username` and not a name the schema does not have.
[kinds."vmm.content.Template"]
columns = [
    { header = "NAME", path = "templateName", kind = "Text" },
    { header = "VERSION", path = "templateVersionSpec.versionName", kind = "Text" },
    { header = "ACTIVE", path = "templateVersionSpec.isActiveVersion", kind = "Bool" },
    { header = "CLUSTERS", path = "templateVersionSpec.clusterLocationExtIds", kind = "Count" },
    { header = "CREATED", path = "createTime", kind = "Timestamp" },
    { header = "UPDATED", path = "updateTime", kind = "Timestamp" },
    { header = "CREATED BY", path = "createdBy.username", kind = "Text" },
]

# `parentVm` is an opaque string with no UUID pattern, so it resolves against nothing; the
# readable VM is the one inside the OVA's own captured configuration.
[kinds."vmm.content.Ova"]
columns = [
    { header = "NAME", path = "name", kind = "Text" },
    { header = "FORMAT", path = "diskFormat", kind = "Enum" },
    { header = "SIZE", path = "sizeBytes", kind = "Bytes" },
    { header = "VM", path = "vmConfig.name", kind = "Text" },
    { header = "CLUSTERS", path = "clusterLocationExtIds", kind = "Count" },
    { header = "CREATED", path = "createTime", kind = "Timestamp" },
    { header = "CREATED BY", path = "createdBy.username", kind = "Text" },
    { header = "UPDATED", path = "lastUpdateTime", kind = "Timestamp" },
]

# The profile *is* its `vmConfiguration`: memory, cores and NICs. It has no `createTime` and no
# `createdBy` - only `updateTime` and `updatedBy`.
[kinds."vmm.ahv.config.VmProfile"]
columns = [
    { header = "NAME", path = "name", kind = "Text" },
    { header = "MEMORY", path = "vmConfiguration.memorySizeBytes", kind = "Bytes" },
    { header = "CORES", path = "vmConfiguration.numCores", kind = "Text" },
    { header = "NICS", path = "vmConfiguration.nics", kind = "Count" },
    { header = "PROJECTS", path = "sharedWithProjects", kind = "Count" },
    { header = "UPDATED", path = "updateTime", kind = "Timestamp" },
    { header = "UPDATED BY", path = "updatedBy.extId", kind = "Reference" },
]

# `config` is a one-armed `oneOf` over a sysprep blob: nothing in it is a column.
[kinds."vmm.ahv.config.VmGuestCustomizationProfile"]
columns = [
    { header = "NAME", path = "name", kind = "Text" },
    { header = "CREATED", path = "createTime", kind = "Timestamp" },
    { header = "UPDATED", path = "updateTime", kind = "Timestamp" },
    { header = "CREATED BY", path = "createdBy.extId", kind = "Reference" },
    { header = "UPDATED BY", path = "updatedBy.extId", kind = "Reference" },
]

# Four one-property specs - compression, encryption, fault tolerance and QoS - are what a
# storage policy is; the generated table showed the policy type and a count of categories.
[kinds."datapolicies.config.StoragePolicy"]
columns = [
    { header = "NAME", path = "name", kind = "Text" },
    { header = "TYPE", path = "policyType", kind = "Enum" },
    { header = "COMPRESSION", path = "compressionSpec.compressionState", kind = "Enum" },
    { header = "ENCRYPTION", path = "encryptionSpec.encryptionState", kind = "Enum" },
    { header = "RF", path = "faultToleranceSpec.replicationFactor", kind = "Enum" },
    { header = "IOPS", path = "qosSpec.throttledIops", kind = "Text" },
    { header = "CATEGORIES", path = "categoryExtIds", kind = "Count" },
    { header = "OWNER", path = "ownerUuid", kind = "Reference" },
]

# ── Infrastructure ──────────────────────────────────────────────────────────────────────────
# Prism Central's own row has a null `vmCount`; `containerName` and `inefficientVmCount` never
# appear in a recorded response, so the fallback's two columns over them are dropped.
[kinds."clustermgmt.config.Cluster"]
display = "Clusters"
aliases = ["cluster", "clusters", "cl"]
category = "Infrastructure"
poll_secs = 30
warm = true
columns = [
    { header = "NAME", path = "name", kind = "Text" },
    { header = "MODE", path = "config.operationMode", kind = "Status" },
    { header = "NODES", path = "nodes.numberOfNodes", kind = "Text" },
    { header = "VMS", path = "vmCount", kind = "Text" },
    { header = "VERSION", path = "config.buildInfo.version", kind = "Text" },
    { header = "EXTERNAL IP", path = "network.externalAddress.ipv4.value", kind = "Text" },
    { header = "FT", path = "config.faultToleranceState.currentClusterFaultTolerance", kind = "Enum" },
]

# The Security section is curated from the **schema**, not from the recordings:
# `clustermgmt.v4.config.ClusterConfigReference` declares all three properties and the three recorded
# clusters simply do not return them. That is exactly the case the empty-section rule was written
# for - it costs nothing on a cluster that omits them and is the first thing a security review
# looks for on one that does not. `config.isPasswordRemoteLoginEnabled` is a different story: the
# recorder writes the literal string "[redacted]" over it despite its boolean name, so it is
# omitted. Deviation 8: "Encryption in transit" is 21 characters, past DETAIL_LABEL, so it reads
# "In transit" - the heading carries the subject. Width is the only reason to drop the word:
# "Encryption option" (17) and "Encryption scope" (16) both fit, and under a heading that says
# Security rather than Encryption a bare "Option" and "Scope" say almost nothing, so both keep
# the design's words.
[[kinds."clustermgmt.config.Cluster".detail]]
title = "Identity"
fields = [
    { label = "Name", path = "name", kind = "Text" },
    { label = "UUID", path = "extId", kind = "Text" },
    { label = "Function", path = "config.clusterFunction[]", kind = "Enum" },
    { label = "Type", path = "config.clusterType", kind = "Enum" },
    { label = "Architecture", path = "config.clusterArch", kind = "Enum" },
]

[[kinds."clustermgmt.config.Cluster".detail]]
title = "State"
fields = [
    { label = "Mode", path = "config.operationMode", kind = "Status" },
    { label = "Available", path = "config.isAvailable", kind = "Bool" },
    { label = "Upgrade", path = "upgradeStatus", kind = "Status" },
    { label = "LTS", path = "config.isLts", kind = "Bool" },
]

[[kinds."clustermgmt.config.Cluster".detail]]
title = "Nodes"
fields = [
    { label = "Nodes", path = "nodes.numberOfNodes", kind = "Text" },
    { label = "VMs", path = "vmCount", kind = "Text" },
    { label = "Host IPs", path = "nodes.nodeList[].hostIp.ipv4.value", kind = "Ip" },
    { label = "CVM IPs", path = "nodes.nodeList[].controllerVmIp.ipv4.value", kind = "Ip" },
]

[[kinds."clustermgmt.config.Cluster".detail]]
title = "Versions"
fields = [
    { label = "AOS", path = "config.buildInfo.version", kind = "Text" },
    { label = "Full", path = "config.buildInfo.fullVersion", kind = "Text" },
    { label = "Hypervisors", path = "config.hypervisorTypes[]", kind = "Enum" },
    { label = "Software", path = "config.clusterSoftwareMap[].version", kind = "Text" },
]

[[kinds."clustermgmt.config.Cluster".detail]]
title = "Resilience"
fields = [
    { label = "RF", path = "config.redundancyFactor", kind = "Text" },
    { label = "Current FT", path = "config.faultToleranceState.currentClusterFaultTolerance", kind = "Enum" },
    { label = "Desired FT", path = "config.faultToleranceState.desiredClusterFaultTolerance", kind = "Enum" },
    { label = "Domain", path = "config.faultToleranceState.domainAwarenessLevel", kind = "Enum" },
    { label = "Rack aware", path = "config.faultToleranceState.isStrictRackAwarenessEnabled", kind = "Bool" },
    { label = "Backup score", path = "backupEligibilityScore", kind = "Text" },
]

[[kinds."clustermgmt.config.Cluster".detail]]
title = "Network"
fields = [
