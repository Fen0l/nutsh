# The Host cluster reference is `cluster.uuid`, the only one of the eleven spelled that way, and
# the reason `action_parents` reads it. `MAINTENANCE` is second so the column that tints the row
# is visible without scrolling. `bootTimeUsecs` is int64 microseconds, which `ColumnKind::Micros`
# renders as an age, which is what makes an uptime column possible at all.
[kinds."clustermgmt.config.Host"]
display = "Hosts"
aliases = ["host", "hosts", "node", "nodes"]
category = "Infrastructure"
poll_secs = 15
warm = true
actions_from = "clustermgmt.config.Host~hosts"
action_parents = ["cluster.uuid"]
columns = [
    { header = "HOST", path = "hostName", kind = "Text" },
    { header = "MAINTENANCE", path = "maintenanceState", kind = "Status" },
    { header = "CLUSTER", path = "cluster.uuid", kind = "Reference" },
    { header = "HYPERVISOR", path = "hypervisor.type", kind = "Enum" },
    { header = "CVM IP", path = "controllerVm.externalAddress.ipv4.value", kind = "Ip" },
    { header = "HYPERVISOR IP", path = "hypervisor.externalAddress.ipv4.value", kind = "Ip" },
    { header = "VMS", path = "hypervisor.numberOfVms", kind = "Text" },
    { header = "UPTIME", path = "bootTimeUsecs", kind = "Micros" },
]

# `bootTimeUsecs` is what `Micros` exists for: `curated.toml` records above that "there is no
# uptime column" because `Timestamp` could not render it; the detail has one. `cluster.name` is a
# real name on the host object, so it is `Text` and not a `Reference` lookup. The host carries no
# AOS version - that lives on the cluster. `gpuList[]` holds a single empty string on all seven
# recorded hosts, so it is `Text` (a dim `-`) and never a `Count`, which would claim one GPU.
# `cpuFrequencyHz` is 2600000000 and there is no `Hertz` kind for one field on one kind, so it is
# left to the raw view. The disk array key is singular: `disk`.
