# Ordered to match the Disaster Recovery page's Registered Prism Centrals pane, which is a
# subsequence of this: the two curation sites are checked against each other by the generator,
# so a reorder here without one there fails generation.
#
# Three `Status` columns, all inside the default six, and `STATE` leads them on purpose. Only
# one column tints a row - `table::status_index` takes the first `Status` column of the shown
# set, and `ui::render_rows` paints that one cell with `role_fg` and every other cell of the
# row with `row_fg` of the same word - so the column that leads is the one the row's colour
# means. `registrationState` is this kind's own health, an enum whose every word the `.status`
# block below maps; `platformData` is an optional object and `connectivityStatus` an
# unconstrained string, so with `CONNECTIVITY` leading, a Prism Central that answers without
# `platformData` drew `-`, which normalises to `_`, and a `REGISTRATION_ERROR` row came out
# Muted grey.
#
# `CONNECTIVITY` and `CREDENTIALS` therefore draw in the row's own colour whatever they say:
# an `EXPIRED` credential on a `REGISTERED` Prism Central is not shouted in its own cell, and
# no arrangement of one tinting column would let it be. Their words reach `status::role_in`
# when `→` scrolls `STATE` off the left and one of them becomes the first shown `Status`
# column, which is the other half of why the block below maps them.
[kinds."multidomain.config.RegisteredDomain"]
display = "Registered Prism Centrals"
aliases = ["registered", "registered-domain", "registered-domains"]
category = "Platform"
columns = [
    { header = "NAME", path = "name", kind = "Text" },
    { header = "PC VERSION", path = "platformData.pcVersion", kind = "Text" },
    { header = "CLUSTERS", path = "platformData.clusterCount", kind = "Text" },
    { header = "STATE", path = "registrationState", kind = "Status" },
    { header = "CONNECTIVITY", path = "platformData.connectivityStatus", kind = "Status" },
    { header = "CREDENTIALS", path = "apiCredentialStatus", kind = "Status" },
    { header = "REGISTERED", path = "registeredTime", kind = "Timestamp" },
    { header = "FQDN", path = "fqdn", kind = "Text" },
]

[kinds."multidomain.config.RegisteredDomain".status]
# `multidomain.v4.3.common.RegistrationState` (specs/multidomain/v4.3.yaml L4932) and
# `multidomain.v4.3.config.ApiCredentialStatus` (L4986) share no word with the vocabulary in
# `nutsh_core::status`, which matches whole normalised words: `REGISTRATION_ERROR` is not
# `ERROR`, and `EXPIRED` is not in it at all. Both enums are mapped whole, and no word of one
# collides with a word of the other. `platformData.connectivityStatus` is deliberately absent:
# it is an unconstrained string rather than an enum, and the words a Prism Central writes there
# - `CONNECTED`, `DISCONNECTED` - the vocabulary already knows.
#
# The Disaster Recovery page's Registered Prism Centrals pane draws `registrationState` too,
# with `STATE` ahead of `CONNECTIVITY` there for the reason it leads here, so the pane's rows
# take their colour from these words as well: `ui::render_rows` asks `status::role_in` about
# the pane's own kind, and a pane and a table can no more disagree about a word than about a
# column.
#
# The mock's one row (`crates/mockpc/fixtures/multidomain/v4.3/config/registered-domains.json`)
# says `registrationState: "ACTIVE"`, which is not a word of `RegistrationState` at all: it
# colours Ok off the shared vocabulary rather than off this block, so nothing here is
# exercised by a snapshot yet, and the same row carries `dnsName` and no `fqdn`, so the FQDN
# column draws blank on every mock row. Whether real rows carry `fqdn` or only `dnsName` is
# unsettled.
REGISTRATION_ERROR = "Error"
UNREGISTRATION_ERROR = "Error"
EXPIRED = "Error"
REGISTERING = "Pending"
UNREGISTERING = "Pending"
REGISTERED = "Ok"
VALID = "Ok"
NEAR_EXPIRY = "Warn"
UNREGISTERED = "Muted"
DRAFT = "Muted"

