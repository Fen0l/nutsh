# ── Operations ──────────────────────────────────────────────────────────────────────────────
# `completedTime`, not `completionTime`; task extIds are base64-prefixed (`ZXJnb24=:<uuid>`).
[kinds."prism.config.Task"]
display = "Tasks"
aliases = ["task", "tasks"]
category = "Operations"
poll_secs = 3
# A Prism Central keeps every task it ever ran: the recording holds 6109 of them, 62 pages at a
# second a page, re-walked every 3 s. The newest 500, which is what the screen can show,
# arrive in five pages; the header's `500/6109` says the rest are there, and a `$filter` or a
# pane's own `orderby` is how the older ones are reached until the filter grammar lands.
# `createdTime` is sortable: the pinned `specs/prism/v4.4.yaml` declares twelve `$orderby`
# fields for `listTasks` (L11175), `createdTime`, `startedTime`, `completedTime` and
# `lastUpdatedTime` among them. (An earlier note here said the allowlist held `appName`
# alone; that was true of v4.0/v4.1 and is not true of the version this catalog pins.)
orderby = "createdTime desc"
# The change-probe's field, and deliberately *not* the order above: a probe over a creation
# time cannot see a task go RUNNING → SUCCEEDED, which is the most important change on the
# busiest table in the program. `lastUpdatedTime` is on every row of
# `crates/mockpc/fixtures-lab/prism/v4.4/config/tasks.json`, and is one of the twelve
# `$orderby` fields the pinned spec declares for `listTasks`.
probe_by = "lastUpdatedTime"
max_rows = 500
columns = [
    { header = "OPERATION", path = "operationDescription", kind = "Text" },
    { header = "STATUS", path = "status", kind = "Status" },
    { header = "PROGRESS", path = "progressPercentage", kind = "Percent" },
    { header = "ENTITY", path = "entitiesAffected[].name", kind = "Text" },
    { header = "STARTED", path = "startedTime", kind = "Timestamp" },
    { header = "COMPLETED", path = "completedTime", kind = "Timestamp" },
    { header = "CANCELABLE", path = "isCancelable", kind = "Bool" },
]

# The affected-entity *type* is `rel` ("volumes:config:volume-group"), not `type`; the completion
# timestamp is `completedTime`, not `completionTime`; `legacyErrorMessage` appears in neither
# fixture and is not curated. The Errors section disappears on a task that succeeded, which is
# 100 of 100 recorded tasks - exactly what the empty-section rule is for. `Percent` here is what
# the curated `PROGRESS` **column** should also become.
#
# Deviation 1: there is no `subSteps[].status`. `prism.v4.4.config.TaskStep` declares exactly one
# property, `name`, with `additionalProperties: false`, and the recording's six tasks that carry
# `subSteps` carry `name` and `$objectType` and nothing else. The field is dropped rather than
# replaced.
[[kinds."prism.config.Task".detail]]
title = "What"
fields = [
    { label = "Operation", path = "operation", kind = "Enum" },
    { label = "Description", path = "operationDescription", kind = "Text" },
    { label = "Status", path = "status", kind = "Status" },
    { label = "Progress", path = "progressPercentage", kind = "Percent" },
    { label = "Cancelable", path = "isCancelable", kind = "Bool" },
    { label = "Owner", path = "ownedBy.name", kind = "Text" },
]

[[kinds."prism.config.Task".detail]]
title = "Timing"
fields = [
    { label = "Created", path = "createdTime", kind = "Timestamp" },
    { label = "Started", path = "startedTime", kind = "Timestamp" },
    { label = "Completed", path = "completedTime", kind = "Timestamp" },
    { label = "Updated", path = "lastUpdatedTime", kind = "Timestamp" },
]

[[kinds."prism.config.Task".detail]]
title = "Entities"
fields = [
    { label = "Entities", path = "numberOfEntitiesAffected", kind = "Text" },
    { label = "Name", path = "entitiesAffected[].name", kind = "Text" },
    { label = "Type", path = "entitiesAffected[].rel", kind = "Text" },
    { label = "Clusters", path = "clusterExtIds[]", kind = "Reference" },
]

[[kinds."prism.config.Task".detail]]
title = "Hierarchy"
fields = [
    { label = "Parent", path = "parentTask.extId", kind = "Text" },
    { label = "Root", path = "rootTask.extId", kind = "Text" },
    { label = "Subtasks", path = "numberOfSubtasks", kind = "Text" },
    { label = "Steps", path = "subSteps[].name", kind = "Text" },
]

[[kinds."prism.config.Task".detail]]
title = "Errors"
fields = [
    { label = "Code", path = "errorMessages[].code", kind = "Text" },
    { label = "Message", path = "errorMessages[].message", kind = "Text" },
    { label = "Severity", path = "errorMessages[].severity", kind = "Status" },
]

[[kinds."prism.config.Task".detail]]
title = "Result"
fields = [
    { label = "Key", path = "completionDetails[].name", kind = "Text" },
    { label = "Value", path = "completionDetails[].value", kind = "Text" },
]

[kinds."prism.config.Task".status]
# A queued task is noise on a busy Prism Central, not a warning.
QUEUED = "Muted"

[kinds."prism.config.Task".actions."cancel"]
key = "c"
label = "Cancel task"
danger = "medium"
needs_etag = false   # spec declares no If-Match and no requestBody.

# `title` is the rendered sentence; `message` is the un-substituted template. `status` collapses
# `isAcknowledged`/`isResolved` into one cell and is exactly what the two curated actions change.
# Severity is what an alert row is read by: the first `Status` column tints the row.
[kinds."monitoring.serviceability.Alert"]
display = "Alerts"
aliases = ["alert", "alerts"]
category = "Operations"
poll_secs = 10
# 1559 alerts in the recording, 16 pages. Newest first, capped like tasks; the header's
# `500/1559` says the rest are there. `creationTime` is sortable: the pinned
# `specs/monitoring/v4.3.yaml` declares nine `$orderby` fields for `listAlerts` (L911),
# `creationTime`, `lastOccurredTime` and `lastUpdatedTime` among them. (An earlier note here
# said the monitoring spec declared no allowlist at all; that was true of v4.0/v4.1 and is
# not true of the version this catalog pins. `acknowledgedTime` and `resolvedTime` are
# date-times on the schema but are *not* in the allowlist - do not curate those.)
orderby = "creationTime desc"
# See the Task entry: the probe's order is last-modified, the table's is creation.
# `lastUpdatedTime` is on every row of
# `crates/mockpc/fixtures-lab/monitoring/v4.3/serviceability/alerts.json` and is one of the
# nine `$orderby` fields the pinned spec declares for `listAlerts`.
probe_by = "lastUpdatedTime"
max_rows = 500
columns = [
    { header = "SEVERITY", path = "severity", kind = "Status" },
    { header = "STATUS", path = "status", kind = "Status" },
    { header = "TITLE", path = "title", kind = "Text" },
    { header = "SOURCE", path = "sourceEntity.name", kind = "Text" },
    { header = "CLUSTER", path = "clusterName", kind = "Text" },
    { header = "CREATED", path = "creationTime", kind = "Timestamp" },
    { header = "LAST", path = "lastOccurredTime", kind = "Timestamp" },
]

# Cause is placed **second**, above Where and Timing, deliberately: it is the single most useful
# thing in a Nutanix alert ("IAMv2 Authn has performance issues" / "Check the iam-user-authn and
# iam-proxy pods on MSP") and today it is sixty lines into a YAML dump. There is no
# `acknowledgedBy`/`resolvedBy` in any of the 100 recorded alerts, so neither is curated.
[[kinds."monitoring.serviceability.Alert".detail]]
title = "What happened"
fields = [
    { label = "Title", path = "title", kind = "Text" },
    { label = "Message", path = "message", kind = "Text" },
    { label = "Severity", path = "severity", kind = "Status" },
    { label = "Status", path = "status", kind = "Status" },
    { label = "Code", path = "alertType", kind = "Text" },
    { label = "Service", path = "serviceName", kind = "Text" },
]

[[kinds."monitoring.serviceability.Alert".detail]]
