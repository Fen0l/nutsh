]

# The identity of a floating IP is the address, not the optional name - which is why the first
# column is `Ip` and `table::rule` has an arm for exactly that.
#
# Four of the six columns were rewritten from the recording
# (`crates/mockpc/fixtures-lab/networking/v4.4/config/floating-ips.json`, 7 rows, 2026-09-10),
# which fills none of the four fields the schema promised and all four of their siblings:
#
# - `floatingIpValue` is `readOnly` and never sent; the address is `floatingIp.ipv4.value` on
#   7/7. (`floatingIp.ipv6.value` is the other half of `FloatingIPAddress` and no recorded row has
#   one; a column takes one path, and v4 is the one that fills.)
# - `privateIp`, the flat `readOnly` string, is likewise never sent. The private address lives
#   under the association - `association.privateIp.ipv4.value` - on 5/5 associated rows.
# - `vpc.extId` is `$expand`-only, and so, on this Prism Central, is the flat `vpcReference`
#   beside it: the VPC arrives inside the association, on every one of the five. `association`
#   is a `oneOf` and all three arms (`VmNicAssociation`, `PrivateIpAssociation`,
#   `LoadBalancerSessionAssociation`) declare `vpcReference` and `privateIp`, so both paths
#   resolve whatever a row is associated to.
# - `externalSubnet.extId` is `$expand`-only; `externalSubnetReference` is on 7/7, and
#   `networking.config.Subnet` is warmed, so it reads as the subnet's name.
[kinds."networking.config.FloatingIp"]
columns = [
    { header = "IP", path = "floatingIp.ipv4.value", kind = "Ip" },
    { header = "ASSOCIATION", path = "associationStatus", kind = "Status" },
    { header = "PRIVATE IP", path = "association.privateIp.ipv4.value", kind = "Ip" },
    { header = "VPC", path = "association.vpcReference", kind = "Reference" },
    { header = "SUBNET", path = "externalSubnetReference", kind = "Reference" },
    { header = "NAME", path = "name", kind = "Text" },
]

# `isQuickMode` is writeOnly and always renders `-`, so it is not a column at any position.
[kinds."networking.config.VirtualSwitch"]
warm = true
columns = [
    { header = "NAME", path = "name", kind = "Text" },
    { header = "BOND MODE", path = "bondMode", kind = "Enum" },
    { header = "DEFAULT", path = "isDefault", kind = "Bool" },
    { header = "MTU", path = "mtu", kind = "Text" },
    { header = "CLUSTERS", path = "clusters", kind = "Count" },
    { header = "OWNER", path = "ownerType", kind = "Enum" },
    { header = "UPDATING", path = "hasUpdateInProgress", kind = "Bool" },
    { header = "ERROR", path = "hasDeploymentError", kind = "Bool" },
]

# A stretch is two states - the tunnel and the interface - and the round trip between them.
# Those three live under `remoteStretchStatus[].status` and **not** under the top-level
# `stretchStatus`, which pc.7.6 does not send at all: the one stretch in
# `crates/mockpc/fixtures-lab/networking/v4.4/config/layer2-stretches.json` (2026-09-10)
# answers with a list of three per-VTEP `RemoteVtepStretchStatus`, each holding the same
# `StretchStatus` object the singular field would have held. So the three paths move under the
# list and keep their fields; `[]` fans out, and `render_cell` collapses three identical `UP`s
# into one cell, printing `UP +n` only when the VTEPs disagree.
#
# `INTERFACE` leads because it is the one of the three this Prism Central fills (`UP` on 3/3
# VTEPs) and `table::status_index` paints the row from the *first* `Status` column: with
# `TUNNEL` first, every stretch row would take its colour from an absence and come out Muted.
# `TUNNEL` and `RTT MS` are empty here and stay - the shape is right now, and an empty column
# on one Prism Central is not a dropped column.
[kinds."networking.config.Layer2Stretch"]
columns = [
    { header = "NAME", path = "name", kind = "Text" },
    { header = "TYPE", path = "connectionType", kind = "Enum" },
    { header = "INTERFACE", path = "remoteStretchStatus[].status.interfaceState", kind = "Status" },
    { header = "TUNNEL", path = "remoteStretchStatus[].status.tunnelState", kind = "Status" },
    { header = "RTT MS", path = "remoteStretchStatus[].status.roundTripTimeMillis", kind = "Text" },
    { header = "VNI", path = "vni", kind = "Text" },
    { header = "MTU", path = "mtu", kind = "Text" },
    { header = "REMOTES", path = "remoteStretchStatus", kind = "Count" },
]

# Warmed: `localGatewayReference` and `remoteGatewayReference` are inside the default six of
# both the VPN connection and the BGP session below - four references, the count §4.3 warms
# `vpc.extId` and `host.extId` for - and a gateway is listable and names itself at the top
# level. Without it those four columns are 8-hex stubs nothing can ever resolve.
#
# `vpcReference` and not `vpc.extId`: the object half of the pair is `$expand`-only, and the
# flat half is what the list sends - on the one gateway of four that belongs to a VPC in
# `crates/mockpc/fixtures-lab/networking/v4.4/config/gateways.json` (2026-09-10). This is the
# spelling `networking.config.LoadBalancerSession` already curates, and its `VPC` fills 2/2.
[kinds."networking.config.Gateway"]
warm = true
columns = [
    { header = "NAME", path = "name", kind = "Text" },
    { header = "ACTIVE", path = "isActive", kind = "Bool" },
    { header = "VPC", path = "vpcReference", kind = "Reference" },
    { header = "VENDOR", path = "gatewayDeviceVendor", kind = "Text" },
    { header = "VERSION", path = "installedSoftwareVersion", kind = "Text" },
    { header = "SUPPORTED", path = "supportedSoftwareVersion", kind = "Text" },
]

# Both gateway references are flat UUID strings, so §6.2's pattern rule already types them
# `Reference`, and `networking.config.Gateway` is warmed above so the warm-up names them rather
# than leaving two 8-hex stubs inside the default six. `preSharedKey` lives under `ipsecConfig`,
# which the recorder and the column rules both refuse.
[kinds."networking.config.VpnConnection"]
columns = [
    { header = "NAME", path = "name", kind = "Text" },
    { header = "IPSEC", path = "ipsecTunnelStatus.state", kind = "Status" },
    { header = "BGP", path = "ebgpStatus.state", kind = "Status" },
    { header = "ROLE", path = "localGatewayRole", kind = "Enum" },
    { header = "LOCAL GW", path = "localGatewayReference", kind = "Reference" },
    { header = "REMOTE GW", path = "remoteGatewayReference", kind = "Reference" },
    { header = "ADVERTISED", path = "advertisedPrefixes", kind = "Count" },
    { header = "LEARNED", path = "learnedPrefixes", kind = "Count" },
]

# Explicitly **not** `password`, which is `writeOnly` and `format: password` and was the fourth
# column of the generated table.
[kinds."networking.config.BgpSession"]
columns = [
    { header = "NAME", path = "name", kind = "Text" },
    { header = "STATUS", path = "status.state", kind = "Status" },
    { header = "LOCAL GW", path = "localGatewayReference", kind = "Reference" },
    { header = "REMOTE GW", path = "remoteGatewayReference", kind = "Reference" },
    { header = "PRIORITY", path = "dynamicRoutePriority", kind = "Text" },
