# Used and free bytes are **not on the entity**: the recording response's `links[]` points at
# `/clustermgmt/v4.3/stats/storage-containers/{id}`, a separate endpoint this phase does not
# call. That is why Capacity says `Max` and not `Used`, and it is the honest answer to "how full
# is it". Deviation 8: "Reserved (explicit)" and "NFS whitelist inherited" are past
# `DETAIL_LABEL` (23 characters for the second), so they read "Explicit reserved" and "NFS list
# inherited". The predicate is the half that had to survive: `isNfsWhitelistInherited` says the
# whitelist is *inherited*, and a bare "NFS whitelist  yes" reads as "there is one". "Marked for
# removal" spends all eighteen characters on the same rule, so the neighbour it sits next to is
# already the precedent for keeping the verb over the noun.
[[kinds."clustermgmt.config.StorageContainer".detail]]
title = "Identity"
fields = [
    { label = "Name", path = "name", kind = "Text" },
