# Compliance has no `name` at all, so the first column is a `Reference` - which the warm-up
# resolves, because `clustermgmt.config.Cluster` is one of the eleven warmed kinds. `table::rule`
# anchors column 0 at `Flex(6)` for every kind but `Ip`, so a name of any length fits.
#
# The reference is `extId`, not `clusterExtId`. `clusterExtId` is empty on all five compliance
# rows of the two recordings (2026-09-10) and `extId` is on all five - and `extId` *is* the
# cluster: PC1's three are exactly the three clusters of
# `crates/mockpc/fixtures-lab/clustermgmt/v4.3/config/clusters.json`, and sierra's
# `000656bb-…-c1ce` is the cluster every one of its host NICs names. A compliance row is one
