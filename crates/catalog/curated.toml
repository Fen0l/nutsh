    { header = "PARTITIONS", path = "maxPartitions", kind = "Text" },
]

[kinds."clustermgmt.ahv.config.PcieDevice".status]
# `PcieDeviceState` prefixes every word with who owns the device, so none of them is in the
# shared vocabulary and a broken card would draw exactly like an available one. Only the three
# words that are about health are mapped: `HOST_USED`, `HOST_UNUSED` and `HOST_PARTITIONED`
# say which side of the hypervisor a working device is on, not whether it is well, so they
# keep `Role::Neutral`.
HOST_BROKEN = "Error"
UVM_AVAILABLE = "Ok"
UVM_ASSIGNED = "Ok"
UVM_RESERVED = "Pending"

# `config` is a three-armed `oneOf` whose every arm carries a username and a password: nothing
