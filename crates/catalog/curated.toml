# Three properties in the whole schema, and one of the three is `accessInformation`: a `oneOf`
# over `AzureAccessInformation` (`endpointUrl`, `clientId`, the writeOnly `clientSecret`,
# `credentialExpiryDate`) and `KmipAccessInformation` (`caName`, `certPem`, the writeOnly
# `privateKey`). Not one of those is a column at any position, and not because they are all
# secret: `accessinformation` is itself a `SECRET_KEY_MARKER`, so `nutsh_core::cache` deletes the
# whole subtree from every row it writes to disk and a column under it would draw `-` on every
# cache-restored frame. `crates/catalog/tests/secret.rs::no_curated_column_is_blanked_by_the_scrub`
# is where that is asserted, and it is what refuses the endpoint, the CA name and the credential
# expiry the plan asked for here.
#
# So the KMS table is the two properties a cached row still has. `creationTimestamp` is
# `format: date`, so `Text` for the reason `licensing.config.License`'s `expiryDate` is.
#
# That is a shut door and not a wall. `SECRET_KEY_KEEP`, in `crates/catalog/src/secret.rs`, is
# the door: `bucketsaccesskeys` sits on that list precisely because it is a *container* whose
# members a recursive walk judges on their own merits, and `accessInformation` is the identical
# case - `clientSecret`, `privateKey` and `truncatedClientSecret`, which is a piece of one, are
# all still caught one level down by the `secret` and `privatekey` markers, correctly. It was
# left shut on purpose. Widening the scrub's keep-list is a security decision that owes its own
# justification and its own entry in
# `crates/catalog/tests/secret.rs::every_kept_name_survives_the_markers`, and this task curates
# columns; a follow-up that opens it restores ENDPOINT and CA here with no other change.
#
# EXPIRES costs a second entry. `accessInformation.credentialExpiryDate` carries the
# `credential` marker in its own name, so the recursive walk deletes it one level down whatever
# happens to its parent: it needs `credentialexpirydate` on the keep-list for the reason
# `apicredentialstatus` and `credentialissuer` are already on it - a name that *describes* a
# credential rather than being one.
[kinds."security.config.KeyManagementServer"]
display = "Key Management Servers"
aliases = ["kms", "key-management-server", "key-management-servers"]
category = "Security"
columns = [
    { header = "NAME", path = "name", kind = "Text" },
    { header = "CREATED", path = "creationTimestamp", kind = "Text" },
]

# One property. `files.v4.0.config.FileServer` declares `name` and nothing else - the whole
# schema body is fifteen lines of `specs/files/v4.0.yaml` (L31307) - so the Files screen is one
# column because the API has one field, not because the heuristic gave up. Curated so the file
# records that, and so `no_curated_column_shows_an_identifier_as_text` covers it.
[kinds."files.config.FileServer"]
display = "File Servers"
aliases = ["files", "file-server", "file-servers"]
category = "Storage"
columns = [
    { header = "NAME", path = "name", kind = "Text" },
]

[kinds."objects.config.ObjectStore"]
display = "Object Stores"
aliases = ["objects", "object-store", "object-stores"]
category = "Storage"
# A pane's columns must be a subsequence of these, so the Objects page needs CLUSTER and TIERED
# here. `totalCapacityGiB` is left out: gibibytes where every other size on the row is bytes.
columns = [
    { header = "NAME", path = "name", kind = "Text" },
    { header = "STATE", path = "state", kind = "Status" },
    { header = "CLUSTER", path = "clusterExtId", kind = "Reference" },
    { header = "DOMAIN", path = "domain", kind = "Text" },
    { header = "BUCKETS", path = "bucketCount", kind = "Text" },
    { header = "OBJECTS", path = "objectCount", kind = "Text" },
    { header = "USED", path = "storageUsageBytes", kind = "Bytes" },
    { header = "TIERED", path = "tieredUsageBytes", kind = "Bytes" },
]

[kinds."objects.config.ObjectStore".status]
# `objects.v4.1.config.State` (specs/objects/v4.1.yaml L6445) writes the object store into
# every one of its ten words, so none of them is in the shared vocabulary - which matches whole
# normalised words, not substrings - and a store whose deployment failed drew exactly like an
# available one. Nine of the ten are mapped, by what they say about the store: failed, ready,
# working, going away. `UNDEPLOYED_OBJECT_STORE` is deliberately left `Role::Neutral` - a store
# nobody has deployed is neither well nor unwell, and it is where every object store starts.
OBJECT_STORE_DEPLOYMENT_FAILED = "Error"
OBJECT_STORE_CERT_CREATION_FAILED = "Error"
OBJECT_STORE_DELETION_FAILED = "Error"
OBJECT_STORE_OPERATION_FAILED = "Error"
OBJECT_STORE_AVAILABLE = "Ok"
DEPLOYING_OBJECT_STORE = "Pending"
CREATING_OBJECT_STORE_CERT = "Pending"
OBJECT_STORE_OPERATION_PENDING = "Pending"
DELETING_OBJECT_STORE = "Ending"

[kinds."objects.config.Bucket"]
display = "Buckets"
aliases = ["bucket", "buckets"]
# The parent's, not the namespace's: a bucket is only reached through a store.
category = "Storage"
# A bucket has no `extId`. The default would go into `$select` and key the cache as `None`.
ext_id_key = "name"
columns = [
    { header = "NAME", path = "name", kind = "Text" },
    { header = "STATE", path = "state", kind = "Status" },
    { header = "OWNER", path = "ownerName", kind = "Text" },
    # Not `Count`: that is an array length, and this is a scalar.
    { header = "OBJECTS", path = "objectCount", kind = "Text" },
    { header = "USED", path = "storageUsageBytes", kind = "Bytes" },
    { header = "VERSIONING", path = "versioningState", kind = "Enum" },
    { header = "LOCK", path = "isObjectLockEnabled", kind = "Bool" },
    { header = "TIERED", path = "tieredUsageBytes", kind = "Bytes" },
]

# No `[.status]`: `NORMAL` and `DELETING` are both in the shared vocabulary.
# No UUID field below: the schema declares no `extId`.
[[kinds."objects.config.Bucket".detail]]
title = "Identity"
fields = [
