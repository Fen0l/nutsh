# `expiryDate` is `format: date`, not `date-time`, so it is `Text` and not `Timestamp`: a
# `Timestamp` column is `Cap(7)` and would cut `2027-01-31` to `2027-01`, and an expiry you have
# to widen the table to read is worse than none. `name`, `type`, `category`, `subCategory` and
# `expiryDate` are inherited from `BaseLicenseInfo`. The recording confirms the format -
# `"expiryDate": "2026-12-10"` on all five rows of
# `crates/mockpc/fixtures-lab/licensing/v4.4/config/licenses.json` (2026-09-10) - and `Text` is
# still the answer, for a second reason the first note guessed at: `Timestamp` does not render
# `-` on a date-only string, it falls through `parse_rfc3339` to `plain` and prints the same
# ten characters **dim**, as though the date were an age like `3d`. `Text` prints the date the
# Prism Central sent, in the row's own tint, which is what it is.
#
# No `SUB CATEGORY ← subCategory`. It is populated - with `"$UNKNOWN"`, on 5/5 - which is the
# v4 sentinel for a value the negotiated version cannot name, arriving as data. An `Enum` cell
# strips the `$` and sentence-cases what is left, so the column reads `Unknown` on every row
# for ever; `Status` would be worse, since `normalize_status` takes `$UNKNOWN` to `UNKNOWN` and
# the vocabulary maps that to `Role::Muted`, greying every licence row off a value that says
# nothing. The seventh slot goes instead to `salesforceLicenseId`, which is filled and distinct
# on 5/5 (`NUS-PRO-INCLUDED`, `LIC-02558494`) and is the identifier a licence is chased down
# by. The second Prism Central was asked, on 2026-09-10, and it does name a real sub-category:
# `ADDON`, on 1 of its 5 licences. The column still does not earn the slot back - 9 of the 10
# licences across the two labs are `$UNKNOWN`, so the column would read `Unknown` nine times
# out of ten against a `salesforceLicenseId` that is filled and distinct on 10/10. Restoring it
# is still one line, and the condition it was waiting on has now been tested rather than left.
#
# `consumptionDetails` needs `$expand=consumptionDetails` - it is the one field in the
# `$expand` allowlist `listLicenses` declares (specs/licensing/v4.4.yaml L3964) - which the
# table never sends, so no count column, and column 8 is dropped rather than drawing `-` on
# every row. Both labs bear that out: none of the ten recorded licences carries one.
#
# `type` answers outside its own enum on both Prism Centrals. The spec declares
# `PRISM,CALM,FLOW,OBJECT,AOS,FILE,VDI,ROBO`; the recordings hold `NUS`, `NKPFS`,
# `NDS_PLATFORM`, `NCM` and `NDB_PLATFORM` - seven distinct values, none of them declared. An
# `Enum` cell prints whatever arrives, so the column is right; a filter or a vocabulary built
# on that enum would not be.
[kinds."licensing.config.License"]
display = "Licenses"
aliases = ["license", "licenses"]
category = "Licensing"
columns = [
    { header = "NAME", path = "name", kind = "Text" },
    { header = "TYPE", path = "type", kind = "Enum" },
    { header = "CATEGORY", path = "category", kind = "Enum" },
    { header = "METER", path = "meter", kind = "Enum" },
    { header = "QUANTITY", path = "quantity", kind = "Text" },
    { header = "EXPIRES", path = "expiryDate", kind = "Text" },
    { header = "LICENSE ID", path = "salesforceLicenseId", kind = "Text" },
]

# `details` needs `$expand=details` - the one field in the `$expand` allowlist
# `listEntitlements` declares (specs/licensing/v4.4.yaml L4986) - which the table never sends,
