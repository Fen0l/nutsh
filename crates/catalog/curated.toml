# no `$expand` field at all and none was asked for. A `DETAILS` (`Count`) column would fill.
#
# **No CLUSTER ID column.** `clusterExtId` is empty on all five entitlements of the two
# recordings, single-cluster rows included, while every row's own `extId` *is* the cluster
# uuid - PC1's three are exactly the three clusters of its own cluster fixture, and sierra's
# `000656bb-…-c1ce` is the cluster its host NICs report. Empty on both Prism Centrals and
# never sent by either, so the column goes; repairing it to `extId` would only put a second
# copy of `CLUSTER` beside `CLUSTER`.
[kinds."licensing.config.Entitlement"]
