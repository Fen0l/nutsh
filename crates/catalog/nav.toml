# The sidebar's tree. Generated into the catalog beside KINDS by `cargo xtask gen-catalog`,
# which fails when a `kind` is not in KINDS, when a `page` is not in pages.toml, or when a
# `kind` is not `Reach::Direct` - the same predicate the palette uses to decide what it may
# open. An item with only a `note` is drawn greyed with the note as its reason, so the menu
# keeps mirroring the official UI even where the v4 API has no equivalent.
#
# The generator appends one group per namespace after these, under a separator, holding what
# this file left over of it: every top-level-openable kind of that namespace that no group below
# names, so nothing in the catalog is unreachable from the menu and nothing is in it twice. A
# namespace with no remainder contributes no group. Moving a kind into a group here therefore
# takes it out of its namespace group, which is the point - those are an explorer for what
# nobody has curated, not a second spelling of this menu.

[[group]]
name = "Dashboard"
items = [
  { label = "Dashboard", page = "dashboard" },
  { label = "Attention", page = "attention" },
]

[[group]]
name = "Compute & Storage"
items = [
  { label = "Overview", page = "compute-storage" },
  { label = "VMs", kind = "vmm.ahv.config.Vm" },
  { label = "ESXi VMs", kind = "vmm.esxi.config.Vm" },
  { label = "Templates", kind = "vmm.content.Template" },
  { label = "Images", kind = "vmm.content.Image" },
