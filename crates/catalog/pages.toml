  # `$orderby=name`, not by creation time: `listVms` accepts `$orderby` but `createTime` is not
  # among the fields it takes (`specs/vmm/v4.3.yaml:31916-31952`, where `createTime` appears
  # under `$select` only), so ordering by it would be a 400.
  [[page.pane]]
  title = "VMs"
  kind = "vmm.ahv.config.Vm"
  orderby = "name"
  row = 1
  col = 1
  weight = 1
