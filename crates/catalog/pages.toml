# What needs a look right now, from four sources the dashboard already reads. Each pane is the
# kind's own narrowed list, so `⏎` and `y` open the row like anywhere else; the summary column
# counts what the panes hold. The two cross-kind questions the issue named - a VM off while its
# host is up, a protected VM past its RPO - come out as `VMs powered off` beside `Hosts not
# normal`, and the sampler's `out of sync`: an AHV VM that is off has no host to compare.
[[page]]
id = "attention"
title = "Attention"
