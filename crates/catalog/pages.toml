# Feature pages: several kinds composed into one screen, the way a Prism Central page is.
# Generated into the catalog beside KINDS. The generator fails on an unknown kind, on a
# seventh pane, on a `row` past the end of `row_heights`, on a `col` past the second, on two
# panes in one `(row, col)` cell, on a `weight` of zero, on a `summary_rows` past the last
# row, and on a column path that is not a dotted path. A path that stops resolving after a
# spec bump renders `-` rather than failing, so the page degrades a cell instead of dying.
#
# `row_heights`: `0` shares what is left of the page (a `Min(5)`), anything else is exact.
# `summary_rows`: how many top rows the 26-cell summary column spans.
#
# Later pages, agreed in shape and not yet built: Protection Summary (entities by protection
# state, RPO compliance), Security Dashboard (`security.report.*` summaries and STIG results),
# Capacity (storage containers and cluster utilisation), LCM (inventory, available bundles,
# upgrade history).

[[page]]
id = "disaster-recovery"
title = "Disaster Recovery"
summary = "disaster-recovery"
summary_rows = 2
row_heights = [5, 7, 0, 0]

  # `RegisteredDomain` is registration with Nutanix Central, not a DR availability zone: DR
  # peers are named by `domainManagerExtId` on the policies and plans below, which the store's
  # name cache resolves. The pane is still worth showing, and "single PC" is the common case,
  # not an error. It has no last-sync and no storage capacity: a `DomainPlatformData` schema
  # with `lastSyncedAt`, `storageCapacity`, `vmCount` and `criticalAlertCount` exists in the
  # file and is referenced by nothing. `platformData.connectivityStatus` is an unconstrained
  # string, not an enum - still a `Status` column, because the vocabulary matches words, but
  # not the first one: `registrationState` leads here as it leads the kind's own curated
  # columns, so a row's colour is the registration state rather than the absence of an
  # optional object. The pane must keep the kind's order to stay a subsequence of it.
  [[page.pane]]
  title = "Registered Prism Centrals"
  kind = "multidomain.config.RegisteredDomain"
  row = 0
  col = 0
  weight = 1
  empty = "single PC - not registered with Nutanix Central"
  columns = [
    { header = "NAME", path = "name", kind = "Text" },
    { header = "PC VERSION", path = "platformData.pcVersion", kind = "Text" },
    { header = "CLUSTERS", path = "platformData.clusterCount", kind = "Text" },
    { header = "STATE", path = "registrationState", kind = "Status" },
    { header = "CONNECTIVITY", path = "platformData.connectivityStatus", kind = "Status" },
    { header = "REGISTERED", path = "registeredTime", kind = "Timestamp" },
  ]

  # `label` is documented as "a unique user defined label of the replication location … used to
  # identify the location in the replication configurations": a join key, not a site. On the recording
  # those labels are `0`, `1` and `PC_192.0.2.8-0`. The site is `domainManagerExtId`, which the
  # name warm-up resolves to the Prism Central's own name.
  #
  # `PRIMARY ← replicationLocations[].isPrimary` is gone. Every policy has exactly one primary
  # location by definition ("One of the locations must be specified as the primary location"), so
  # the column carried no information even before it was cut to `true,fa`. Selecting the primary
  # element would need a path predicate the grammar does not have, and inventing one for a single
  # column is a feature for a single column.
  #
  # These are the first four of `datapolicies.config.ProtectionPolicy`'s curated columns, in
  # order, so the page and the kind's own table cannot disagree.
  [[page.pane]]
  title = "Protection Policies"
  kind = "datapolicies.config.ProtectionPolicy"
  row = 1
  col = 0
  weight = 1
  empty = "no protection policies"
  columns = [
    { header = "NAME", path = "name", kind = "Text" },
    { header = "SITES", path = "replicationLocations[].domainManagerExtId", kind = "Reference" },
    { header = "RPO", path = "replicationConfigurations[].schedule.recoveryPointObjectiveTimeSeconds", kind = "Duration" },
    { header = "CATEGORIES", path = "categoryIds", kind = "Count" },
  ]

  # `RecoveryPlan` has no stages column and no status: stages are a sub-resource
  # (`datapolicies.config.RecoveryStage`, parent RecoveryPlan) reached by drilling into a row,
  # and execution state lives on RecoveryPlanJob. The RPO wrapper above is `schedule`, not
  # `scheduleConfig`.
  [[page.pane]]
  title = "Recovery Plans"
  kind = "datapolicies.config.RecoveryPlan"
  row = 2
  col = 0
  weight = 1
  empty = "no recovery plans"
  columns = [
    { header = "NAME", path = "name", kind = "Text" },
    { header = "PRIMARY SITE", path = "primaryLocation.domainManagerExtId", kind = "Reference" },
    { header = "RECOVERY SITE", path = "recoveryLocation.domainManagerExtId", kind = "Reference" },
    { header = "PAUSED", path = "isProtectionPausedPostFailover", kind = "Bool" },
  ]

  [[page.pane]]
  title = "Recent DR jobs"
  kind = "dataprotection.config.RecoveryPlanJob"
  row = 3
  col = 0
  weight = 1
  empty = "no recovery plan jobs"
  columns = [
    { header = "NAME", path = "name", kind = "Text" },
    { header = "ACTION", path = "actionType", kind = "Enum" },
    { header = "STATUS", path = "status", kind = "Status" },
    { header = "PLAN", path = "recoveryPlanExtId", kind = "Reference" },
    { header = "%", path = "percentageComplete", kind = "Percent" },
    { header = "START", path = "startTime", kind = "Timestamp" },
  ]

