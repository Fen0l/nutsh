# ─────────────────────────────────────────────────────────────────────────────────────────────
# The group landing pages.
#
# Six of the nine curated `nav.toml` groups open on one of these, the way Data Protection opens
# on Disaster Recovery: the group's first item is its page, and the individual resources stay
# under it. Dashboard *is* a page and Contexts is a screen, so those two have none.
#
# Each is four panes over its own group's kinds, two by two, with `row_heights = [0, 0]` so the
# two rows share the page evenly and neither is fixed to a height the terminal may not have.
# None of them declares a `summary`: the summary column is code (`page/summary.rs`), and a box
# nothing computes would be an empty column rather than a blank one.
#
# **A page id may not also name a nav group.** `nav_id` resolves a page id exactly and a group
# name case-insensitively, so a page called `monitoring` would take `:hide monitoring` away from
# the generated group of that name for good - which is why these ids are `hardware-overview` and
# `monitoring-overview` rather than the bare group name. The titles are the group names, so
# `nutsh Hardware` still opens the page; `nav_id` never looks at a title. The generator enforces
# the rule; the one pair that exists is `dashboard` / `Dashboard`, and neither half of it can be
# hidden at all.

