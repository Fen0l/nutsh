row_heights = [0, 0]

  # `HOSTS` was `Count` over `nodes.numberOfNodes`, which is an integer and not an array:
  # `cell::render_cell`'s `Count` arm counts the values a path matched, so the column printed `1`
  # on every row whatever the cluster's size.
