  [[page.pane]]
  title = "Hosts"
  kind = "clustermgmt.config.Host"
  row = 1
  col = 1
  weight = 1
  empty = "no hosts"
  columns = [
    { header = "HOST", path = "hostName", kind = "Text" },
    { header = "MAINTENANCE", path = "maintenanceState", kind = "Status" },
