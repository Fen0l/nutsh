[package]
name = "nutsh-config"
description = "Config file, contexts, and secret storage for nutsh"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["linux-keyring"]
# Linux Secret Service over D-Bus, in pure Rust: nothing to link. With no session bus or no
# daemon on it, the file store is used instead.
linux-keyring = ["dep:keyring-core", "dep:zbus-secret-service-keyring-store"]

[dependencies]
serde.workspace = true
thiserror.workspace = true
toml.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
keyring-core = { version = "1", optional = true }
zbus-secret-service-keyring-store = { version = "1", optional = true, features = ["rt-async-io-crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring-core = "1"
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[dev-dependencies]
tempfile.workspace = true
