[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.2-beta1"
edition = "2024"
license = "MIT"
rust-version = "1.98.1"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
indexmap = "2.14.2"
insta = { version = "1.48", features = ["filters"] }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
time = { version = "0.3.55", features = ["parsing"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
toml = "1"
tracing = "0.1"
# `env-filter` for `NUTSH_LOG`, `fmt` for the lines themselves. No `ansi`, because the file a
# TUI run writes to must not grow escape codes, and no `tracing-log`: a dependency that logs
# through the `log` crate is one this program has never read and must not start reading into a
# file, since what those crates log is headers.
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "registry", "fmt", "env-filter"] }
nutsh-catalog = { path = "crates/catalog" }
nutsh-config = { path = "crates/config" }
nutsh-prism = { path = "crates/prism" }
nutsh-core = { path = "crates/core" }
nutsh-tui = { path = "crates/tui" }
nutsh-mockpc = { path = "crates/mockpc" }

[package]
name = "nutsh"
description = "A Nutanix TUI that tells you why it's broken"
homepage = "https://nutsh.dev"
repository = "https://github.com/Fen0l/nutsh"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "nutsh"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
futures = "0.3"
tokio.workspace = true
rpassword = "7"
toml.workspace = true
nutsh-catalog.workspace = true
nutsh-config.workspace = true
nutsh-core.workspace = true
nutsh-prism.workspace = true
nutsh-tui.workspace = true

[dev-dependencies]
nutsh-mockpc.workspace = true
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

