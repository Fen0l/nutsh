        additionalProperties: false
    dataprotection.v4.r0.a2.common.RecoveryPointStatus:
      type: string
      description: "The status of the Recovery point, which indicates whether this\
        \ Recovery point is fit to be consumed."
      enum:
      - $UNKNOWN
      - $REDACTED
      - INCOMPLETE
      - COMPLETE
      - EXPIRED
      x-enumDescriptions:
        COMPLETE: The Recovery point is in a complete state and ready to be consumed.
        EXPIRED: The Recovery point has expired and may not be fit for consumption.
        INCOMPLETE: The Recovery point is incomplete and not ready to be consumed.
