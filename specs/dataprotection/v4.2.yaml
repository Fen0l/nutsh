    dataprotection.v4.2.config.OperationType:
      title: Type of operation being performed
      type: string
      description: Type of operation being performed.
      enum:
      - NETWORK_CREATION
      - SUBNET_EXTENSION_CREATION
      - NETWORK_GATEWAY_CREATION
      - VPC_UPDATION
      - SYNC_RECOVERY_POINTS
      - FLOATING_IP_CREATION
      - RESOURCE_RESERVATION
      - NOTIFY_WITNESS
      - VPC_CREATION
      - CONFIGURE_MANUAL_PROTECTION
