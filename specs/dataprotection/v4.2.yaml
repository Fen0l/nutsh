    dataprotection.v4.2.config.WitnessAvailabilityStatus:
      type: string
      description: Availability status of the Witness.
      enum:
      - AVAILABLE
      - UNAVAILABLE
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        AVAILABLE: Witness is available.
        UNAVAILABLE: Witness is unavailable.
        $UNKNOWN: |
          Unknown value.
        $REDACTED: |
          Redacted value.
    dataprotection.v4.2.config.HostType:
      type: string
