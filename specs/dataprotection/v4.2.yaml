      - ENTITY_LIVE_MIGRATION
      - VM_POWER_ON
      - ASSIGN_FLOATING_IP
      - STATIC_IP_VALIDATION
      - SCRIPT_EXECUTION
      - VM_VOLUME_IQN_ATTACHMENT
      - VM_VOLUME_ATTACHMENT
      - ENTITY_SNAPSHOT_SYNC
      - AUDIT
      - NETWORK_DELETION
      - CONSISTENCY_GROUP_CREATE
      - SUBNET_EXTENSION_DELETION
      - NETWORK_GATEWAY_DELETION
      - STAGE_RECOVERY
      - ENTITY_RECOVERY
      - IP_CUSTOMIZATION
      - ENTITIES_CLEANUP
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        AUDIT: Audit operation.
        SYNC_RECOVERY_POINTS: Operation to sync recovery points.
        VM_VOLUME_ATTACHMENT: Operation to attach a Virtual Machine (VM) and a volume
          group.
        FLOATING_IP_CREATION: Operation to create a floating IP.
        STATIC_IP_VALIDATION: Operation to validate static IP.
        VM_VOLUME_IQN_ATTACHMENT: Operation to attach a virtual machines (VM) and
          a volume group.
        SUBNET_EXTENSION_CREATION: Operation to create subnet extension.
        IP_CUSTOMIZATION: IP customization operation.
        RESOURCE_RESERVATION: Operation to reserve resources for recovery.
        VPC_UPDATION: Operation to update VPC.
        SUBNET_EXTENSION_DELETION: Operation to delete subnet extension.
        VM_POWER_ON: Operation to power on a VM.
        CONSISTENCY_GROUP_CREATE: Operation to create a consistency group.
        NOTIFY_WITNESS: Operation to notify witness.
        ENTITY_RECOVERY: Entity recovery operation.
        ENTITY_SNAPSHOT_SYNC: Entity snapshot sync operation.
        CONFIGURE_MANUAL_PROTECTION: Operation to configure manual protection.
        NETWORK_GATEWAY_CREATION: Operation to create a network gateway.
        $REDACTED: |
          Redacted value.
        ASSIGN_FLOATING_IP: Operation to assign a floating IP.
        ENTITIES_CLEANUP: Operation to delete entities.
        STAGE_RECOVERY: Operation to recover the payload in a stage.
        NETWORK_CREATION: Operation to create a network.
        ENTITY_RESTORATION: Entity restoration operation.
        ENTITY_LIVE_MIGRATION: Entity live migration operation.
        NETWORK_GATEWAY_DELETION: Operation to delete a network gateway.
        ENTITY_MIGRATION: Entity migration operation.
        SCRIPT_EXECUTION: Operation to perform script execution.
        $UNKNOWN: |
          Unknown value.
        DELAY: Delay between two consecutive stages of a recovery plan.
        NETWORK_DELETION: Operation to delete a network.
        VPC_CREATION: Operation to create VPC.
