          - $ref: '#/components/schemas/dataprotection.v4.2.error.ErrorResponse'
      additionalProperties: false
      description: "REST response for all response codes in API path /dataprotection/v4.2/config/recovery-points/{extId}/$actions/set-expiration-time\
        \ Post operation"
