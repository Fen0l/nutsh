        \ Post operation"
    dataprotection.v4.2.operations.BaseRecoveryPlanActionSpec:
      title: Base Recovery Plan Action Specification
      required:
      - failoverDirections
      - name
      type: object
      properties:
        name:
          maxLength: 256
          type: string
          description: Name of the Recovery Plan Job.
          example: Test_Failover_Job
        failoverDirections:
          maxItems: 50
          minItems: 1
          type: array
          description: "List of failover directions from source disaster recovery\
            \ location to target disaster recovery location.<br> For example, when\
            \ failing over virtual machines (VMs) and volume groups from clusters\
            \ C1, C2 registered to domain manager PC1 on source location to cluster\
            \ C3 registered to domain manager PC1 on target location, there must be\
            \ one direction between source location (PC1, C1) to target location (PC1,\
            \ C3) and another mapping between source location (PC1, C2) and target\
            \ location (PC1, C3).<br> Domain manager is a required parameter while\
            \ describing disaster recovery location in failover directions.<br> When\
            \ creating a Recovery Plan Job across two domain managers, the source\
            \ clusters are not required.<br> Failover direction contains clusters\
            \ only when failing over between primary and secondary clusters registered\
            \ to the same domain manager."
          items:
            $ref: '#/components/schemas/dataprotection.v4.2.config.FailoverDirection'
      additionalProperties: false
      description: "Recovery plan action is a specification describing the recovery\
        \ plan to be executed, failover directions and type of failover."
    dataprotection.v4.2.operations.PlannedFailoverSpec:
      title: Planned Failover Recovery Plan Action
      description: The planned failover recovery plan action is used to perform a
        planned failover on the recovery plan.
      allOf:
      - $ref: '#/components/schemas/dataprotection.v4.2.operations.BaseRecoveryPlanActionSpec'
      - type: object
        properties:
          shouldIgnoreWarnings:
            type: boolean
            description: "Indicates whether to continue the recovery plan action despite\
              \ validation warnings. For example, if the IP of some virtual machines\
              \ (VMs) cannot be preserved after recovery, the Recovery Plan action\
              \ can still be initiated by passing `shouldIgnoreWarnings` as `true`.\
              \ This value allows the recovery operations to continue despite the\
              \ validation warnings. Alternatively, the user can choose to resolve\
              \ the validation warnings and trigger another failover action on recovery\
              \ plan."
            default: false
          shouldLiveMigrateVMs:
            type: boolean
            description: "Indicates whether to perform a live migration of virtual\
              \ machines (VMs) during a `PLANNED_FAILOVER` operation. When not specified\
              \ or specified as false, the migration is performed for all virtual\
              \ machines (VMs) in offline mode. When specified as true, the migration\
              \ is performed for all virtual machines (VMs) in a running state."
            default: false
        additionalProperties: false
    dataprotection.v4.2.operations.PlannedFailoverRecoveryPlanApiResponse:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/common.v1.0.response.ApiResponseMetadata'
        data:
          required:
          - $objectType
          properties:
            $objectType:
              type: string
