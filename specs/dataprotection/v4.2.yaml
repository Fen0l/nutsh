            type: string
            description: The external identifier that can be used to identify a VM
              recovery point.
            example: 75cf28a9-fb7a-437a-8e3c-03627d1f23aa
        additionalProperties: false
    dataprotection.v4.2.content.VolumeGroupDiskRecoveryPointReference:
      title: Volume Group disk recovery point reference.
