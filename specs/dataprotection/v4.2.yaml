      additionalProperties: false
      description: "Changed region comprising of offset, length, and type of the region."
    dataprotection.v4.2.content.RegionType:
      type: string
      description: The type of the region.
      enum:
      - ZEROED
      - REGULAR
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        ZEROED: A zero region.
        REGULAR: An initialized region.
        $UNKNOWN: |
          Unknown value.
        $REDACTED: |
          Redacted value.
