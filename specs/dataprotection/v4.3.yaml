        \ Get operation"
    dataprotection.v4.3.config.RecoveryPlanValidationError:
      title: Message for Recovery Plan Job Validation Report
      description: Message used to report recovery plan job errors or warnings.
      allOf:
      - $ref: '#/components/schemas/dataprotection.v4.3.config.ErrorMessage'
      - type: object
        properties:
          affectedEntities:
            maxItems: 100
            minItems: 1
            type: array
            description: List of affected entities.
            items:
              $ref: '#/components/schemas/common.v1.0.config.EntityReference'
          rootCauseAnalysis:
            $ref: '#/components/schemas/dataprotection.v4.3.config.RootCauseAnalysis'
        additionalProperties: false
    dataprotection.v4.3.config.ErrorMessage:
      description: "Provides the code, status, severity and summary of the error raised\
        \ by an API call."
      allOf:
      - $ref: '#/components/schemas/common.v1.0.response.ExternalizableAbstractModel'
      - type: object
        properties:
          errorCode:
            type: string
            description: Error code for API request failure.
            example: DP-40008
          errorGroup:
            $ref: '#/components/schemas/dataprotection.v4.3.config.ErrorGroup'
          message:
            type: string
            description: Summary of the error.
            example: Recovery point not found for VMs. VM is not recovered as The
              Availability Zone AZ_1 does not have recovery points for the specified
              VMs.
          severity:
            $ref: '#/components/schemas/dataprotection.v4.3.config.Severity'
        additionalProperties: false
    dataprotection.v4.3.config.RootCauseAnalysis:
      type: object
      properties:
        cause:
          type: string
          description: Cause of the validation errors or warnings.
          example: Entity is protected by the use of protection domains.
        resolutions:
          maxItems: 5
          minItems: 1
          type: array
          description: Steps to resolve the errors or warnings.
          items:
            type: string
            example: Unprotect entity from legacy protection domain.
        impacts:
          maxItems: 5
          minItems: 1
          type: array
          description: List of impacts of the errors or warnings raised.
          items:
            type: string
            example: The entities might/will not be recovered during a failover operation.
      additionalProperties: false
      description: "Possible causes, resolutions, impact and additional details to\
        \ troubleshoot the error message."
    dataprotection.v4.3.config.ErrorGroup:
      type: string
      description: Type of validation errors or warnings.
      enum:
      - ENTITY
      - NETWORK
      - RECOVERY_POINT
      - CATEGORY
      - CONNECTIVITY
      - INFRASTRUCTURE
      - CLUSTER_LICENSE
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        NETWORK: Type of network validation errors or warnings.
        ENTITY: Type of entity validation errors or warnings.
        CONNECTIVITY: Type of connectivity validation errors or warnings.
        CATEGORY: Type of category validation errors or warnings.
        CLUSTER_LICENSE: Type of cluster license validation errors or warnings.
        RECOVERY_POINT: Type of recovery point validation errors or warnings.
        INFRASTRUCTURE: Type of infrastructure validation errors or warnings.
        $UNKNOWN: |
          Unknown value.
        $REDACTED: |
          Redacted value.
    dataprotection.v4.3.config.Severity:
      type: string
      description: Severity of an error message.
      enum:
      - ERROR
      - WARNING
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        ERROR: Severity is of error type.
        $UNKNOWN: |
          Unknown value.
        WARNING: Severity is of warning type.
        $REDACTED: |
          Redacted value.
    dataprotection.v4.3.config.ListRecoveryPlanJobExecutionStepsApiResponse:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/common.v1.0.response.ApiResponseMetadata'
        data:
          oneOf:
          - type: array
            items:
              $ref: '#/components/schemas/dataprotection.v4.3.config.RecoveryPlanJobExecutionStep'
          - $ref: '#/components/schemas/dataprotection.v4.3.error.ErrorResponse'
