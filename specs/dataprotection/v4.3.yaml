    dataprotection.v4.3.config.ConsistencyGroup:
      title: Consistency group model object
      description: "In many scenarios, it is necessary to capture the state of an\
        \ application as a combined snapshot of the internal states of a related set\
        \ of entities at a specific point in time. A consistency group is a collection\
        \ of these entities, where their combined snapshot reflects the state of an\
        \ application at that particular point in time."
