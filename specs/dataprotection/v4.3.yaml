          items:
            $ref: '#/components/schemas/vmm.v4.2.ahv.config.VmRestoreNicConfigOverrideParams'
      additionalProperties: false
      description: "NIC configuration input for the restored VM. If not specified,\
        \ the NICs in the VM Recovery Point will be restored."
    vmm.v4.2.ahv.config.CategoryReference:
