openapi: 3.0.1
info:
  title: Nutanix Data Protection APIs
  description: "Business Continuity with full spectrum of Disaster Recovery and Backup\
    \ solution. Spanning across Single PC, Cross AZ, MultiSite. Configuration of Recovery\
    \ points, Protection policies, Recovery Plans. Execution and monitoring of back\
    \ up and recovery orchestrations on OnPrem as well as Cloud."
  version: 1.0.0
  x-logo:
    altText: Data Protection Logo
    url: https://developers.nutanix.com/api/v1/namespaces/dataprotection/images/dataprotection-logo-img.svg
  x-repo-name: dataprotection
  x-minimum-negotiation-version: v4.2
servers:
- url: "https://{host}:{port}/api"
security:
- basicAuthScheme: []
- apiKeyAuthScheme: []
tags:
- name: RecoveryPoints
  description: |
    A recovery point, also known as a snapshot, is a point-in-time copy of an entity such as one or more VMs,
     volume groups or a combination of both. Recovery point APIs allow you to manage the lifecycle of recovery
     points, including creation and deletion. These APIs allow you to view recovery points using the GET API
     operation and customize responses using OData filtering. You can also replicate a specific recovery point to
     a remote cluster and restore from a recovery point to create an entity. In addition, you have the option to
     change the expiration time of a recovery point, enabling either early garbage collection or extended retention
     of recovery points.
  x-displayName: Recovery Points
- name: RecoveryPlanJobs
  description: |
    Recovery Plan Job allows you to perform a failover operation using a Recovery Plan configuration.
     Recovery Plan Job APIs allow specifying configurations of the failover type, such as unplanned failover,
     planned failover, test failover and test cleanup. You can view the failover report using the GET APIs.
  x-displayName: Recovery Plan Jobs
- name: ProtectedResources
  description: |
    Protected resource APIs offer a protection summary and facilitate operations on protected entities, such as virtual machines (VMs) or volume groups. These entities are safeguarded through either synchronous replication or minute recovery point objective (RPO) configurations. The APIs enable you to promote an entity on a remote cluster that is part of the synchronous replication process. Additionally, they allow for the restoration of an entity within a specified time range for minutely RPO configurations.
  x-displayName: Protected Resources
- name: RecoveryPlanActions
  description: |
    Recovery Plan actions allow you to perform a failover operation using a Recovery Plan configuration. Recovery Plan actions APIs allow specifying configurations of the failover type, such as unplanned failover, planned failover, test failover and test cleanup. You can view the failover report using the GET APIs.
  x-displayName: Recovery Plans
- name: DataProtectionClusterCapabilities
  description: |
    Data protection related capabilities of a cluster returned as pairs of capability name and boolean value.  For example SUPPORTS_NEAR_SYNC is a capability that is returned as True or False.
  x-displayName: Data Protection Cluster Capabilities
