  : post:
      tags:
      - RecoveryPoints
      summary: Compute Volume Group recovery points changed regions
      description: "Displays the calculated metadata with the changed region details\
        \ between any two volume group disk recovery points of a file. This API can\
        \ be used for incremental and differential backups, as well as for a full\
        \ backup, because it indicates the regions that are zeros, helping to avoid\
        \ copying zero regions."
