        restoreTime:
          type: string
          description: UTC date and time in ISO 8601 format representing the time
            from when the state of the entity should be restored. This must be a valid
            time within the restorable time ranges for the protected resource.
          format: date-time
          example: 2009-09-23T14:30:00-07:00
      additionalProperties: false
      description: Restore action specifications for a minutely scheduled protected
        resource.
