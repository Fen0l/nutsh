      additionalProperties: false
      description: The restorable time range details used to recover the protected
        resource.
    dataprotection.v4.3.config.SynchronousReplicationRole:
      title: Synchronous replication role-related information of the protected resource.
      type: string
      description: Synchronous replication role-related information of the protected
        resource.
      enum:
      - PRIMARY
      - SECONDARY
      - INDEPENDENT
      - DECOUPLED
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        DECOUPLED: VM is no longer in synchronous replication and all actions on the
          VM are blocked except for a delete operation.
        SECONDARY: This is the target site for VM in synchronous replication.
        INDEPENDENT: "VM is no longer in synchronous replication, and is not replicating\
          \ to the configured recovery cluster."
        PRIMARY: VM is in synchronous replication and active on the primary site.
        $UNKNOWN: |
          Unknown value.
        $REDACTED: |
          Redacted value.
    dataprotection.v4.3.config.RestorableTimeRange:
      title: Time range during which the entity is restorable.
      type: object
      properties:
        startTime:
          type: string
          description: UTC date and time in ISO 8601 format representing the time
            when the restorable time range for the entity starts.
          format: date-time
          example: 2009-09-23T14:30:00-07:00
        endTime:
          type: string
          description: UTC date and time in ISO 8601 format representing the time
            when the restorable time range for the entity ends.
          format: date-time
          example: 2009-09-23T14:30:00-07:00
      additionalProperties: false
      description: "The start and end time details, both inclusive, represent the\
        \ range of time during which the entity is restorable."
    dataprotection.v4.3.config.ProtectedResourceReplicationStatus:
      title: Status of replication to a specified target site.
      type: string
      description: Status of replication to a specified target site.
      enum:
      - IN_SYNC
      - SYNCING
      - OUT_OF_SYNC
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        IN_SYNC: The specified recovery point objective is met at the target site
          and failover can occur.
        SYNCING: The system is trying to meet the specified recovery point objective
          for the target site through ongoing replications and failover cannot be
          performed yet.
        OUT_OF_SYNC: The replication schedule is disabled and there are no replications
          in progress. Manual action by the user might be required to meet the recovery
          point objective.
        $UNKNOWN: |
          Unknown value.
        $REDACTED: |
          Redacted value.
    dataprotection.v4.3.config.ProtectedResourceRestoreSpec:
      title: Protected resource restore specification.
      required:
