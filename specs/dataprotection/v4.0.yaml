                properties:
                  metadata:
                    $ref: '#/components/schemas/common.v1.0.response.ApiResponseMetadata'
                  data:
                    $ref: '#/components/schemas/dataprotection.v4.0.error.ErrorResponse'
                additionalProperties: false
                description: "REST response for all response codes in API path /dataprotection/v4.0/config/protected-resources/{extId}/$actions/restore\
                  \ Post operation"
