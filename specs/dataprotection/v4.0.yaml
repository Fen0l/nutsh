          maxLength: 256
          type: string
          description: Name of the Microsoft Azure Blob Storage account.
          example: MyStorageAccount
        containerName:
          maxLength: 256
          type: string
          description: Name of the Microsoft Azure Blob Storage container.
          example: MyContainer
      additionalProperties: false
      description: Reference to the Microsoft Azure Blob Storage container.
    dataprotection.v4.0.config.AmazonS3Bucket:
