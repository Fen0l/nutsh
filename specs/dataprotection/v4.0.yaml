      description: Type of the S3-compatible object storage.
      enum:
      - AZURE_BLOB_STORAGE
      - AMAZON_S3
      - NUTANIX_OBJECTS
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        AZURE_BLOB_STORAGE: Microsoft Azure Blob Storage.
        NUTANIX_OBJECTS: Nutanix Objects.
        AMAZON_S3: Amazon S3.
        $UNKNOWN: |
          Unknown value.
        $REDACTED: |
          Redacted value.
