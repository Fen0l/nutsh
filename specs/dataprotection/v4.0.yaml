          $ref: '#/components/schemas/common.v1.0.config.IPAddress'
      additionalProperties: false
      description: It will contain a redirect IP and a certificate. Use the certificate
        to invoke the compute changed regions endpoint. Set the certificate as a header
        when invoking the CBT endpoint with NTNX_IGW_SESSION='CERTIFICATE'.
    dataprotection.v4.0.config.RecoveryPointRepository:
      title: Recovery point repository object
      description: "A recovery point repository is a reference to a data store which\
        \ can be used to store recovery points using Multicloud snapshot technology\
        \ (MST). It can be backed by any S3-compatible object storage solutions, which\
        \ include options like Nutanix Objects, as well as hyperscaler offerings such\
        \ as Amazon AWS S3 and Microsoft Azure Blobs."
      allOf:
      - $ref: '#/components/schemas/common.v1.0.response.ExternalizableAbstractModel'
      - type: object
        properties:
          name:
            maxLength: 256
            type: string
            description: Name of the recovery point repository.
            example: MyRecoveryPointRepository_1
          objectStorageType:
            $ref: '#/components/schemas/dataprotection.v4.0.config.ObjectStorageType'
          objectStorageReference:
            required:
            - $objectType
            properties:
              $objectType:
                type: string
                example: dataprotection.v4.config.AzureBlobStorageContainer
            description: Object storage reference details.
            oneOf:
            - $ref: '#/components/schemas/dataprotection.v4.0.config.AzureBlobStorageContainer'
            - $ref: '#/components/schemas/dataprotection.v4.0.config.AmazonS3Bucket'
            - $ref: '#/components/schemas/dataprotection.v4.0.config.NutanixObjectsBucket'
        additionalProperties: false
    dataprotection.v4.0.config.ObjectStorageType:
      title: Type of the S3-compatible object storage
