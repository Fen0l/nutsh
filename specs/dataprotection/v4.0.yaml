          - $ref: '#/components/schemas/dataprotection.v4.0.error.ErrorResponse'
      additionalProperties: false
      description: "REST response for all response codes in API path /dataprotection/v4.0/config/recovery-points/{extId}/$actions/restore\
        \ Post operation"
    dataprotection.v4.0.config.VmRecoveryPointRestoreOverride:
      title: VM recovery point restore specification.
      type: object
