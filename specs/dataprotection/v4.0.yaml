      - APPLICATION_CONSISTENT
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        $UNKNOWN: |
          Unknown value.
        CRASH_CONSISTENT: Crash-consistent Recovery points capture all the VM and
