                    $ref: '#/components/schemas/common.v1.0.response.ApiResponseMetadata'
                  data:
                    $ref: '#/components/schemas/dataprotection.v4.0.config.ProtectedResource'
                additionalProperties: false
                description: "REST response for all response codes in API path /dataprotection/v4.0/config/protected-resources/{extId}\
                  \ Get operation"
        "4XX":
          description: Client error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    $ref: '#/components/schemas/common.v1.0.response.ApiResponseMetadata'
                  data:
