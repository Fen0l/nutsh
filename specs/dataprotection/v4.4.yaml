      - PLANNED_FAILOVER
      - UNPLANNED_FAILOVER
      - TEST_FAILOVER
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        PLANNED_FAILOVER: Virtual Machine (VM) would be powered off on the source
          before migrating it to the recovery availability zone.
        VALIDATE: "Performs the validation of the recovery plan. The validation includes\
          \ checks for the presence of entities, networks, categories, etc. referenced\
          \ in the recovery plan."
        UNPLANNED_FAILOVER: Restore the entity from the recovery points on the recovery
          availability zone.
        $UNKNOWN: |
          Unknown value.
        TEST_FAILOVER: Same as `UNPLANNED_FAILOVER` but on a test network.
        $REDACTED: |
          Redacted value.
    dataprotection.v4.4.config.RecoveryPlanJobExecutionStatus:
      type: string
