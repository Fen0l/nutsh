      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        FAILED: Operation is failed.
        RUNNING: Operation is running.
        QUEUED: Operation is queued.
        SUCCEEDED: Operation is completed successfully.
        SUCCEEDED_WITH_VALIDATION_WARNING: Operation is completed but with some validation
