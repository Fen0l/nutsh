    dataprotection.v4.4.config.RecoveryPlanJobPhaseType:
      type: string
      description: The phase type of the execution step in the Recovery Plan Job.
      enum:
      - PRE_PROCESSING
      - ENTITY_RECOVERY
      - POST_PROCESSING
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        PRE_PROCESSING: "The PRE_PROCESSING phase is the initial stage of a recovery\
          \ plan job execution. It encompasses all preparatory actions and validations\
          \ performed before the main recovery operation (like FAILOVER) starts. Key\
          \ activities in this phase include system and environment checks, entity\
          \ validation, infrastructure preparation at the recovery site, data synchronization\
          \ for planned failovers, and conflict checks to ensure the environment is\
          \ fully prepared for a successful recovery."
        ENTITY_RECOVERY: "The ENTITY_RECOVERY phase is the core stage of a recovery\
          \ plan job, where the actual recovery of specified entities takes place\
          \ at the recovery location. Occurring after the preparatory PRE_PROCESSING\
          \ phase, its key operations include restoring or migrating entities from\
          \ their snapshots, powering on virtual machines once they are recovered,\
          \ and executing the recovery in predefined stages according to the plan's\
          \ configuration."
        POST_PROCESSING: "The POST_PROCESSING phase is the final stage of a recovery\
          \ plan job, executing after the main entity recovery is complete. It handles\
          \ all concluding clean-up and finalization tasks to wrap up the process.\
          \ Key actions include auditing the entire job to verify its completion and\
          \ creating a new Consistency Group from the successfully recovered entities."
        $UNKNOWN: |
          Unknown value.
        $REDACTED: |
          Redacted value.
