      - regionType
      type: object
      properties:
        offset:
          type: integer
          description: The start offset of the region in bytes.
          format: int64
          example: 40
        length:
          type: integer
          description: The length of the region in bytes.
          format: int64
          example: 7
        regionType:
          $ref: '#/components/schemas/dataprotection.v4.4.content.RegionType'
      additionalProperties: false
      description: "Changed region comprising of offset, length, and type of the region."
    dataprotection.v4.4.content.RegionType:
      type: string
      description: The type of the region.
      enum:
      - ZEROED
      - REGULAR
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        ZEROED: A zero region.
        REGULAR: An initialized region.
        $UNKNOWN: |
          Unknown value.
        $REDACTED: |
          Redacted value.
