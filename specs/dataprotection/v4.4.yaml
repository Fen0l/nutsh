      - $REDACTED
      x-enumDescriptions:
        SUPPORTS_POLICY_BASED_RP_RETENTION: |
          Indicates whether the cluster supports a protection policy-based retention of recovery points. The system ensures that the retention period specified in the protection policy is enforced during the garbage collection process of recovery points. If the retention period is not met, the recovery point will not be deleted, even if it has expired.
        SUPPORTS_NEAR_SYNC: |
          Indicates if the cluster supports near sync replication. Near sync replication is a type of replication that  provides a lower recovery point objective (RPO) than traditional asynchronous replication.
        $UNKNOWN: |
          Unknown value.
        $REDACTED: |
          Redacted value.
