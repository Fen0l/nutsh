openapi: 3.0.1
info:
  title: Nutanix Licensing APIs
  description: "Manage licenses for your clusters and Prism Central, get information\
    \ on applied licenses, license compliance details and feature entitlements."
  version: 1.1.0
  x-repo-name: licensing
  x-logo:
    altText: Licensing Logo
    url: https://developers.nutanix.com/api/v1/namespaces/licensing/images/licensing-logo-img.svg
  x-minimum-negotiation-version: v4.3
servers:
- url: "https://{host}:{port}/api"
security:
- basicAuthScheme: []
- apiKeyAuthScheme: []
tags:
- name: EndUserLicenseAgreement
  description: |
    The End User License Agreement (EULA) APIs are used internally to retrieve  the agreement text along with a list of users who have accepted it and,  to add new users to this list of users.
  x-displayName: End User License Agreement
- name: Licenses
  description: |
    APIs used to manage licenses on a Prism Central and clusters registered to it. These APIs can be used to apply licenses and to list license settings, applied licenses, entitlements, allowances, violations and compliance status. Additionally, these APIs can be used to fetch a list of features available under different license types.
  x-displayName: Licenses
- name: LicenseKeys
  description: |
    The license keys APIs are utilized to manage license keys, allowing for actions such as retrieving a list of license keys, assigning them to a cluster, deleting a key, and more.  These keys are typically used in dark sites where the customer has no connection to the outside world.
  x-displayName: License Keys
paths:
  /licensing/v4.4/agreements/eula:
    get:
      tags:
      - EndUserLicenseAgreement
      summary: Get End User License Agreement
      description: API to fetch active End User License Agreement.
      operationId: getEula
      responses:
        "200":
          description: Details of active End User License Agreement
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    $ref: '#/components/schemas/common.v1.0.response.ApiResponseMetadata'
                  data:
                    $ref: '#/components/schemas/licensing.v4.4.agreements.Eula'
                additionalProperties: false
                description: REST response for all response codes in API path /licensing/v4.4/agreements/eula
                  Get operation
        "4XX":
          description: Client error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    $ref: '#/components/schemas/common.v1.0.response.ApiResponseMetadata'
                  data:
                    $ref: '#/components/schemas/licensing.v4.4.error.ErrorResponse'
                additionalProperties: false
                description: REST response for all response codes in API path /licensing/v4.4/agreements/eula
                  Get operation
        "5XX":
          description: Server error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    $ref: '#/components/schemas/common.v1.0.response.ApiResponseMetadata'
                  data:
                    $ref: '#/components/schemas/licensing.v4.4.error.ErrorResponse'
                additionalProperties: false
                description: REST response for all response codes in API path /licensing/v4.4/agreements/eula
                  Get operation
      x-permissions:
        operationName: View Eula
        deploymentList:
        - ON_PREM
        roleList:
        - name: License Admin
        - name: License Viewer
        - name: Internal Super Admin
        - name: Prism Admin
        - name: Super Admin
        - name: Prism Viewer
        - name: Cluster Admin
