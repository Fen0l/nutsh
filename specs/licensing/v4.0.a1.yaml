openapi: 3.0.1
info:
  title: Nutanix Licensing Versioned APIs
  description: "Manage licenses for your clusters and Prism Central, get information\
    \ on applied licenses, license compliance details and feature entitlements."
  version: 4.0.1-alpha-1
  x-repo-name: licensing
  x-logo:
    altText: Licensing Logo
    url: https://developers.nutanix.com/api/v1/namespaces/licensing/images/licensing-logo-img.svg
servers:
- url: "https://{pc-ip}:9440/api"
security:
- basicAuthScheme: []
tags:
- name: EndUserLicenseAgreements
  description: |
    The End User License Agreement (EULA) APIs are used internally to retrieve  the agreement text along with a list of users who have accepted it and,  to add new users to this list of users.
  x-displayName: End User License Agreements
- name: Licenses
  description: "APIs used to manage licenses on a Prism Central and clusters registered\
    \ to it. These APIs can be used to apply licenses and to list license settings,\
    \ applied licenses, entitlements, allowances, violations and compliance status.\
    \ Additionally, these APIs can be used to fetch a list of features available under\
    \ different license types."
  x-displayName: Licenses
paths:
