                properties:
                  metadata:
                    $ref: '#/components/schemas/common.v1.0.response.ApiResponseMetadata'
                  data:
                    $ref: '#/components/schemas/volumes.v4.2.error.ErrorResponse'
                additionalProperties: false
                description: "REST response for all response codes in API path /volumes/v4.2/config/iscsi-clients/{extId}\
                  \ Get operation"
