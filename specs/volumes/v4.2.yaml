      - USER
      - INTERNAL
      - TEMPORARY
      - BACKUP_TARGET
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        BACKUP_TARGET: The Volume Groups which store backup data.
        INTERNAL: "The Volume Groups, which are critical to AOS and its related applications\
