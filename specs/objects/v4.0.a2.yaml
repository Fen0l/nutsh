openapi: 3.0.1
info:
  title: Nutanix Objects Storage Management APIs
  description: Manage Petabytes of Unstructured and Machine-generated data using a
    software-defined Object Store Service
  version: 4.0.1-alpha-2
  x-logo:
    altText: Objects Logo
    url: https://developers.nutanix.com/api/v1/namespaces/objects/images/objects-logo-img.svg
  x-repo-name: objects
servers:
- url: "https://{pc-ip}:9440/api"
security:
- basicAuthScheme: []
tags:
- name: ObjectStores
  description: An Object store provides an Amazon Web Services Simple Storage Service
    (AWS S3) compatible REST API interface to handle petabytes of unstructured and
    machine-generated data.
  x-displayName: Object Stores
paths:
  /objects/v4.0.a2/operations/object-stores:
    get:
      tags:
      - ObjectStores
      summary: Get a list of the Object stores
      description: Get a list of all the Object store details on the registered Prism
        Central.
      operationId: GetObjectstores
      parameters:
      - name: $page
        in: query
        description: |
          A URL query parameter that specifies the page number of the result set. It must be a positive integer between 0 and the maximum number of pages that are available for that resource. Any number out of this range might lead to no results.
        required: false
        style: form
        explode: false
        schema:
          minimum: 0
          type: integer
          description: |
            A URL query parameter that specifies the page number of the result set. It must be a positive integer between 0 and the maximum number of pages that are available for that resource. Any number out of this range might lead to no results.
          format: int32
          default: 0
      - name: $limit
        in: query
        description: |
          A URL query parameter that specifies the total number of records returned in the result set.  Must be a positive integer between 1 and 100. Any number out of this range will lead to a validation error. If the limit is not provided, a default value of 50 records will be returned in the result set.
        required: false
        style: form
        explode: false
        schema:
          maximum: 100
          minimum: 1
          type: integer
          description: |
            A URL query parameter that specifies the total number of records returned in the result set.  Must be a positive integer between 1 and 100. Any number out of this range will lead to a validation error. If the limit is not provided, a default value of 50 records will be returned in the result set.
          format: int32
          default: 50
      - name: $filter
        in: query
        description: |
          A URL query parameter that allows clients to filter a collection of resources. The expression specified with $filter is evaluated for each resource in the collection, and only items where the expression evaluates to true are included in the response. Expression specified with the $filter must conform to the [OData V4.01](https://docs.oasis-open.org/odata/odata/v4.01/odata-v4.01-part1-protocol.html) URL conventions.
          For example, filter '$filter=name eq 'karbon-ntnx-1.0' would filter the result on cluster name 'karbon-ntnx1.0', filter '$filter=startswith(name, 'C')' would filter on cluster name starting with 'C'.
          The filter can be applied to the following fields:
          - certificateReference
          - clusterReference
          - creationTime
          - deploymentVersion
          - description
          - domain
          - lastUpdateTime
          - name
          - numWorkerNodes
          - publicNetworkReference
          - region
          - state
          - storageNetworkDnsIp/ipv4/value
          - storageNetworkDnsIp/ipv6/value
          - storageNetworkReference
          - storageNetworkVip/ipv4/value
          - storageNetworkVip/ipv6/value
          - totalCapacityGiB
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: $orderby
        in: query
        description: |
          A URL query parameter that allows clients to specify the sort criteria for the returned list of objects. Resources can be sorted in ascending order using asc or descending order using desc. If asc or desc are not specified, the resources will be sorted in ascending order by default. For example, '$orderby=templateName desc' would get all templates sorted by templateName in descending order.
          The orderby can be applied to the following fields:
          - certificateReference
          - clusterReference
          - creationTime
          - deploymentVersion
          - description
          - domain
          - lastUpdateTime
          - name
          - numWorkerNodes
          - publicNetworkReference
          - region
          - state
          - storageNetworkDnsIp/ipv4/value
          - storageNetworkDnsIp/ipv6/value
          - storageNetworkReference
          - storageNetworkVip/ipv4/value
          - storageNetworkVip/ipv6/value
          - totalCapacityGiB
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: $expand
        in: query
        description: |
          A URL query parameter that allows clients to request related resources when a resource that satisfies a particular request is retrieved. Each expanded item is evaluated relative to the entity containing the property being expanded. Other query options can be applied to an expanded property by appending a semicolon-separated list of query options, enclosed in parentheses, to the property name. Permissible system query options are $filter, $select and $orderby. The following expansion keys are supported.
          - certificate
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: $select
        in: query
        description: |
          A URL query parameter that allows clients to request a specific set of properties for each entity or complex type. Expression specified with the $select must conform to the [OData V4.01](https://docs.oasis-open.org/odata/odata/v4.01/odata-v4.01-part1-protocol.html) URL conventions. If a $select expression consists of a single select item that is an asterisk (i.e., *), then all properties on the matching resource will be returned.
          - certificateReference
          - clusterReference
          - creationTime
          - deploymentVersion
          - description
          - domain
          - extId
          - lastUpdateTime
          - links
          - metadata
          - name
          - numWorkerNodes
          - publicNetworkIps
          - publicNetworkReference
          - region
          - state
          - storageNetworkDnsIp/ipv4/prefixLength
          - storageNetworkDnsIp/ipv4/value
          - storageNetworkDnsIp/ipv6/prefixLength
          - storageNetworkDnsIp/ipv6/value
          - storageNetworkReference
          - storageNetworkVip/ipv4/prefixLength
          - storageNetworkVip/ipv4/value
          - storageNetworkVip/ipv6/prefixLength
          - storageNetworkVip/ipv6/value
          - tenantId
          - totalCapacityGiB
        required: false
        style: form
        explode: true
        schema:
          type: string
