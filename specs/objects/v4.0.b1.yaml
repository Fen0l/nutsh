                type: object
                properties:
                  metadata:
                    $ref: '#/components/schemas/common.v1.0.response.ApiResponseMetadata'
                  data:
                    $ref: '#/components/schemas/prism.v4.0.config.TaskReference'
                additionalProperties: false
                description: "REST response for all response codes in API path /objects/v4.0.b1/config/object-stores/{objectStoreExtId}/certificates\
                  \ Post operation"
        "4XX":
          description: Client error response
