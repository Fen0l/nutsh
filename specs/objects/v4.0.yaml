        Post operation
    objects.v4.0.config.State:
      title: State of the Object store
      type: string
      description: Enum for the state of the Object store.
      enum:
      - OBJECT_STORE_DEPLOYMENT_FAILED
      - OBJECT_STORE_CERT_CREATION_FAILED
      - OBJECT_STORE_DELETION_FAILED
      - UNDEPLOYED_OBJECT_STORE
      - DEPLOYING_OBJECT_STORE
      - CREATING_OBJECT_STORE_CERT
      - DELETING_OBJECT_STORE
      - OBJECT_STORE_AVAILABLE
      - OBJECT_STORE_OPERATION_PENDING
      - OBJECT_STORE_OPERATION_FAILED
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        DEPLOYING_OBJECT_STORE: |
          The Object store is being deployed.
        OBJECT_STORE_DEPLOYMENT_FAILED: |
          The Object store deployment has failed.
        DELETING_OBJECT_STORE: |
          A deployed Object store is being deleted.
        OBJECT_STORE_OPERATION_FAILED: |
          There was an error while performing an operation on the Object store.
        UNDEPLOYED_OBJECT_STORE: The Object store is not deployed.
        OBJECT_STORE_OPERATION_PENDING: |
          There is an ongoing operation on the Object store.
        OBJECT_STORE_AVAILABLE: |
          There are no ongoing operations on the deployed Object store.
        OBJECT_STORE_CERT_CREATION_FAILED: |
          Creating the Object store certificate has failed.
        CREATING_OBJECT_STORE_CERT: |
          A certificate is being created for the Object store.
        $UNKNOWN: |
          Unknown value.
        OBJECT_STORE_DELETION_FAILED: |
          There was an error deleting the Object store.
        $REDACTED: |
          Redacted value.
    objects.v4.0.config.Certificate:
      allOf:
      - $ref: '#/components/schemas/common.v1.0.response.ExternalizableAbstractModel'
      - title: Object store Definition
        type: object
        properties:
          metadata:
            $ref: '#/components/schemas/common.v1.0.config.Metadata'
          publicCert:
            maxLength: 2000000
            minLength: 1
            type: string
            description: The public certificate to upload.
            writeOnly: true
            example: |-
              -----BEGIN CERTIFICATE-----
              MIIDzTCCArWgAwIBAgIUI...
              -----END CERTIFICATE-----
          privateKey:
            maxLength: 2000000
            minLength: 1
            type: string
            description: The private key to upload.
            writeOnly: true
            example: |-
              -----BEGIN RSA PRIVATE KEY-----
              MIIDzTCCArWgAwIBAgIUI...
              -----END RSA PRIVATE KEY-----
          ca:
            maxLength: 2000000
            minLength: 1
            type: string
            description: The CA certificate or chain to upload.
            writeOnly: true
            example: |-
              -----BEGIN CERTIFICATE-----
              MIIDzTCCArWgAwIBAgIUI...
              -----END CERTIFICATE-----
          alternateFqdns:
            maxItems: 999
            minItems: 1
            type: array
            description: |
              The list of alternate FQDNs for accessing the Object store. The FQDNs must consist of at least 2 parts separated by a '.'. Each part can contain upper and lower case letters, digits, hyphens or underscores but must begin and end with a letter. Each part can be up to 63 characters long. For e.g 'objects-0.pc_nutanix.com'.
            items:
              $ref: '#/components/schemas/common.v1.0.config.FQDN'
          shouldGenerate:
            type: boolean
            description: "If true, the certificate is generated with the provided\
              \ alternate FQDNs and IPs."
            writeOnly: true
            default: false
          alternateIps:
            maxItems: 1000
            minItems: 1
            type: array
            description: A list of the IPs included as Subject Alternative Names (SANs)
              in the certificate. The IPs must be among the public IPs of the Object
              store (publicNetworkIps).
            items:
              $ref: '#/components/schemas/common.v1.0.config.IPAddress'
        additionalProperties: false
        description: An Object store entity.
