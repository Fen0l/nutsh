          \        .$filter(null)\n                .$orderby(null)\n             \
          \   .$expand(null)\n                .$select(null)\n                .build());\n\
          \n            System.out.println(listObjectstoresApiResponse.toString());\n\
          \n        } catch (RestClientException ex) {\n            System.out.println(ex.getMessage());\n\
