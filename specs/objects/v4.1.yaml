    objects.v4.1.stats.ObjectstoreStats:
      allOf:
      - $ref: '#/components/schemas/common.v1.0.response.ExternalizableAbstractModel'
      - title: Stats of the Object store
        type: object
        properties:
          objectCount:
            maxItems: 150
            minItems: 1
            type: array
            description: |
              Number of Objects in the Object store. This stat is updated every 10 minutes. It includes the count of the incomplete multipart uploads.
            items:
              $ref: '#/components/schemas/common.v1.0.stats.TimeIntValuePair'
          bucketCount:
            maxItems: 150
            minItems: 1
            type: array
            description: |
              Number of Buckets in the Object store. This stat is updated every 10 minutes.
            items:
              $ref: '#/components/schemas/common.v1.0.stats.TimeIntValuePair'
          storageUsageBytes:
            maxItems: 150
            minItems: 1
            type: array
            description: |
              Total storage in bytes used by the Objects and Buckets. This stat is updated every 10 minutes. It includes the storage used by the incomplete multipart uploads.
            items:
              $ref: '#/components/schemas/common.v1.0.stats.TimeIntValuePair'
          inboundBytesPerSecond:
            maxItems: 150
            minItems: 1
            type: array
            description: Number of bytes written per second to the Object store from
              operations on the Objects and Buckets.
            items:
              $ref: '#/components/schemas/objects.v4.1.stats.TimeFloatValuePair'
          outboundBytesPerSecond:
            maxItems: 150
            minItems: 1
            type: array
            description: Number of bytes read per second from the Object store from
              operations on the Objects and Buckets.
            items:
              $ref: '#/components/schemas/objects.v4.1.stats.TimeFloatValuePair'
          getRequestThroughputBytesPerSecond:
            maxItems: 150
            minItems: 1
            type: array
            description: Throughput of HTTP GET requests in bytes per second.
            items:
              $ref: '#/components/schemas/objects.v4.1.stats.TimeFloatValuePair'
          putRequestThroughputBytesPerSecond:
            maxItems: 150
            minItems: 1
            type: array
            description: Throughput of HTTP PUT requests in bytes per second.
            items:
              $ref: '#/components/schemas/objects.v4.1.stats.TimeFloatValuePair'
          postRequestsPerSecond:
            maxItems: 150
            minItems: 1
            type: array
            description: Number of HTTP POST requests per second on the Objects and
              Buckets of the Object store.
            items:
              $ref: '#/components/schemas/objects.v4.1.stats.TimeFloatValuePair'
          headRequestsPerSecond:
            maxItems: 150
            minItems: 1
            type: array
            description: Number of HTTP HEAD requests per second on the Objects and
              Buckets of the Object store.
            items:
              $ref: '#/components/schemas/objects.v4.1.stats.TimeFloatValuePair'
          getRequestsPerSecond:
            maxItems: 150
            minItems: 1
            type: array
            description: Number of HTTP GET requests per second on the Objects and
              Buckets of the Object store.
            items:
              $ref: '#/components/schemas/objects.v4.1.stats.TimeFloatValuePair'
          putRequestsPerSecond:
            maxItems: 150
            minItems: 1
            type: array
            description: Number of HTTP PUT requests per second on the Objects and
              Buckets of the Object store.
            items:
              $ref: '#/components/schemas/objects.v4.1.stats.TimeFloatValuePair'
          deleteRequestsPerSecond:
            maxItems: 150
            minItems: 1
            type: array
            description: Number of HTTP DELETE requests per second on the Objects
              and Buckets of the Object store.
            items:
              $ref: '#/components/schemas/objects.v4.1.stats.TimeFloatValuePair'
          objectOperationsPerSecond:
            maxItems: 150
            minItems: 1
            type: array
            description: Number of operations per second on the objects of the Object
              store.
            items:
              $ref: '#/components/schemas/objects.v4.1.stats.TimeFloatValuePair'
          getObjectTtfbMsecs:
            maxItems: 150
            minItems: 1
            type: array
            description: Time to the first byte in milliseconds for Get Object requests.
            items:
              $ref: '#/components/schemas/objects.v4.1.stats.TimeFloatValuePair'
          getBucketOperationsPerSecond:
            maxItems: 150
            minItems: 1
            type: array
            description: Number of GetBucket operations per second.
            items:
              $ref: '#/components/schemas/objects.v4.1.stats.TimeFloatValuePair'
          listMultipartUploadsOperationsPerSecond:
            maxItems: 150
            minItems: 1
            type: array
            description: The number of ListMultipartUploads operations per second.
            items:
              $ref: '#/components/schemas/objects.v4.1.stats.TimeFloatValuePair'
          multipartUploadStartOperationsPerSecond:
            maxItems: 150
            minItems: 1
            type: array
            description: The number of CreateMultipartUpload operations per second.
            items:
              $ref: '#/components/schemas/objects.v4.1.stats.TimeFloatValuePair'
          selectObjectContentOperationsPerSecond:
            maxItems: 150
            minItems: 1
            type: array
            description: The number of SelectObjectContent operations per second.
            items:
              $ref: '#/components/schemas/objects.v4.1.stats.TimeFloatValuePair'
          nfsReadRequestsPerSecond:
            maxItems: 150
            minItems: 1
            type: array
            description: Number of Network File System (NFS) read requests per second
              on the objects of the Object store.
            items:
              $ref: '#/components/schemas/objects.v4.1.stats.TimeFloatValuePair'
          nfsWriteRequestsPerSecond:
            maxItems: 150
            minItems: 1
            type: array
            description: Number of Network File System (NFS) write requests per second
              on the objects of the Object store.
            items:
              $ref: '#/components/schemas/objects.v4.1.stats.TimeFloatValuePair'
          nfsReadThroughputBytesPerSecond:
            maxItems: 150
            minItems: 1
            type: array
            description: Throughput of Network File System (NFS) read operations in
              bytes per second on the objects of the Object store.
            items:
              $ref: '#/components/schemas/objects.v4.1.stats.TimeFloatValuePair'
          nfsWriteThroughputBytesPerSecond:
            maxItems: 150
            minItems: 1
            type: array
            description: Throughput of Network File System (NFS) write operations
              in bytes per second on the objects of the Object store.
            items:
              $ref: '#/components/schemas/objects.v4.1.stats.TimeFloatValuePair'
        additionalProperties: false
        description: The time series stats of the Object store.
    objects.v4.1.stats.TimeFloatValuePair:
      type: object
      properties:
        value:
          type: number
          description: Value of the stat at the recorded date and time in extended
            ISO-8601 format.
          format: float
          example: 1.234
        timestamp:
          type: string
          description: "The date and time at which the stat was recorded.The value\
            \ should be in extended ISO-8601 format. For example, start time of 2022-04-23T01:23:45.678+09:00\
            \ would consider all stats starting at 1:23:45.678 on the 23rd of April\
            \ 2022. Details around ISO-8601 format can be found at https://www.iso.org/standard/70907.html"
          format: date-time
          example: 2009-09-23T14:30:00-07:00
      additionalProperties: false
      description: A time value pair representing a stat associated with a given entity
        at a given point of date and time represented in extended ISO-8601 format.
    common.v1.0.stats.DownSamplingOperator:
      type: string
      description: |
        The operator to use while performing down-sampling on stats data. Allowed values are SUM, MIN, MAX, AVG, COUNT and LAST.
      enum:
      - SUM
      - MIN
      - MAX
      - AVG
      - COUNT
      - LAST
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        AVG: |
          Aggregation indicating mean or average of all values.
        MIN: |
          Aggregation containing lowest of all values.
        MAX: |
          Aggregation containing highest of all values.
        LAST: |
          Aggregation containing only the last recorded value.
        SUM: |
          Aggregation with sum of all values.
        COUNT: |
          Aggregation containing total count of values.
        $UNKNOWN: |
          Unknown value.
        $REDACTED: |
          Redacted value.
