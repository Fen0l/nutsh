          \ with the $select must conform to the [OData V4.01](https://docs.oasis-open.org/odata/odata/v4.01/odata-v4.01-part1-protocol.html)\
          \ URL conventions. If a $select expression consists of a single select item\
          \ that is an asterisk (i.e., *), then all properties on the matching resource\
          \ will be returned. If both $select and $apply query parameters are present,\
          \ $select will be applied on entities within the groups."
        required: false
        style: form
        explode: true
        schema:
          type: string
          example: string
        x-odata-fields:
        - name: inboundReplicationStatus
          example: "https://{host}:{port}/api/objects/v4.1/config/object-stores/{objectStoreExtId}/buckets?$select=inboundReplicationStatus"
        - name: isCorsEnabled
          example: "https://{host}:{port}/api/objects/v4.1/config/object-stores/{objectStoreExtId}/buckets?$select=isCorsEnabled"
        - name: isMultiProtocolAccessEnabled
          example: "https://{host}:{port}/api/objects/v4.1/config/object-stores/{objectStoreExtId}/buckets?$select=isMultiProtocolAccessEnabled"
        - name: isObjectLockEnabled
          example: "https://{host}:{port}/api/objects/v4.1/config/object-stores/{objectStoreExtId}/buckets?$select=isObjectLockEnabled"
        - name: isStaticWebsiteEnabled
          example: "https://{host}:{port}/api/objects/v4.1/config/object-stores/{objectStoreExtId}/buckets?$select=isStaticWebsiteEnabled"
        - name: name
          example: "https://{host}:{port}/api/objects/v4.1/config/object-stores/{objectStoreExtId}/buckets?$select=name"
        - name: objectCount
          example: "https://{host}:{port}/api/objects/v4.1/config/object-stores/{objectStoreExtId}/buckets?$select=objectCount"
        - name: objectLockEnabledTime
          example: "https://{host}:{port}/api/objects/v4.1/config/object-stores/{objectStoreExtId}/buckets?$select=objectLockEnabledTime"
        - name: objectLockRetentionSecs
          example: "https://{host}:{port}/api/objects/v4.1/config/object-stores/{objectStoreExtId}/buckets?$select=objectLockRetentionSecs"
        - name: outboundReplicationStatus
          example: "https://{host}:{port}/api/objects/v4.1/config/object-stores/{objectStoreExtId}/buckets?$select=outboundReplicationStatus"
        - name: ownerName
          example: "https://{host}:{port}/api/objects/v4.1/config/object-stores/{objectStoreExtId}/buckets?$select=ownerName"
        - name: pendingTieredUsageBytes
          example: "https://{host}:{port}/api/objects/v4.1/config/object-stores/{objectStoreExtId}/buckets?$select=pendingTieredUsageBytes"
        - name: state
          example: "https://{host}:{port}/api/objects/v4.1/config/object-stores/{objectStoreExtId}/buckets?$select=state"
        - name: storageUsageBytes
          example: "https://{host}:{port}/api/objects/v4.1/config/object-stores/{objectStoreExtId}/buckets?$select=storageUsageBytes"
        - name: tieredGarbageBytes
          example: "https://{host}:{port}/api/objects/v4.1/config/object-stores/{objectStoreExtId}/buckets?$select=tieredGarbageBytes"
        - name: tieredUsageBytes
