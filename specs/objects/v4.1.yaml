      summary: Update an Object store
      description: |
        Update an Object store by modifying its state or configuration. The Object store can be updated when it is in specific states with supported state transitions:
        **Supported State Transitions:** - From `UNDEPLOYED_OBJECT_STORE` to `UNDEPLOYED_OBJECT_STORE`: Update and save the Object store configuration without starting the deployment. - From `UNDEPLOYED_OBJECT_STORE` to `DEPLOYING_OBJECT_STORE`: Start deployment of the Object store using the provided configuration. All required deployment parameters must be provided. - From `OBJECT_STORE_DEPLOYMENT_FAILED` to `OBJECT_STORE_DEPLOYMENT_FAILED`: Retry the failed deployment using the existing Object store configuration. No configuration changes are allowed. - From `OBJECT_STORE_DEPLOYMENT_FAILED` to `DEPLOYING_OBJECT_STORE`: Retry the failed deployment using the existing Object store configuration. No configuration changes are allowed - only the state can be modified.
      operationId: updateObjectstoreById
      parameters:
      - name: extId
        in: path
        description: The UUID of the Object store.
        required: true
        style: simple
        explode: false
