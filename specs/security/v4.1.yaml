        description: "A URL query parameter that allows clients to request a specific\
          \ set of properties for each entity or complex type. Expression specified\
          \ with the $select must conform to the [OData V4.01](https://docs.oasis-open.org/odata/odata/v4.01/odata-v4.01-part1-protocol.html)\
