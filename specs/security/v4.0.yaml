openapi: 3.0.1
info:
  title: Nutanix Security APIs
  description: "Manage security features, such as encryption, certificates, or platform\
    \ hardening."
  version: 4.0.1
  x-repo-name: security
  x-logo:
    altText: Security Logo
    url: https://developers.nutanix.com/api/v1/namespaces/security/images/security-logo-img.svg
servers:
- url: "https://{pc-ip}:9440/api"
security:
- basicAuthScheme: []
- apiKeyAuthScheme: []
tags:
- name: Credentials
  description: |
    Provides the ability Create credentials and manage them.
  x-displayName: Credentials
- name: KeyManagementServers
  description: Key Management Servers secure data encryption keys when encryption
    is enabled.
  x-displayName: Key Management Servers
- name: STIGs
  description: |
    The Security Technical Implementation Guide (STIG) is a configuration standard consisting of cybersecurity requirements for a specific product. STIGs usage provides a methodology for securing protocols within networks, servers, computers, and logical designs to improve overall security. The STIG APIs provide the ability to view the STIG report and details about the STIGs in a cluster.
- name: ApprovalPolicies
  description: |
    The approval policies define the approval flow for the Secure Snap feature in the system. The approval policies APIs allow users to manage approval policies in the system. It can be created, updated, deleted, and listed.
  x-displayName: Approval Policies
