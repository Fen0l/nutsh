openapi: 3.0.1
info:
  title: Nutanix Iam Versioned APIs
  description: Manage Identity and Access Management of Nutanix clusters.
  version: 4.0.2-beta-1
  x-repo-name: iam
  x-logo:
    altText: Iam Logo
    url: https://developers.nutanix.com/api/v1/namespaces/iam/images/iam-logo-img.svg
servers:
- url: "https://{pc-ip}:9440/api"
security:
- basicAuthScheme: []
tags:
- name: CertificateAuthenticationProviders
  description: |
    Represents the APIs to configure Certificate-based Providers for user authentication. Use these APIs to create, list, fetch, update, and delete Certificate-based Authentication Providers.
  x-displayName: Certificate Authentication Providers
- name: DirectoryServices
  description: |
    Represents the APIs to configure AD or OpenLDAP Directories for authenticating Users. Directory Services can be created, listed, fetched, updated and deleted using these APIs.
  x-displayName: Directory Services
- name: SAMLIdentityProviders
  description: |
    Represents the APIs to configure SAML Identity Providers such as ADFS or OKTA for authenticating users. Use these APIs to create, list, fetch, update, and delete SAML Identity Providers. Also, you can use these APIs to fetch SAML sp-metadata.
  x-displayName: SAML Identity Providers
- name: ServiceAccounts
  description: |
    Represents the APIs to create a Service Account and its credentials. Use these APIs to create, list, fetch, update, and delete Service Accounts, Access Keys and API Keys. Also, they are used to revoke API Keys.
  x-displayName: Service Accounts
- name: ApiKeys
  description: |
    Represents the APIs to configure an API Key that is associated with a service account. Use these APIs to validate API Keys.
  x-displayName: Api Keys
- name: UserGroups
  description: |
    Represents the APIs to configure User Groups which are a collection of IAM users. Use these APIs to create, list, fetch and delete User Groups.
  x-displayName: User Groups
- name: Users
  description: |
    Represents the APIs to configure local, SAML, LDAP and external users. Use these APIs to create, list, fetch, update, and delete users. Use these APIs to create, list, and delete Bucket Access Keys. Also, use these APIs to change and reset user passwords and change status.
  x-displayName: Users
- name: AuthorizationPolicies
  description: |
    Represents the APIs to configure Authorization Policies for Identities to give them access to perform a list of operations on certain entities. Use these APIs to create, list, fetch, update, and delete Authorization Policies.
  x-displayName: Authorization Policies
- name: Clients
  description: |
    Represents the APIs to configure and manage service clients. Use these APIs to register, list, fetch, and update service clients.
  x-displayName: Clients
- name: Entities
  description: |
    Represents the APIs to configure and manage entities which are the resources over which permissions are defined. Use these APIs to list and fetch entities.
  x-displayName: Entities
- name: Operations
  description: |
    Represents the APIs to manage the operations that an Identity can perform on a set of entities. Use these APIs to list and fetch operations.
  x-displayName: Operations
- name: Roles
  description: |
    Represents the APIs to manage and configure Roles for Identities. A Role represents a list of operations. Use these APIs to create, list, fetch, update and delete for Roles.
  x-displayName: Roles
