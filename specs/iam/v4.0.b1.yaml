    iam.v4.r0.b1.authn.ServiceAccountKey:
      description: "Credentials in the form of a private key and certificate for the\
        \ Service Account, for authentication over mTLS."
      allOf:
      - $ref: '#/components/schemas/common.v1.r0.b1.response.ExternalizableAbstractModel'
      - type: object
        properties:
          name:
            maxLength: 255
            minLength: 1
            pattern: "^[^<>;'()&+%\\/\\\\\"`]*$"
            type: string
            description: Identifier of the Service Account Key in the form of a name.
          description:
            maxLength: 1000
            pattern: "^[^<>;()&+%\\/\\\\\"`]*$"
            type: string
            description: Brief description of the Service Account Key.
          serialNumber:
            type: string
            description: Serial number of the certificate.
            readOnly: true
          certificate:
            type: string
            description: "X509 certificate signed by IAM in PEM format (includes leaf\
              \ as well as ICAs), returned only during creation."
            readOnly: true
          privateKey:
            type: string
            description: "RSA private key encoded in PEM format, returned only during\
              \ creation."
            readOnly: true
          createdTime:
            type: string
            description: User or Service who created the Nutanix Access Key.
            format: date-time
            readOnly: true
          createdBy:
            type: string
            description: Creation time for the Nutanix Access Key.
            readOnly: true
          expiryTime:
            type: string
            description: Expiry time of the Certificate.
            format: date-time
            readOnly: true
        additionalProperties: false
    iam.v4.r0.b1.authn.ApiKey:
      required:
      - name
      description: Credentials in the form of a unique random key for the Service
        Account.
      allOf:
      - $ref: '#/components/schemas/common.v1.r0.b1.response.ExternalizableAbstractModel'
      - type: object
        properties:
          name:
            maxLength: 255
            minLength: 1
            pattern: "^[^<>;'()&+%\\/\\\\\"`]*$"
            type: string
            description: Identifier for the API Key in the form of a name.
          description:
            maxLength: 1000
            pattern: "^[^<>;()&+%\\/\\\\\"`]*$"
            type: string
            description: Brief description of the API Key.
          scope:
            maxItems: 50
            minItems: 0
            type: array
            description: "An optional set of audiences for the API key, meant to restrict\
              \ its access to APIs."
            items:
              maxLength: 2000
              minLength: 1
              type: string
          customOptions:
            $ref: '#/components/schemas/iam.v4.r0.b1.authn.ApiKeyCustomOptions'
          apiKey:
            type: string
            description: "The actual API key value, returned only during creation."
            readOnly: true
          status:
            $ref: '#/components/schemas/iam.v4.r0.b1.authn.ApiKeyStatusType'
          createdTime:
            type: string
            description: The creation time of the API Key.
            format: date-time
            readOnly: true
          createdBy:
            type: string
            description: User or Service who created the API Key.
            readOnly: true
          lastUsedTime:
            type: string
            description: The time when the API key was last used.
            format: date-time
            readOnly: true
          expiryTime:
            type: string
            description: The expiry time of the API Key.
            format: date-time
        additionalProperties: false
