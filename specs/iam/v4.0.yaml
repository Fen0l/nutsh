    iam.v4.0.authn.SamlIdentityProvider:
      required:
      - name
      description: Information of SAML IDP.
      allOf:
      - $ref: '#/components/schemas/common.v1.0.response.ExternalizableAbstractModel'
      - type: object
        properties:
          idpMetadataUrl:
            maxLength: 2000
            minLength: 3
            pattern: "^((http[s]?|nfs):\\/)?\\/?([^:\\/\\s]*)((\\/\\w+)*(:[0-9]+)*?\\\
              /)([\\w\\-\\.]+[^#?\\s]+)(.*)?(#[\\w\\-]+)?$"
            type: string
            description: Metadata URL that provides IDP details.
            writeOnly: true
            example: "http://{{idp_host}}/idp_metadata"
          idpMetadataXml:
            minLength: 3
            type: string
            description: Base64 encoded metadata in XML format with IDP details.
            writeOnly: true
          idpMetadata:
            $ref: '#/components/schemas/iam.v4.0.authn.IdpMetadata'
          name:
            maxLength: 255
            minLength: 1
            pattern: "^[^<>;'()&+%\\/\\\\\"`]*$"
            type: string
            description: Unique name of the IDP.
            example: saml1
          usernameAttribute:
            maxLength: 256
            minLength: 1
            pattern: "^[^<>;'()&+%\\/\\\\\"`]*$"
            type: string
            description: SAML assertion username attribute element.
            default: name
          emailAttribute:
            maxLength: 256
            minLength: 3
            type: string
            description: SAML assertion email attribute element.
            default: email
          groupsAttribute:
            maxLength: 256
            minLength: 3
            type: string
            description: SAML assertion groups attribute element.
            example: grpAttribute1
          groupsDelim:
            maxLength: 3
            minLength: 1
            type: string
            description: Delimiter is used to split the value of an attribute into
              multiple groups.
          customAttributes:
            maxItems: 25
            minItems: 0
            type: array
            description: SAML assertions for a list of custom attribute elements.
            items:
              maxLength: 16
              type: string
              example: Attribute1
          entityIssuer:
            maxLength: 2000
            minLength: 3
            type: string
            description: It will be used as an issuer in SAML authnRequest.
            example: issuer1
          isSignedAuthnReqEnabled:
            type: boolean
            description: Flag indicating signing of SAML authnRequests.
            example: true
          createdTime:
            type: string
            description: Creation time of the SAML identity provider.
            format: date-time
            readOnly: true
            example: 2009-09-23T14:30:00-07:00
          lastUpdatedTime:
            type: string
            description: Last updated time of the SAML identity provider.
            format: date-time
            readOnly: true
            example: 2009-09-23T14:30:00-07:00
          createdBy:
            type: string
            description: User or service who created the SAML identity provider.
            readOnly: true
            example: 390b7801-7a80-5c94-8a07-8de63651b27b
        additionalProperties: false
    iam.v4.0.authn.CreateSamlIdentityProviderApiResponse:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/common.v1.0.response.ApiResponseMetadata'
        data:
          required:
          - $objectType
          properties:
            $objectType:
              type: string
              example: iam.v4.authn.SamlIdentityProvider
          oneOf:
          - $ref: '#/components/schemas/iam.v4.0.authn.SamlIdentityProvider'
          - $ref: '#/components/schemas/iam.v4.0.error.ErrorResponse'
      additionalProperties: false
      description: REST response for all response codes in API path /iam/v4.0/authn/saml-identity-providers
        Post operation
    iam.v4.0.authn.IdpMetadata:
      required:
      - certificate
      - entityId
      - loginUrl
      type: object
      properties:
        entityId:
          maxLength: 2000
          minLength: 3
          type: string
          description: Entity identifier of identity provider.
          example: "http://{{idp_host}}/entity"
        loginUrl:
          maxLength: 2000
          minLength: 3
          pattern: "^((http[s]?|nfs):\\/)?\\/?([^:\\/\\s]*)((\\/\\w+)*(:[0-9]+)*?\\\
            /)([\\w\\-\\.]+[^#?\\s]+)(.*)?(#[\\w\\-]+)?$"
          type: string
          description: Login URL of the identity provider.
          example: "http://{{idp_host}}/loginUrl"
        logoutUrl:
          maxLength: 2000
          minLength: 3
          pattern: "^((http[s]?|nfs):\\/)?\\/?([^:\\/\\s]*)((\\/\\w+)*(:[0-9]+)*?\\\
            /)([\\w\\-\\.]+[^#?\\s]+)(.*)?(#[\\w\\-]+)?$"
          type: string
          description: Logout URL of the identity provider.
          example: "http://{{idp_host}}/logoutUrl"
        errorUrl:
          maxLength: 2000
          minLength: 3
          pattern: "^((http[s]?|nfs):\\/)?\\/?([^:\\/\\s]*)((\\/\\w+)*(:[0-9]+)*?\\\
            /)([\\w\\-\\.]+[^#?\\s]+)(.*)?(#[\\w\\-]+)?$"
          type: string
          description: Error URL of the identity provider.
          example: "http://{{idp_host}}/errorUrl"
        certificate:
          minLength: 64
          type: string
          description: Certificate for verification.
        nameIdPolicyFormat:
          $ref: '#/components/schemas/iam.v4.0.authn.NameIdPolicyFormat'
      additionalProperties: false
      description: Information of the IDP.
    iam.v4.0.authn.NameIdPolicyFormat:
      type: string
      description: Name ID Policy format.
      enum:
      - emailAddress
      - unspecified
      - X509SubjectName
      - WindowsDomainQualifiedName
      - encrypted
      - entity
      - kerberos
      - persistent
      - transient
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        emailAddress: Uses email address as the NameID format.
        encrypted: Uses encrypted as the NameID format.
        unspecified: NameID format is left to the individual implementations.
        transient: Uses identifier with transient semantics as the NameID format.
        WindowsDomainQualifiedName: Uses Windows domain qualified name as the NameID
          format.
        X509SubjectName: Uses X509SubjectName as the NameID format.
        kerberos: Uses kerberos principal name as the NameID format.
        persistent: Uses persistent name identifier as the NameID format.
        $UNKNOWN: |
          Unknown value.
        entity: Uses identitfier of an entity as the NameID format.
        $REDACTED: |
          Redacted value.
