          role creation and it will be returned in GET/LIST API response.
        INTERNAL: This type of operation will not be available to be consumed for
          custom role creation and will not be returned in GET/LIST API response.
        $UNKNOWN: |
          Unknown value.
        $REDACTED: |
          Redacted value.
        SYSTEM_DEFINED_ONLY: This type of operation will not be available to be consumed
          for custom role creation but it will be returned in GET/LIST API response.
