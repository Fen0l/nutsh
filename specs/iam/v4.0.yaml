          example: http://127.0.0.1:8080
        isCrlEnabled:
          type: boolean
          description: Flag to enable/disable CRL revocation check.
          example: false
        crlDps:
          maxItems: 10
          minItems: 0
          type: array
          description: List of the CRL distribution points which will be used to fetch
            the CRLs.
          items:
            pattern: "^((http[s]?|nfs):\\/)?\\/?([^:\\/\\s]*)((\\/\\w+)*(:[0-9]+)*?\\\
              /)([\\w\\-\\.]+[^#?\\s]+)(.*)?(#[\\w\\-]+)?$"
            type: string
            example: "http://{{ip}}/crl/ca.crl"
