          lastUpdatedTime:
            type: string
            description: Creation time for the bucket access key.
            format: date-time
            readOnly: true
            example: 2009-09-23T14:30:00-07:00
        additionalProperties: false
    iam.v4.0.authn.BucketsAccessKeyStatusType:
