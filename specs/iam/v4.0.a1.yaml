          - createdBy
          - extId
          - name
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: $orderby
        in: query
        description: |
          A URL query parameter that allows clients to specify the sort criteria for the returned list of objects. Resources can be sorted in ascending order using asc or descending order using desc. If asc or desc are not specified the resources will be sorted in ascending order by default. For example, 'orderby=templateName desc' would get all templates sorted by templateName in desc order.
          The orderby can be applied to the following fields:
          - createdTime
          - lastUpdatedTime
          - name
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: $select
        in: query
        description: |
          A URL query parameter that allows clients to request a specific set of properties for each entity or complex type. Expression specified with the $select must conform to the OData V4.01 URL conventions. If a $select expression consists of a single select item that is an asterisk (i.e. *), then all properties on the matching resource will be returned.
