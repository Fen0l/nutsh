openapi: 3.0.1
info:
  title: Nutanix Cloud Management Platform APIs
  description: "Provide functionalities that are common to APIs in namespaces aiops,\
    \ devops, secops, finops."
  version: 1.0.0
  x-logo:
    altText: Ops Management Logo
    url: https://developers.nutanix.com/api/v1/namespaces/opsmgmt/images/opsmgmt-logo-img.svg
  x-repo-name: opsmgmt
  x-minimum-negotiation-version: v4.0
servers:
- url: "https://{host}:{port}/api"
security:
- basicAuthScheme: []
- apiKeyAuthScheme: []
tags:
- name: ReportConfig
  description: "The report configuration represents a blueprint for creating detailed\
    \ and customized reports based on the user's requirements. These configurations\
    \ include information about the type of data to be included, the format of the\
    \ report, and the schedule for generating the report.  \n"
  x-displayName: Report Configuration
- name: Reports
  description: |
    The report represents an instance of a report that is generated based on the report configuration. Multiple reports can be generated from a single report configuration.
  x-displayName: Reports
- name: GlobalReportSetting
  description: |
    The global report setting represents the global settings that are applied to all report configurations a user owns. They are unique to the user and help them apply the same settings across report configurations.
  x-displayName: Global Report Settings
- name: ReportArtifacts
  description: The report artifacts represent the custom artifacts that a user can
    use to customize the reports like logos.
  x-displayName: Report Artifacts
