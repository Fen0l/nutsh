            description: List specifying the formats in which report is to be created.
              This overrides the supportedFormats defined in the report configuration.
            items:
              $ref: '#/components/schemas/opsmgmt.v4.0.config.ReportFormat'
          startTime:
            type: string
            description: UTC date and time in "%Y-%m-%d %H:%M:%S" format for data
              collection start point. Eg:- 2023-10-23 11:34:45
            format: date-time
            example: 2009-09-23T14:30:00-07:00
          endTime:
            type: string
            description: UTC date and time in "%Y-%m-%d %H:%M:%S" format for data
              collection end point. Eg:- 2023-10-23 11:34:45
            format: date-time
            example: 2009-09-23T14:30:00-07:00
          recipientFormats:
            maxItems: 2
            minItems: 0
            type: array
            description: List specifying the formats in which the report is to be
