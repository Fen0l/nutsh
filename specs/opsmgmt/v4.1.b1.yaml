openapi: 3.0.1
info:
  title: Nutanix Cloud Management Platform APIs
  description: "Provide functionalities that are common to APIs in namespaces aiops,\
    \ devops, secops, finops."
  version: 1.1.0-beta-1
  x-logo:
    altText: Ops Management Logo
    url: https://developers.nutanix.com/api/v1/namespaces/opsmgmt/images/opsmgmt-logo-img.svg
  x-repo-name: opsmgmt
  x-minimum-negotiation-version: v4.0
servers:
- url: "https://{host}:{port}/api"
security:
- basicAuthScheme: []
- apiKeyAuthScheme: []
tags:
- name: Dashboard
  description: |
    The NCM Dashboard represents a plane for creating detailed and customized dashbord comprising of views based on the user's requirements. These configurations include information about the type of data to be included, the location of the widgets in the dashboard.
  x-displayName: NCM Dashboard
- name: DashboardSettings
  description: |
    The Dashboard Settings provides information regarding the dashboard customizations. This includes information about the dashboard geoconfiguration.
  x-displayName: Dashboard Settings
- name: DashboardGeoconfiguration
  description: The Dashboard Geoconfiguration allows users to provide configuration
    for the dashboard geomap widget.
  x-displayName: Dashboard Geoconfiguration
- name: ReportConfig
  description: "The report configuration represents a blueprint for creating detailed\
    \ and customized reports based on the user's requirements. These configurations\
    \ include information about the type of data to be included, the format of the\
    \ report, and the schedule for generating the report.  \n"
  x-displayName: Report Configuration
- name: Reports
  description: |
    The report represents an instance of a report that is generated based on the report configuration. Multiple reports can be generated from a single report configuration.
  x-displayName: Reports
- name: GlobalReportSetting
  description: |
    The global report setting represents the global settings that are applied to all report configurations a user owns. They are unique to the user and help them apply the same settings across report configurations.
  x-displayName: Global Report Settings
- name: ReportArtifacts
  description: The report artifacts represent the custom artifacts that a user can
    use to customize the reports like logos.
  x-displayName: Report Artifacts
paths:
  /opsmgmt/v4.1.b1/config/dashboards:
    get:
      tags:
      - Dashboard
      summary: List all dashboards.
      description: List all dashboards.
      operationId: listDashboards
      parameters:
      - name: $page
        in: query
        description: |
          A URL query parameter that specifies the page number of the result set. It must be a positive integer between 0 and the maximum number of pages that are available for that resource. Any number out of this range might lead to no results. If both $page and $apply query parameters are present, $page will be applied on entities within the groups.
        required: false
        style: form
        explode: false
        schema:
          minimum: 0
          type: integer
          description: |
            A URL query parameter that specifies the page number of the result set. It must be a positive integer between 0 and the maximum number of pages that are available for that resource. Any number out of this range might lead to no results. If both $page and $apply query parameters are present, $page will be applied on entities within the groups.
          format: int32
          default: 0
      - name: $limit
        in: query
        description: |
          A URL query parameter that specifies the total number of records returned in the result set.  Must be a positive integer between 1 and 100. Any number out of this range will lead to a validation error. If the limit is not provided, a default value of 50 records will be returned in the result set. If both $limit and $apply query parameters are present, $limit  will be applied on entities within the groups. Default value of limit with $apply will be 5.
        required: false
        style: form
        explode: false
        schema:
          maximum: 100
          minimum: 1
          type: integer
          description: |
            A URL query parameter that specifies the total number of records returned in the result set.  Must be a positive integer between 1 and 100. Any number out of this range will lead to a validation error. If the limit is not provided, a default value of 50 records will be returned in the result set. If both $limit and $apply query parameters are present, $limit  will be applied on entities within the groups. Default value of limit with $apply will be 5.
          format: int32
          default: 50
      - name: $filter
        in: query
        description: |-
          A URL query parameter that allows clients to filter a collection of resources. The expression specified with $filter is evaluated for each resource in the collection, and only items where the expression evaluates to true are included in the response. Expression specified with the $filter must conform to the [OData V4.01](https://docs.oasis-open.org/odata/odata/v4.01/odata-v4.01-part1-protocol.html) URL conventions.
          For example, filter **$filter=name eq 'karbon-ntnx-1.0'** would filter the result on cluster name 'karbon-ntnx1.0', filter **$filter=startswith(name, 'C')** would filter on cluster name starting with 'C'. If both $filter and $apply query parameters are present, $filter will be applied on entities within the groups.
