          \ = 3\n    # Backoff factor to use during retry attempts\n    config.backoff_factor\
          \ = 3\n    # UserName to connect to the cluster\n    config.username = \"\
          username\"\n    # Password to connect to the cluster\n    config.password\
          \ = \"password\"\n    # Please add authorization information here if needed.\n\
          \    client = ntnx_aiops_py_client.ApiClient(configuration=config)\n   \
          \ scenarios_api = ntnx_aiops_py_client.ScenariosApi(api_client=client)\n\
          \    \n    scenario_ext_id = \"A0BC6ff2-9bDf-E4B0-eeec-C7cc6AE7AffE\"\n\n\
          \n    try:\n        headers = {'Accept': 'application/octet-stream'} # This\
          \ is required for operations that support multiple media types in the response\
          \ i.e. application/json, application/octet-stream etc.\n        # If only\
