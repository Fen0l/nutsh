openapi: 3.0.1
info:
  title: Nutanix AIOps APIs
  description: "Manage infrastructure on-premises and in the cloud seamlessly through\
    \ AIOps features such as Analysis, Reporting, Capacity Planning, What if Analysis,\
    \ VM Rightsizing, Troubleshooting, App Discovery, Broad Observability, and Ops\
    \ Automation through Playbooks."
  version: 4.0.2
  x-repo-name: aiops
  x-logo:
    altText: Aiops Logo
    url: https://developers.nutanix.com/api/v1/namespaces/aiops/images/aiops-logo-img.svg
servers:
- url: "https://{pc-ip}:9440/api"
security:
- basicAuthScheme: []
- apiKeyAuthScheme: []
tags:
- name: Metrics
  description: |
    The Metrics APIs provide a way to retrieve metrics data for entities. This includes time series data for various entity types  across different sources. The metrics data can be used to analyze the performance of entities, identify anomalies,  and generate alerts.
  x-displayName: Metrics
- name: Scenarios
  description: |
    Capacity planning scenarios are entities that assess the resource requirements for possible future workloads. This can help evaluate questions like whether there are more VMs, whether the cluster has sufficient resources to handle new database servers, and so on. Users can create capacity planning scenarios, check the runway for the cluster, and get recommendations for new nodes to accommodate the estimated workloads.
  x-displayName: Capacity Planning Scenarios
paths:
  /aiops/v4.0/config/sources:
    get:
      tags:
      - Metrics
      summary: Get a list of available sources
      description: Returns a list of available sources and their UUIDs. These UUIDs
        can further be used for other APIs to retrieve entity types and their metrics.
      operationId: getSourcesV4
      responses:
        "200":
          description: Returned all the sources.
          content:
