          example: string
        hypervisorMemoryUsagePpm:
          type: string
          example: string
        hypervisorCpuUsagePpm:
          type: string
          example: string
        rf:
          type: string
          example: string
        capacityBytes:
          type: string
          example: string
        freeBytes:
          type: string
          example: string
        usageBytes:
          type: string
