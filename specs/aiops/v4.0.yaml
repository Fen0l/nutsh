            description: Category name of the format "key/value"
            example: AnalyticsExclusions
          isDefault:
            type: boolean
            description: "A flag that indicates whether this category is a critical\
              \ out-of-box category, and might not be removed from the policy."
            readOnly: true
            default: false
        additionalProperties: false
    aiops.v4.0.stats.ScenarioStats:
      type: object
      properties:
        scenarioExtId:
          type: string
          description: The UUID of the WhatIf Scenario associated with the Scneario
            Stats.
          example: string
        stats:
          type: array
          description: WhatIf Scenario entity statistic time-series.
          items:
            $ref: '#/components/schemas/aiops.v4.0.stats.ScenarioStatsTuple'
      additionalProperties: false
      description: A collection of WhatIf Scenario stats.
    aiops.v4.0.stats.ScenarioStatsTuple:
      type: object
      properties:
        timestamp:
          type: string
          description: Timestamp of a WhatIf Scenario statistic attribute data point.
          format: date-time
          example: 2009-09-23T14:30:00-07:00
        cpuUsageGhz:
          type: number
          description: Usage of CPU resources in Ghz.
          format: double
          example: 17.60997863226391
        cpuCapacityGhz:
          type: number
          description: CPU capacity in Ghz.
          format: double
          example: 46.082595303637966
        cpuEffectiveCapacityGhz:
          type: number
          description: CPU effective capacity in Ghz.
          format: double
          example: 6.879634939988344
        memoryUsageGb:
          type: number
          description: Usage of Memory resources in Gb.
          format: double
          example: 98.51027002411008
        memoryCapacityGb:
          type: number
          description: Memory capacity in Gb.
          format: double
          example: 50.57427703204874
        memoryEffectiveCapacityGb:
          type: number
          description: Memory effective capacity in Gb.
          format: double
          example: 84.24725920788325
        storageUsageGb:
          type: number
          description: Usage of storage resources in Gb.
          format: double
          example: 27.142955485271912
        storageCapacityGb:
          type: number
          description: Storage capacity in Gb.
          format: double
          example: 46.51105835797627
        storageEffectiveCapacityGb:
          type: number
          description: Storage effective capacity in Gb.
          format: double
          example: 85.58624374831285
      additionalProperties: false
      description: "Tuple value of timestamp and CPU/Memory/Storage resource usage,\
        \ capacity, and effective capacity."
    aiops.v4.0.clusterMetrics.Cluster:
