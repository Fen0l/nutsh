                  data:
                    maxItems: 50
                    minItems: 0
                    type: array
                    items:
                      $ref: '#/components/schemas/aiops.v4.0.config.Source'
                additionalProperties: false
                description: REST response for all response codes in API path /aiops/v4.0/config/sources
                  Get operation
        "4XX":
          description: Client error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    $ref: '#/components/schemas/common.v1.0.response.ApiResponseMetadata'
