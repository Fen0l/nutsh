          - $ref: '#/components/schemas/aiops.v4.2.b1.config.SplunkWorkload'
          - $ref: '#/components/schemas/aiops.v4.2.b1.config.CitrixXenWorkload'
          - $ref: '#/components/schemas/aiops.v4.2.b1.config.MicrosoftXenWorkload'
