    aiops.v4.2.b1.config.Runway:
      required:
      - cpuRunwayDays
      - memoryRunwayDays
      - minimumRunwayDays
      - runwayStartTime
      - storageRunwayDays
      type: object
      properties:
        minimumRunwayDays:
          maximum: 366
          minimum: -1
          type: integer
          description: "Number of days the cluster will be able to sustain the existing\
            \ and added workloads. If the value is -1, it indicates that the runway\
            \ has not yet been calculated for one or more resources."
          format: int32
          example: 26
        cpuRunwayDays:
          maximum: 366
          minimum: -1
          type: integer
          description: "Number of days the CPU can sustain the added and existing\
            \ workload. If the value is -1, it indicates that the runway is not yet\
            \ calculated for CPU."
          format: int32
          example: 17
        memoryRunwayDays:
          maximum: 366
          minimum: -1
          type: integer
          description: "Number of days the memory can sustain the added and existing\
            \ workload. If the value is -1, it indicates that the runway is not yet\
            \ calculated for memory."
          format: int32
          example: 92
        storageRunwayDays:
          maximum: 366
          minimum: -1
          type: integer
          description: "Number of days the storage can sustain the added and existing\
            \ workload. If the value is -1, it indicates that the runway is not yet\
            \ calculated for storage."
          format: int32
          example: 52
        runwayStartTime:
          type: string
          description: "The starting time of the usage, capacity, and effective capacity\
            \ forecasts. It is used as the start-time in stats API to query scenario\
            \ statistics."
          format: date-time
          example: 2009-09-23T14:30:00-07:00
      additionalProperties: false
      description: Runway in a scenario.
