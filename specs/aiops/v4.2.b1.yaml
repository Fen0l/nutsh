              import1 "github.com/nutanix/ntnx-api-golang-clients/aiops-go-client/v4/models/aiops/v4/config"
              import2 "github.com/nutanix/ntnx-api-golang-clients/aiops-go-client/v4/models/prism/v4/config"
          )

          var (
              ApiClientInstance *client.ApiClient
              ScenariosServiceApiInstance *api.ScenariosServiceApi
          )

          func main() {
              ApiClientInstance = client.NewApiClient()
              // IPv4/IPv6 address or FQDN of the cluster
              ApiClientInstance.Host = "localhost"
              // Port used for the connection. PC products typically use port 9440, while NC products typically use port 443. See the product-specific documentation for accurate configuration.
              ApiClientInstance.Port = 9440
              // Interval in ms to use during retry attempts
              ApiClientInstance.RetryInterval = 5 * time.Second
              // Max retry attempts while reconnecting on a loss of connection
              ApiClientInstance.MaxRetryAttempts = 5
              // UserName to connect to the cluster
              ApiClientInstance.Username = "username"
              // Password to connect to the cluster
              ApiClientInstance.Password = "password"
              // Please add authorization information here if needed.
              ScenariosServiceApiInstance = api.NewScenariosServiceApi(ApiClientInstance)
              ctx := context.Background()

              scenario := import1.NewScenario()

              // Scenario object initializations here...



              request := scenarios.CreateScenarioRequest{ Body: scenario }
              response, error := ScenariosServiceApiInstance.CreateScenario(ctx, &request)
              if error != nil {
                  fmt.Println(error)
                  return
              }
              data, _ := response.GetData().(import2.TaskReference)
              fmt.Println(data)

          }

