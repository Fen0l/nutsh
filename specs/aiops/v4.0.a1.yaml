      - $ref: '#/components/schemas/common.v1.r0.a3.response.ExternalizableAbstractModel'
      - type: object
        properties:
          clusterName:
            type: string
            description: Name of the cluster
            example: string
          externalIP:
            $ref: '#/components/schemas/common.v1.r0.a3.config.IPv4Address'
          cvmIPs:
            type: array
            description: CVM IPs of the nodes in the cluster
            items:
              $ref: '#/components/schemas/common.v1.r0.a3.config.IPv4Address'
          totalMemorySizeBytes:
            type: integer
            description: Total memory size in bytes in the cluster
            format: int64
            example: 72
          currentMemoryUsageSizeBytes:
            type: integer
            description: Total memory size in bytes currently being used by the active
              VMs
            format: int64
            example: 75
          provisionedMemoryUsageBytes:
            type: integer
            description: Total memory size in bytes provisioned for all the VMs
            format: int64
            example: 99
          maxVmMemorySizeBytes:
            type: integer
            description: Largest possible memory size in bytes for the next VM that
              can be added
            format: int64
            example: 5
          availableMemorySizeBytes:
            type: integer
            description: Total amount of available memory in bytes for deploying new
              VMs
            format: int64
            example: 55
