              \ rules."
            items:
              $ref: '#/components/schemas/microseg.v4.r0.b1.config.NetworkSecurityPolicyRule'
          isIpv6TrafficAllowed:
            type: boolean
            description: If Ipv6 Traffic is allowed.
          isHitlogEnabled:
