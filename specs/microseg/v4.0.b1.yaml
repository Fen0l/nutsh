            description: |
              Name of the Flow Network Security Policy.<br>
              It can have a maximum length of 63 characters.
          type:
            $ref: '#/components/schemas/microseg.v4.r0.b1.config.SecurityPolicyType'
          description:
            maxLength: 512
            type: string
            description: A user defined annotation for a policy.
          state:
