        Post operation
    microseg.v4.r0.b1.config.SecurityPolicyType:
      type: string
      description: Defines the type of rules that can be used in a policy.
      enum:
      - $UNKNOWN
      - $REDACTED
      - QUARANTINE
      - ISOLATION
      - APPLICATION
      x-enumDescriptions:
        QUARANTINE: A Policy where inbound and outbound traffic is not allowed.
        ISOLATION: A Policy where two environments are isolated from each other.
        APPLICATION: A Policy for specifying allowed traffic for an application.
    microseg.v4.r0.b1.config.SecurityPolicyState:
      type: string
      description: Whether the policy is applied or monitored; can be omitted or set
        null to save the policy without applying or monitoring it.
      enum:
      - $UNKNOWN
      - $REDACTED
      - SAVE
      - MONITOR
      - ENFORCE
      x-enumDescriptions:
        ENFORCE: Policy is enforced and the traffic from/to specified inbounds/outbounds
          is allowed and rest is dropped.
        MONITOR: Monitors the flow and doesn't drop the traffic.
        SAVE: Policy is just created and saved in DB.
    microseg.v4.r0.b1.config.NetworkSecurityPolicyRule:
      allOf:
      - $ref: '#/components/schemas/common.v1.r0.b1.response.ExternalizableAbstractModel'
      - required:
        - spec
        - type
        type: object
        properties:
          description:
            maxLength: 64
            type: string
            description: A user defined annotation for a rule.
          type:
            $ref: '#/components/schemas/microseg.v4.r0.b1.config.RuleType'
          spec:
            required:
            - $objectType
            properties:
              $objectType:
                type: string
                example: microseg.v4.config.TwoEnvIsolationRuleSpec
            oneOf:
            - $ref: '#/components/schemas/microseg.v4.r0.b1.config.TwoEnvIsolationRuleSpec'
            - $ref: '#/components/schemas/microseg.v4.r0.b1.config.ApplicationRuleSpec'
            - $ref: '#/components/schemas/microseg.v4.r0.b1.config.IntraEntityGroupRuleSpec'
        additionalProperties: false
    microseg.v4.r0.b1.config.SecurityPolicyScope:
      type: string
      description: "Defines the scope of the policy. Currently, only ALL_VLAN and\
        \ VPC_LIST are supported. If scope is not provided, the default is set based\
        \ on whether vpcReferences field is provided or not."
      enum:
      - $UNKNOWN
      - $REDACTED
      - ALL_VLAN
      - ALL_VPC
      - VPC_LIST
      x-enumDescriptions:
        ALL_VLAN: Policy is scoped to all the VLANs.
        ALL_VPC: Policy is scoped to all the VPCs. This value is not supported in
          this release.
        VPC_LIST: Policy is scoped to the list of VPCs specified in vpcReferences.
    microseg.v4.r0.b1.config.RuleType:
      type: string
      description: The type for a rule - the value chosen here restricts which specification
        can be chosen.
      enum:
      - $UNKNOWN
      - $REDACTED
      - QUARANTINE
      - TWO_ENV_ISOLATION
      - APPLICATION
      - INTRA_GROUP
      x-enumDescriptions:
        QUARANTINE: An Application Rule where inbound and outbound traffic is not
          allowed.
        INTRA_GROUP: A rule for specifying allowed traffic inside of a secured entity
          group.
        APPLICATION: A rule for specifying allowed traffic for an application.
        TWO_ENV_ISOLATION: A rule for specifying that two environments should be isolated
          from each other. Specify both 'firstIsolationGroup' and 'secondIsolationGroup'.
