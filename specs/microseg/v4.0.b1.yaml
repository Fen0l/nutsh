openapi: 3.0.1
info:
  title: Nutanix Microseg Versioned APIs
  description: Manage Network Security Policy configuration of Nutanix clusters.
  version: 4.0.1-beta-1
  x-logo:
    altText: Security Logo
    url: https://developers.nutanix.com/api/v1/namespaces/microseg/images/microseg-logo-img.svg
  x-repo-name: microseg
servers:
- url: "https://{pc-ip}:9440/api"
security:
- basicAuthScheme: []
tags:
- name: AddressGroups
  description: |
    An Address Group is a logical group of one or more IP Addresses or ranges. An Address Group, once created, can be used while creating network security policies. You can manage the Address Groups using these APIs.
  x-displayName: Address Groups
- name: ServiceGroups
  description: |
    A Service Group is a logical group of protocol-port combinations. A custom Service Group, once created, can be used while creating network security policies. You can manage the Service Groups using these APIs.
  x-displayName: Service Groups
- name: NetworkSecurityPolicies
  description: |
    A Network Security Policy is a set of rules configured to protect entities across the network. You can use these APIs to create different types of policies such as Application, Isolation, and Quarantine with Inbound/Outbound as categories, IP Addresses or ranges, CIDR blocks, subnets and/or Address Groups/Service Groups.
  x-displayName: Network Security Policies
- name: DirectoryServerConfigs
  description: |
    You can use these APIs to import User Groups from Active Directory into Prism Central as Categories. VDI policies can be configured around these categories.
  x-displayName: Directory Server Configs
