          oneOf:
          - $ref: '#/components/schemas/microseg.v4.1.config.ServiceGroup'
          - $ref: '#/components/schemas/microseg.v4.1.error.ErrorResponse'
      additionalProperties: false
      description: "REST response for all response codes in API path /microseg/v4.1/config/service-groups/{extId}\
        \ Get operation"
    microseg.v4.1.config.UpdateServiceGroupApiResponse:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/common.v1.0.response.ApiResponseMetadata'
        data:
          required:
          - $objectType
          properties:
            $objectType:
              type: string
              example: prism.v4.config.TaskReference
          oneOf:
          - $ref: '#/components/schemas/prism.v4.1.config.TaskReference'
