          description: The beginning of the port number of the TCP/UDP port range.
          format: int32
          example: 17
        endPort:
          maximum: 65535
          minimum: 0
          type: integer
          description: The end of the port number of the TCP/UDP port range.
          format: int32
          example: 92
      additionalProperties: false
      description: Range of TCP/UDP ports.
    microseg.v4.1.config.IcmpTypeCodeSpec:
