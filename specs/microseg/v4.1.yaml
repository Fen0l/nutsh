      - NONE
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        ALL: Allow All Traffic.
        NONE: Allow No Traffic.
        $UNKNOWN: |
          Unknown value.
        $REDACTED: |
          Redacted value.
