          minimum: 0
          type: integer
          format: int32
        endPort:
          maximum: 65535
          minimum: 0
          type: integer
          format: int32
      additionalProperties: false
      description: Range of TCP/UDP ports.
    microseg.v4.r0.a1.config.IcmpTypeCodeSpec:
      type: object
