          package main

          import (
              "fmt"
              "github.com/nutanix/ntnx-api-golang-clients/microseg-go-client/v4/api"
              "github.com/nutanix/ntnx-api-golang-clients/microseg-go-client/v4/client"
              import1 "github.com/nutanix/ntnx-api-golang-clients/microseg-go-client/v4/models/prism/v4/config"
          )

          var (
              ApiClientInstance *client.ApiClient
              ServiceGroupsApiInstance *api.ServiceGroupsApi
          )

          func main() {
              ApiClientInstance = client.NewApiClient()
              // IPv4/IPv6 address or FQDN of the cluster
              ApiClientInstance.Host = "localhost"
              // Port to which to connect to
              ApiClientInstance.Port = 9440
              // Interval in ms to use during retry attempts
              ApiClientInstance.RetryInterval = 5000
              // Max retry attempts while reconnecting on a loss of connection
              ApiClientInstance.MaxRetryAttempts = 5
              // UserName to connect to the cluster
              ApiClientInstance.Username = "username"
              // Password to connect to the cluster
              ApiClientInstance.Password = "password"
              // Please add authorization information here if needed.
              ServiceGroupsApiInstance = api.NewServiceGroupsApi(ApiClientInstance)

              extId := "E07742EF-CEe5-eeAa-DDEA-a0AE9C60197F"

              response, error := ServiceGroupsApiInstance.DeleteServiceGroupByExtId(&extId)
              if error != nil {
                  fmt.Println(error)
                  return
              }
              data, _ := response.GetData().(import1.TaskReference)
              fmt.Println(data)
          }

