        type:
          maximum: 43
          minimum: 0
          type: integer
          description: Ignore this field if Type has to be ANY.
          format: int32
        code:
          maximum: 15
          minimum: 0
          type: integer
          description: Ignore this field if Code has to be ANY.
          format: int32
      additionalProperties: false
      description: Icmp Type Code Object
    microseg.v4.r0.a1.config.IntraEntityGroupRuleAction:
      type: string
