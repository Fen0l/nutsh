    microseg.v4.r0.a1.config.OptionSpec:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/microseg.v4.r0.a1.config.TierName'
        memoryInGB:
          maximum: 6
          minimum: 2
          type: integer
          description: Memory in GB of the tier
          format: int32
        description:
          maxLength: 30
          type: string
          description: Description of the tier
