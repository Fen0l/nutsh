    microseg.v4.2.config.EntityGroup:
      allOf:
      - $ref: '#/components/schemas/common.v1.0.response.ExternalizableAbstractModel'
      - required:
        - name
        type: object
        properties:
          name:
            maxLength: 64
            pattern: "^\\s*[a-zA-Z0-9]([a-zA-Z0-9-_ \\\\.]*[a-zA-Z0-9])?\\s*$"
            type: string
            description: A short identifier of an Entity Group.
