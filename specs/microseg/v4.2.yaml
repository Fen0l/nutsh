          creationTime:
            type: string
            description: The timestamp when the Entity Group was created.
            format: date-time
            readOnly: true
            example: 2009-09-23T14:30:00-07:00
          lastUpdateTime:
            type: string
            description: The timestamp when the Entity Group was last updated.
            format: date-time
            readOnly: true
            example: 2009-09-23T14:30:00-07:00
