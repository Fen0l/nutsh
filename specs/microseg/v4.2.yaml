            type: string
            example: 17404066-44ff-4367-977a-c5fb18c0dcc0
        addresses:
          $ref: '#/components/schemas/microseg.v4.2.config.Addresses'
        ipRanges:
          $ref: '#/components/schemas/microseg.v4.2.config.IpRange'
      additionalProperties: false
      description: An except entity is a collection of entities that are excluded
        from the Entity Group.
    microseg.v4.2.config.ExceptSelectBy:
      type: string
      description: Select by field for the except entity.
      enum:
      - EXT_ID
      - IP_VALUES
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        IP_VALUES: IP address.
        EXT_ID: External identifier.
        $UNKNOWN: |
          Unknown value.
        $REDACTED: |
          Redacted value.
    microseg.v4.2.config.ExceptType:
