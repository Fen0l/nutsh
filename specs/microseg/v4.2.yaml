            readOnly: true
            items:
              $ref: '#/components/schemas/common.v1.0.response.ApiLink'
        additionalProperties: false
    common.v1.0.config.IPv4Address:
      required:
      - value
      type: object
      properties:
        value:
          pattern: "^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$"
          type: string
