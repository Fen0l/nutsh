        \ denied or rejected."
      enum:
      - ALLOW
      - DENY
      - REJECT
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        DENY: Deny traffic matching this rule.
        REJECT: Drops the packet and sends an ICMP rejection response.
        $UNKNOWN: |
          Unknown value.
        ALLOW: Allow traffic matching this rule.
        $REDACTED: |
          Redacted value.
