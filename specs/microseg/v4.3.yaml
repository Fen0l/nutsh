        SUBNET: Subnet.
        VM: Virtual machine.
        VPC: Virtual private cloud.
        KUBE_SERVICE: Kubernetes service.
        KUBE_CLUSTER: Kubernetes cluster.
        KUBE_PODS: Kubernetes pods.
        ADDRESS_GROUP: Address group.
        $UNKNOWN: |
          Unknown value.
        $REDACTED: |
          Redacted value.
    microseg.v4.3.config.MatchCriteria:
      type: string
      description: Match criteria for string pattern matching.
      enum:
      - CONTAINS
      - STARTS_WITH
      - ENDS_WITH
      - EQUALS
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        STARTS_WITH: Match entities that start with the specified string pattern.
        EQUALS: Match entities that exactly equal the specified string pattern.
        ENDS_WITH: Match entities that end with the specified string pattern.
        CONTAINS: Match entities that contain the specified string pattern.
        $UNKNOWN: |
          Unknown value.
        $REDACTED: |
          Redacted value.
