          )

          var (
              ApiClientInstance *client.ApiClient
              ClusterApiInstance *api.ClusterApi
          )

          func main() {
              ApiClientInstance = client.NewApiClient()
              // IPv4/IPv6 address or FQDN of the cluster
              ApiClientInstance.Host = "localhost"
              // Port to which to connect to
              ApiClientInstance.Port = 9440
              // Interval in ms to use during retry attempts
              ApiClientInstance.RetryInterval = 5000
              // Max retry attempts while reconnecting on a loss of connection
              ApiClientInstance.MaxRetryAttempts = 5
              // UserName to connect to the cluster
              ApiClientInstance.Username = "username"
              // Password to connect to the cluster
              ApiClientInstance.Password = "password"
              // Please add authorization information here if needed.
              ClusterApiInstance = api.NewClusterApi(ApiClientInstance)

              snmpUser := import1.newSnmpUser()

              // SnmpUser object initializations here...

              clusterExtId := "dF8B66ed-fF1E-DeF4-ccaF-DD6f07f3CBAe"
              userExtId := "EEE44E7A-e1eA-2CDb-E6A9-a7CCf349e5ee"

              getResponse, err := ClusterApiInstance.GetSnmpUser(&clusterExtId, &userExtId)
              if err != nil {
                  fmt.Println(err)
                  return
              }

              // Extract E-Tag Header
              etagValue := ApiClientInstance.GetEtag(getResponse)

              args := make(map[string] interface{})
              args["If-Match"] = etagValue
              response, error := ClusterApiInstance.UpdateSnmpUser(&snmpUser, &clusterExtId, &userExtId, args)
              if error != nil {
                  fmt.Println(error)
                  return
              }
              data, _ := response.Data.MarshalJSON()
              fmt.Println(string(data))
          }

