          oneOf:
          - $ref: '#/components/schemas/clustermgmt.v4.r0.b2.config.SearchResponse'
          - $ref: '#/components/schemas/clustermgmt.v4.r0.b2.error.ErrorResponse'
      additionalProperties: false
