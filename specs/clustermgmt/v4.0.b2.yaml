                  data:
                    $ref: '#/components/schemas/clustermgmt.v4.r0.b2.error.ErrorResponse'
                additionalProperties: false
                description: "REST response for all response codes in API path /clustermgmt/v4.0.b2/config/clusters/{extId}\
                  \ Get operation"
