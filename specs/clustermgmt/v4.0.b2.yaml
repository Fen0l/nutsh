        metadata:
          $ref: '#/components/schemas/common.v1.r0.b1.response.ApiResponseMetadata'
        data:
          oneOf:
          - type: array
            items:
              $ref: '#/components/schemas/clustermgmt.v4.r0.b2.config.Host'
          - $ref: '#/components/schemas/clustermgmt.v4.r0.b2.error.ErrorResponse'
      additionalProperties: false
      description: REST response for all response codes in API path /clustermgmt/v4.0.b2/config/hosts
        Get operation
    clustermgmt.v4.r0.b2.config.ListHostNicsByHostIdApiResponse:
