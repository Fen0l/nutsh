      properties:
        searchType:
          $ref: '#/components/schemas/clustermgmt.v4.r0.b2.config.SearchType'
      additionalProperties: false
      description: Search parameters.
    clustermgmt.v4.r0.b2.config.FetchTaskApiResponse:
