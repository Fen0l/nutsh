          format: int32
        managementServer:
          $ref: '#/components/schemas/clustermgmt.v4.r0.a1.config.ManagementServerRef'
      additionalProperties: false
      description: Network details of a cluster
    clustermgmt.v4.r0.a1.config.NodeListItemReference:
      type: object
      properties:
        controllerVmIp:
          type: string
          description: Controller VM IP
