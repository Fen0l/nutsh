components:
  schemas:
    clustermgmt.v4.r0.a1.config.GetClusterResponse:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/common.v1.r0.a3.response.ApiResponseMetadata'
        data:
          oneOf:
          - $ref: '#/components/schemas/clustermgmt.v4.r0.a1.config.ClusterEntity'
          - $ref: '#/components/schemas/clustermgmt.v4.r0.a1.error.ErrorResponse'
      additionalProperties: false
      description: REST response for all response codes in api path /clustermgmt/v4.0.a1/config/cluster/{clusterExtId}
        Get operation
    clustermgmt.v4.r0.a1.config.ClusterEntity:
      allOf:
      - $ref: '#/components/schemas/common.v1.r0.a3.response.ExternalizableAbstractModel'
      - type: object
        properties:
          name:
            type: string
            description: Cluster name
          nodes:
            $ref: '#/components/schemas/clustermgmt.v4.r0.a1.config.NodeReference'
          config:
            $ref: '#/components/schemas/clustermgmt.v4.r0.a1.config.ClusterConfigReference'
          network:
            $ref: '#/components/schemas/clustermgmt.v4.r0.a1.config.ClusterNetworkReference'
        additionalProperties: false
        description: Cluster entity with its attributes
    clustermgmt.v4.r0.a1.config.NodeReference:
      type: object
      properties:
        numberOfNodes:
          type: integer
          description: Number of nodes in a cluster
          format: int32
        nodeList:
          type: array
          description: List of nodes in a cluster
          items:
            $ref: '#/components/schemas/clustermgmt.v4.r0.a1.config.NodeListItemReference'
      additionalProperties: false
      description: Node reference for a cluster
    clustermgmt.v4.r0.a1.config.ClusterConfigReference:
      type: object
      properties:
        incarnationId:
          type: integer
          description: Cluster incarnation Id
          format: int64
        buildInfo:
          $ref: '#/components/schemas/clustermgmt.v4.r0.a1.config.BuildReference'
        hypervisorTypes:
          type: array
          description: Hypervisor type
          items:
            $ref: '#/components/schemas/clustermgmt.v4.r0.a1.config.HypervisorType'
        clusterFunction:
          type: array
          description: Cluster function
          items:
            $ref: '#/components/schemas/clustermgmt.v4.r0.a1.config.ClusterFunctionRef'
        timezone:
          type: string
          description: Time zone on a cluster
        authorizedPublicKeyList:
          type: array
          description: Public ssh key details
          items:
            $ref: '#/components/schemas/clustermgmt.v4.r0.a1.config.PublicKey'
        redundancyFactor:
          type: integer
          description: Redundancy factor of a cluster
          format: int64
        clusterSoftwareMap:
          type: array
          description: Cluster software version details
          items:
            $ref: '#/components/schemas/clustermgmt.v4.r0.a1.config.SoftwareMapReference'
        clusterArch:
          $ref: '#/components/schemas/clustermgmt.v4.r0.a1.config.ClusterArchReference'
        faultToleranceState:
          $ref: '#/components/schemas/clustermgmt.v4.r0.a1.config.FaultToleranceState'
        remoteSupport:
          type: boolean
          description: Remote support status
        operationMode:
          $ref: '#/components/schemas/clustermgmt.v4.r0.a1.config.OperationMode'
        isLts:
          type: boolean
          description: Indicates whether the release is categorized as Long-term or
            not
        passwordRemoteLoginEnabled:
          type: boolean
          description: Password ssh into cluster is enabled or not
      additionalProperties: false
      description: Cluster configuration details
    clustermgmt.v4.r0.a1.config.ClusterNetworkReference:
      type: object
      properties:
        externalAddress:
          $ref: '#/components/schemas/clustermgmt.v4.r0.a1.config.IpAddresses'
        externalDataServiceIp:
          type: string
          description: Cluster external data service IP
        externalSubnet:
          type: string
          description: Cluster external subnet address
        internalSubnet:
          type: string
          description: Cluster internal subnet address
        nfsSubnetWhitelist:
          type: array
          description: NFS subnet whitelist addresses
          items:
            type: string
        nameServerIpList:
          type: array
          description: Name servers on a cluster
          items:
            type: string
        ntpServerIpList:
          type: array
          description: NTP servers on a cluster
          items:
            type: string
        smtpServer:
          $ref: '#/components/schemas/clustermgmt.v4.r0.a1.config.SmtpServerRef'
