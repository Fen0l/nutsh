          protocol:
            $ref: '#/components/schemas/clustermgmt.v4.r0.b1.config.SnmpProtocol'
          port:
            type: integer
            description: SNMP port
            format: int32
          inform:
            type: boolean
            description: SNMP information status
          engineId:
            pattern: "^(?:0[xX])?[0-9a-fA-F]+$"
            type: string
            description: SNMP engine Id
          version:
            $ref: '#/components/schemas/clustermgmt.v4.r0.b1.config.SnmpTrapVersion'
          recieverName:
            type: string
            description: SNMP receiver name
          communityString:
            type: string
            description: Community string(plaintext) for SNMP version 2.0
        additionalProperties: false
        description: SNMP trap details
