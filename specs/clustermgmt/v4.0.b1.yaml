      allOf:
      - $ref: '#/components/schemas/common.v1.r0.a3.response.ExternalizableAbstractModel'
      - required:
        - authKey
        - authType
        - username
        type: object
        properties:
          username:
            type: string
            description: SNMP user name
          authType:
            $ref: '#/components/schemas/clustermgmt.v4.r0.b1.config.SnmpAuthType'
          authKey:
            pattern: "^[^']+$"
            type: string
            description: SNMP user authentication key
          privType:
            $ref: '#/components/schemas/clustermgmt.v4.r0.b1.config.SnmpPrivType'
          privKey:
            pattern: "^[^']+$"
