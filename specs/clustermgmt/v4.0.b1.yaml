            $ref: '#/components/schemas/clustermgmt.v4.r0.b1.config.HypervisorType'
        clusterFunction:
          maxItems: 7
          minItems: 0
          type: array
          description: "Cluster function. This is part of payload for cluster create\
            \ operation only (allowed enum values for creation are AOS, ONE_NODE &\
            \ TWO_NODE only)."
          items:
            $ref: '#/components/schemas/clustermgmt.v4.r0.b1.config.ClusterFunctionRef'
        timezone:
          type: string
          description: Time zone on a cluster
          readOnly: true
        authorizedPublicKeyList:
          maxItems: 1024
          minItems: 0
