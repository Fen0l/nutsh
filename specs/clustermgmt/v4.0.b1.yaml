          items:
            $ref: '#/components/schemas/clustermgmt.v4.r0.b1.config.EncryptionOptionInfo'
        encryptionScope:
          maxItems: 2
          minItems: 0
          type: array
          description: Encryption scope
          readOnly: true
          items:
            $ref: '#/components/schemas/clustermgmt.v4.r0.b1.config.EncryptionScopeInfo'
      additionalProperties: false
      description: Cluster configuration details
    clustermgmt.v4.r0.b1.config.ClusterNetworkReference:
      type: object
      properties:
        externalAddress:
          $ref: '#/components/schemas/common.v1.r0.a3.config.IPAddress'
        externalDataServiceIp:
          $ref: '#/components/schemas/common.v1.r0.a3.config.IPAddress'
        externalSubnet:
          type: string
          description: Cluster external subnet address
          readOnly: true
        internalSubnet:
          type: string
          description: Cluster internal subnet address
          readOnly: true
        nfsSubnetWhitelist:
          maxItems: 1024
          minItems: 0
          type: array
          description: NFS subnet whitelist addresses. This is part of payload for
            cluster update operation only.
          items:
            type: string
        nameServerIpList:
          maxItems: 1024
          minItems: 0
          type: array
          description: "List of name servers on a cluster. This is part of payload\
            \ for both cluster create & update operations. For create operation, only\
            \ ipv4 address / fqdn values are supported currently."
          items:
            $ref: '#/components/schemas/common.v1.r0.a3.config.IPAddressOrFQDN'
        ntpServerIpList:
          maxItems: 1024
          minItems: 0
          type: array
          description: "List of NTP servers on a cluster. This is part of payload\
            \ for both cluster create & update operations. For create operation, only\
            \ ipv4 address / fqdn values are supported currently."
          items:
            $ref: '#/components/schemas/common.v1.r0.a3.config.IPAddressOrFQDN'
        smtpServer:
          $ref: '#/components/schemas/clustermgmt.v4.r0.b1.config.SmtpServerRef'
        masqueradingIp:
          $ref: '#/components/schemas/common.v1.r0.a3.config.IPAddress'
        masqueradingPort:
          type: integer
          description: The port to connect to the cluster when using masquerading
            IP
          format: int32
          readOnly: true
        managementServer:
          $ref: '#/components/schemas/clustermgmt.v4.r0.b1.config.ManagementServerRef'
        fqdn:
          pattern: "^(?:[a-z0-9][\\w\\-]*[a-z0-9]*\\.)*(?:(?:(?:[a-z0-9][\\w\\-]*[a-z0-9]*)(?:\\\
            .[a-z0-9]+)?))$"
          type: string
          description: Cluster fully qualified domain name. This is part of payload
            for cluster update operation only.
        keyManagementServerType:
          $ref: '#/components/schemas/clustermgmt.v4.r0.b1.config.KeyManagementServerType'
        backplane:
          $ref: '#/components/schemas/clustermgmt.v4.r0.b1.config.BackplaneNetworkParams'
      additionalProperties: false
      description: Network details of a cluster
