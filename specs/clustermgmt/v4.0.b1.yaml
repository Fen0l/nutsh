              let rsyslogServer = new RsyslogServer();

              // RsyslogServer object initializations here...
              rsyslogServer.setIpAddress(new IPAddress());  // required field
              rsyslogServer.setNetworkProtocol(new RsyslogNetworkProtocol());  // required field
              rsyslogServer.setPort(1);  // required field
