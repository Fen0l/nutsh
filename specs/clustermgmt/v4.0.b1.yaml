      enum:
      - $UNKNOWN
      - $REDACTED
      - PENDING
      - DOWNLOADING
      - QUEUED
      - PREUPGRADE
      - UPGRADING
      - SUCCEEDED
      - FAILED
      - CANCELLED
      - SCHEDULED
      x-enumDescriptions:
        CANCELLED: Cancel upgrade status
        FAILED: Failed upgrade status
        QUEUED: Queued upgrade status
        SUCCEEDED: success upgrade status
        DOWNLOADING: Download upgrade status
        PENDING: Pending upgrade status
        UPGRADING: Upgrading upgrade status
        PREUPGRADE: Preupgrrade upgrade status
        SCHEDULED: Scheduled upgrade status
    clustermgmt.v4.r0.b1.config.NodeListItemReference:
