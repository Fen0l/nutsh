          items:
            $ref: '#/components/schemas/clustermgmt.v4.r0.b1.config.SnmpUser'
        transports:
          maxItems: 1024
          minItems: 0
          type: array
          description: SNMP transport details
          items:
            $ref: '#/components/schemas/clustermgmt.v4.r0.b1.config.SnmpTransport'
        traps:
          maxItems: 1024
          minItems: 0
          type: array
