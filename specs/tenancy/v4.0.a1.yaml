          package main

          import (
              "fmt"
              "time"
              "context"
              "github.com/nutanix/ntnx-api-golang-clients/tenancy-go-client/v4/api"
              "github.com/nutanix/ntnx-api-golang-clients/tenancy-go-client/v4/client"
              "github.com/nutanix/ntnx-api-golang-clients/tenancy-go-client/v4/models/tenancy/v4/request/membership"
              import1 "github.com/nutanix/ntnx-api-golang-clients/tenancy-go-client/v4/models/tenancy/v4/config"
          )

          var (
              ApiClientInstance *client.ApiClient
              MembershipServiceApiInstance *api.MembershipServiceApi
          )

          func main() {
              ApiClientInstance = client.NewApiClient()
              // IPv4/IPv6 address or FQDN of the cluster
              ApiClientInstance.Host = "localhost"
              // Port used for the connection. PC products typically use port 9440, while NC products typically use port 443. See the product-specific documentation for accurate configuration.
              ApiClientInstance.Port = 9440
              // Interval in ms to use during retry attempts
              ApiClientInstance.RetryInterval = 5 * time.Second
              // Max retry attempts while reconnecting on a loss of connection
              ApiClientInstance.MaxRetryAttempts = 5
              // UserName to connect to the cluster
              ApiClientInstance.Username = "username"
              // Password to connect to the cluster
              ApiClientInstance.Password = "password"
              // Please add authorization information here if needed.
              MembershipServiceApiInstance = api.NewMembershipServiceApi(ApiClientInstance)
              ctx := context.Background()

              membership := import1.NewMembership()

              // Membership object initializations here...



              request := membership.CreateDomainMembershipRequest{ Body: membership }
              response, error := MembershipServiceApiInstance.CreateDomainMembership(ctx, &request)
              if error != nil {
                  fmt.Println(error)
                  return
              }
              data, _ := response.GetData().(import1.Membership)
