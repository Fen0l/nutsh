    \ (NCP) deployed in on-prem data centers ,Nutanix Cloud Clusters (NC2) or edge\
    \ sites."
  version: 4.2.1
  x-logo:
    altText: Multi Domain Management Logo
    url: https://developers.nutanix.com/api/v1/namespaces/multidomain/images/multidomain-logo-img.svg
  x-repo-name: multidomain
  x-minimum-negotiation-version: v4.2
servers:
- url: "https://{pc-ip}:9440/api"
security:
