tags:
- name: ExternalRepositories
  description: |
    A repository of data that is external to AOS, accessible over a specified protocol (eg: NFSv3) -  typically identified by the IP at which the storage is available on the network and optionally a relative path from the root of the storage system.
  x-displayName: External Repositories
