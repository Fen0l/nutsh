        buildInfo:
          description: Build information details.
          $ref: '#/components/schemas/clustermgmt.v4.3.config.BuildReference'
          readOnly: true
        hypervisorTypes:
          maxItems: 5
          minItems: 0
          type: array
          description: Hypervisor type.
