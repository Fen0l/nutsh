        nodeList:
          maxItems: 1024
          minItems: 0
          type: array
          description: List of nodes in a cluster.
          items:
            $ref: '#/components/schemas/clustermgmt.v4.3.config.NodeListItemReference'
      additionalProperties: false
      description: Node reference for a cluster.
    clustermgmt.v4.3.config.ClusterConfigReference:
      type: object
      properties:
        incarnationId:
          type: integer
          description: Cluster incarnation Id. This is part of payload for cluster
