    post:
      tags:
      - ContentRepositories
      summary: Create a Content Repository
      description: |
        Create a Content Repository to manage content, such as disk images, in the form of Repository items.
        Name is a mandatory field to create a Content Repository.
      operationId: createContentRepository
      parameters:
      - name: NTNX-Request-Id
        in: header
        description: |
          A unique identifier that is associated with each request. The provided value must be opaque and preferably in Universal Unique Identifier (UUID) format. This identifier is also used as an idempotence token for safely retrying requests in case of network errors. All the supported Nutanix API clients add this auto-generated request identifier to each request.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uuid
          example: 988f87c0-2df9-4b93-ad7e-2619c770fd3b
