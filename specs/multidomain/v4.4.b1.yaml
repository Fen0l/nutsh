            example: test_cluster_name
          nodes:
            description: Node reference for a cluster.
            $ref: '#/components/schemas/clustermgmt.v4.3.config.NodeReference'
          config:
            description: Cluster configuration details.
            $ref: '#/components/schemas/clustermgmt.v4.3.config.ClusterConfigReference'
          network:
            description: Network details of a cluster.
            $ref: '#/components/schemas/clustermgmt.v4.3.config.ClusterNetworkReference'
          upgradeStatus:
            description: Upgrade status of a cluster.
            $ref: '#/components/schemas/clustermgmt.v4.3.config.UpgradeStatus'
            readOnly: true
          vmCount:
            type: integer
            description: Number of VMs.
            format: int64
            readOnly: true
            example: 27
          inefficientVmCount:
            type: integer
            description: Number of inefficient VMs.
            format: int64
            readOnly: true
            example: 63
          containerName:
            maxLength: 64
            type: string
            description: The name of the default container created as part of cluster
