          format: int32
          default: 0
      - name: $limit
        in: query
        description: |
          A URL query parameter that specifies the total number of records returned in the result set.  Must be a positive integer between 1 and 100. Any number out of this range will lead to a validation error. If the limit is not provided, a default value of 50 records will be returned in the result set. If both $limit and $apply query parameters are present, $limit  will be applied on entities within the groups. Default value of limit with $apply will be 5.
