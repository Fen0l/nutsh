            type: string
            description: The network external identifier to which Domain Manager (Prism
              Central) is to be deployed or is already configured.
            example: 9aaaa3ca-345b-4ac3-ab6c-ede826d5b987
        additionalProperties: false
    prism.v4.4.config.NetworkCapability:
      type: string
      description: "This property represents network capability of a domain manager\
        \ which consists of - Ipv4 only, dual stack and ipv6 only networks."
      enum:
      - IPV4
      - DUAL_STACK
      - IPV6
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        DUAL_STACK: The Domain manager (Prism Central) has both IPv4 and IPv6 network
          configured.
        IPV6: The Domain manager (Prism Central) has only IPv6 network configured.
        IPV4: The Domain manager (Prism Central) has only IPv4 network configured.
        $UNKNOWN: |
          Unknown value.
        $REDACTED: |
          Redacted value.
    prism.v4.4.management.ClusterType:
      type: string
      description: |
        Type of cluster to be connected:
        - DOMAIN_MANAGER : Domain manager (Prism Central) instance
        - AOS : Prism Element cluster instance
        - WITNESS_SERVICE: Witness Service instance
      enum:
      - DOMAIN_MANAGER
      - AOS
      - WITNESS_SERVICE
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        AOS: AOS (Prism Element) cluster instanc.
        DOMAIN_MANAGER: Domain manager (Prism Central) instance.
        $UNKNOWN: |
          Unknown value.
        $REDACTED: |
          Redacted value.
        WITNESS_SERVICE: "Witness Service instance. Witness Service serves as an arbitrator\
          \ and resides in a separate fault domain. Witness Service provides automatic\
          \ failure handling through a leadership election to ensure business continuity\
          \ when there is a site, service, or network failure between participants."
    clustermgmt.v4.3.config.Cluster:
