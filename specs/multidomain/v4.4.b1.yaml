      type: string
      description: Various states of a Content Repository.
      enum:
      - SUBSCRIBING
      - SUBSCRIBED
      - READY
      - STALE
      - DELETING
      - CONFLICTED
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        READY: The Content Repository has refreshed the items list from the source.
        STALE: |
          The Content Repository might have stale metadata.
          Perform a sync to transition to READY state.
        SUBSCRIBING: The Content Repository is subscribing to the remote source.
        DELETING: The Content Repository is being unsubscribed from the source for
          deletion.
        CONFLICTED: The Content Repository is in a conflicted state.
        $UNKNOWN: |
          Unknown value.
        $REDACTED: |
          Redacted value.
        SUBSCRIBED: The Content Repository has successfully subscribed to a remote
          source.
