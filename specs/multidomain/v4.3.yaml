openapi: 3.0.1
info:
  title: Nutanix Multidomain Versioned APIs
  description: "Manage all Nutanix services running on the Nutanix Cloud Platform\
    \ (NCP) deployed in on-prem data centers ,Nutanix Cloud Clusters (NC2) or edge\
    \ sites."
  version: 1.0.0
  x-logo:
    altText: Multi Domain Management Logo
    url: https://developers.nutanix.com/api/v1/namespaces/multidomain/images/multidomain-logo-img.svg
  x-repo-name: multidomain
  x-minimum-negotiation-version: v4.2
servers:
- url: "https://{host}:{port}/api"
security:
- basicAuthScheme: []
- apiKeyAuthScheme: []
tags:
- name: ExternalRepositories
  description: |
    A repository of data that is external to AOS, accessible over a specified protocol (for example, NFSv3) - typically identified by the IP address at which the storage is available on the network and optionally a relative path from the root of the storage system.
  x-displayName: External Repositories
- name: RegisteredDomains
  description: |
    The registered domain APIs allow users to configure and manage registered domains. Users can create, list, fetch, update, and delete these domains.
  x-displayName: Registered Domains
- name: Locations
  description: |
    The locations represent geographical position. Entities that need to be bound to geographical position can refer to this.
  x-displayName: Locations
- name: LocalDomain
  description: |
    The local domain APIs allow users to fetch and perform operations on the local domain. Users can execute fetch, register, and deregister operations within the local domain.
  x-displayName: Local Domain
