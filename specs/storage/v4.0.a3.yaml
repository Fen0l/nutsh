          - $ref: '#/components/schemas/storage.v4.r0.a3.error.ErrorResponse'
      additionalProperties: false
      description: "REST response for all response codes in api path /storage/v4.0.a3/config/iscsi-clients/{clientId}\
        \ Patch operation"
    storage.v4.r0.a3.config.AuthenticationType:
      title: Supported types of authentication
      type: string
      description: "The authentication type enabled for the Volume Group. If this\
        \ is set to CHAP, the target/client secret must be provided."
      enum:
      - CHAP
      - NONE
      - $UNKNOWN
      - $REDACTED
    storage.v4.r0.a3.config.TargetParam:
      title: Parameters associated with each iSCSI target corresponding to the iSSCI
