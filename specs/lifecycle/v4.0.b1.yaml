      x-enumDescriptions:
        POWER_OFF_UVMS: Power off user virtual machines.
    lifecycle.v4.r0.b1.common.HypervisorType:
      type: string
      description: Type of Hypervisor present in the cluster.
      enum:
      - $UNKNOWN
      - $REDACTED
      - ESX
      - AHV
      - HYPERV
      x-enumDescriptions:
        HYPERV: Hyper-V Hypervisor.
        ESX: ESX Hypervisor.
        AHV: Nutanix AHV Hypervisor.
    lifecycle.v4.r0.b1.common.UpgradeSpec:
      title: Upgrade specification for an entity/entities.
      description: Specification for an upgrade operation of an entity to a particular
        target version.
      allOf:
      - $ref: '#/components/schemas/lifecycle.v4.r0.b1.common.PrechecksSpec'
      - type: object
        properties:
          autoHandleFlags:
            maxItems: 20
            minItems: 0
            type: array
            description: "List of automated system operations to perform, to avoid\
              \ precheck failure and let the system restore state after an update\
              \ is complete. The allowed flag is: - 'powerOffUvms': This allows the\
              \ system to automatically power off user VMs which cannot be migrated\
              \ to other hosts and power them on when the update is done. This option\
              \ can avoid pinned VM precheck failure on the host which needs to enter\
              \ maintenance mode during the update and allow the update to go through."
            items:
              $ref: '#/components/schemas/lifecycle.v4.r0.b1.common.SystemAutoMgmtFlag'
          maxWaitTimeInSecs:
            maximum: 86400
            minimum: 60
            type: integer
            description: Number of seconds LCM waits for the VMs to come up after
              exiting host maintenance mode.
            format: int32
        additionalProperties: false
