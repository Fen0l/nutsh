                  print(api_response)
              except ntnx_lifecycle_py_client.rest.ApiException as e:
                  print(e)
      - lang: Go
        source: |2+

          package main

          import (
              "fmt"
              "github.com/nutanix/ntnx-api-golang-clients/lifecycle-go-client/v4/api"
              "github.com/nutanix/ntnx-api-golang-clients/lifecycle-go-client/v4/client"
              import1 "github.com/nutanix/ntnx-api-golang-clients/lifecycle-go-client/v4/models/lifecycle/v4/resources"
          )

          var (
              ApiClientInstance *client.ApiClient
              RecommendationsApiInstance *api.RecommendationsApi
          )

          func main() {
              ApiClientInstance = client.NewApiClient()
              // IPv4/IPv6 address or FQDN of the cluster
              ApiClientInstance.Host = "localhost"
              // Port to which to connect to
              ApiClientInstance.Port = 9440
              // Interval in ms to use during retry attempts
              ApiClientInstance.RetryInterval = 5000
              // Max retry attempts while reconnecting on a loss of connection
              ApiClientInstance.MaxRetryAttempts = 5
              // UserName to connect to the cluster
              ApiClientInstance.Username = "username"
              // Password to connect to the cluster
              ApiClientInstance.Password = "password"
              // Please add authorization information here if needed.
              RecommendationsApiInstance = api.NewRecommendationsApi(ApiClientInstance)

              extId := "2ADF9AcC-7FfF-6cf8-C353-da7FbbeBbEF3"


              response, error := RecommendationsApiInstance.GetRecommendationById(&extId)
              if error != nil {
                  fmt.Println(error)
                  return
              }
              data, _ := response.GetData().(import1.RecommendationResult)
              fmt.Println(data)
          }

