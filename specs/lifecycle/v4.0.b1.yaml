              client = ntnx_lifecycle_py_client.ApiClient(configuration=config)
              recommendations_api = ntnx_lifecycle_py_client.RecommendationsApi(api_client=client)
              ext_id = "b2dBEAB9-1B3d-A8B1-e1Bb-9ebC4DBecF4B"

              try:
