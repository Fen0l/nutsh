  /lifecycle/v4.1/resources/bundles:
    get:
      tags:
      - Bundles
      summary: Get LCM bundles on the cluster
      description: Query list of bundles
      operationId: listBundles
      parameters:
      - name: $page
        in: query
        description: |
          A URL query parameter that specifies the page number of the result set. It must be a positive integer between 0 and the maximum number of pages that are available for that resource. Any number out of this range might lead to no results.
        required: false
        style: form
        explode: false
        schema:
          minimum: 0
          type: integer
          description: |
            A URL query parameter that specifies the page number of the result set. It must be a positive integer between 0 and the maximum number of pages that are available for that resource. Any number out of this range might lead to no results.
          format: int32
          default: 0
      - name: $limit
        in: query
        description: |
          A URL query parameter that specifies the total number of records returned in the result set.  Must be a positive integer between 1 and 100. Any number out of this range will lead to a validation error. If the limit is not provided, a default value of 50 records will be returned in the result set.
        required: false
        style: form
        explode: false
        schema:
          maximum: 100
          minimum: 1
          type: integer
          description: |
            A URL query parameter that specifies the total number of records returned in the result set.  Must be a positive integer between 1 and 100. Any number out of this range will lead to a validation error. If the limit is not provided, a default value of 50 records will be returned in the result set.
          format: int32
          default: 50
      - name: $filter
        in: query
        description: |-
          A URL query parameter that allows clients to filter a collection of resources. The expression specified with $filter is evaluated for each resource in the collection, and only items where the expression evaluates to true are included in the response. Expression specified with the $filter must conform to the [OData V4.01](https://docs.oasis-open.org/odata/odata/v4.01/odata-v4.01-part1-protocol.html) URL conventions.
          For example, filter '$filter=name eq 'karbon-ntnx-1.0' would filter the result on cluster name 'karbon-ntnx1.0', filter '$filter=startswith(name, 'C')' would filter on cluster name starting with 'C'.
        required: false
        style: form
        explode: true
        schema:
          type: string
          example: string
        x-odata-fields:
        - name: clusterExtId
          example: "https://{pc-ip}:9440/api/lifecycle/v4.1/resources/bundles?$filter=clusterExtId\
            \ eq '569844e6-dda5-4e13-9218-c21554a93efd'"
        - name: type
          example: "https://{pc-ip}:9440/api/lifecycle/v4.1/resources/bundles?$filter=type\
            \ eq Lifecycle.Resources.BundleType'SOFTWARE'"
      - name: $orderby
        in: query
