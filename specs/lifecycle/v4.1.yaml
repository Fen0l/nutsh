openapi: 3.0.1
info:
  title: Nutanix Lifecycle Management APIs
  description: "Manage Infrastructure, Software and Firmware Upgrades."
  version: 4.1.1
  x-logo:
    altText: Lifecycle Logo
    url: https://developers.nutanix.com/api/v1/namespaces/lifecycle/images/lifecycle-logo-img.svg
  x-repo-name: lifecycle
servers:
- url: "https://{pc-ip}:9440/api"
security:
- basicAuthScheme: []
- apiKeyAuthScheme: []
tags:
- name: Config
  description: |
    Represents the Configuration of LCM. Configuration includes the settings or configurations that can or are applied to LCM.
- name: Entities
  description: |
    Represents the upgradable entities in LCM. Entities are the firmware or software components that can be upgraded via LCM.
- name: Notifications
  description: |
    Represents the Notifications in LCM. Notifications are structures that capture information about any actions that are needed to be taken by user before initiating an upgrade.
- name: Recommendations
  description: |
    Represents the Recommendations for upgrades that user intends to perform. Recommendations are the suggested upgrades for given entities based on the current state of the entities.
- name: Upgrades
  description: |
    Represents the Upgrade of an entity. Upgrade is the process of upgrading one or more entities to a newer version.
- name: Prechecks
  description: |
    Represents the Prechecks for upgrades that user intends to perform. Prechecks are the checks that are performed before initiating an upgrade to ensure that the upgrade can be performed without any issues.
- name: Inventory
  description: |
    Represents the Inventory details. Inventory is the process of collecting the details of all the Entities.
- name: Images
  description: |
    Represents the Images that are used to upgrade the entities via LCM.
- name: Status
  description: |
    Represents the Status of LCM. Status represents details about a pending or ongoing action in LCM.
- name: LcmSummaries
  description: Represents the Summaries of LCMs of PC environment including underlying
    PEs.
  x-displayName: Lcm Summaries
