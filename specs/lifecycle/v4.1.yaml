  /lifecycle/v4.1/operations/$actions/compute-notifications:
    post:
      tags:
      - Notifications
      summary: Compute LCM upgrade plan and notifications for a set of entities.
      description: "Compute LCM upgrade notifications for given set of entities to\
        \ update along with a target version. The notifications are computed based\
        \ on the current state of the entities and the target version. Once the task\
        \ is successfully completed, the resource identifier for the computation result\
        \ is stored in the completion_details field of the task. The result can then\
        \ be retrieved using the resource id via the GET notifications/ endpoint."
      operationId: ComputeNotifications
      parameters:
      - name: NTNX-Request-Id
        in: header
        description: |
          A unique identifier that is associated with each request. The provided value must be opaque and preferably in Universal Unique Identifier (UUID) format. This identifier is also used as an idempotence token for safely retrying requests in case of network errors. All the supported Nutanix API clients add this auto-generated request identifier to each request.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uuid
          example: c4ae173a-28c7-4908-9bdc-527ebbe47432
      - name: X-Cluster-Id
