    lifecycle.v4.2.common.OperationType:
      title: LCM operation type.
      type: string
      description: Type of the operation tracked by the task.
      enum:
      - INVENTORY
      - PRECHECKS
      - UPGRADE
      - NONE
      - UPLOAD
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        PRECHECKS: Perform LCM prechecks for the intended update operation.
        INVENTORY: Perform an LCM inventory operation.
        UPLOAD: Indicates that LCM is running Direct Upload operation.
        UPGRADE: Perform upgrade operation to a specific target version for discovered
          LCM entity/entities.
        NONE: Indicates that no operation is currently ongoing.
        $UNKNOWN: |
          Unknown value.
        $REDACTED: |
          Redacted value.
    lifecycle.v4.2.common.OperationStatus:
      title: Operation status.
      type: string
      description: Current status of the operation.
      enum:
      - SUCCEEDED
      - FAILED
      - RUNNING
      - SUSPENDED
      - CANCELED
      - CANCELING
      - QUEUED
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        FAILED: Indicates that the operation has failed.
        RUNNING: Indicates that the operation is currently running.
        QUEUED: Indicates that the operation is currently queued.
        SUSPENDED: Indicates that the operation is currently suspended.
        SUCCEEDED: Indicates that the operation has succeeded.
        CANCELED: Indicates that the operation has been canceled.
        CANCELING: Indicates that the operation is currently being canceled.
        $UNKNOWN: |
          Unknown value.
        $REDACTED: |
          Redacted value.
