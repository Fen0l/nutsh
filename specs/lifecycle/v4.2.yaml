      description: "Compute LCM upgrade notifications for given set of entities to\
        \ update along with a target version. The notifications are computed based\
        \ on the current state of the entities and the target version. Once the task\
        \ is successfully completed, the resource identifier for the computation result\
        \ is stored in the completion_details field of the task. The result can then\
        \ be retrieved using the resource id via the GET notifications/ endpoint."
