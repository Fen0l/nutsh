        - url
        type: object
        properties:
          url:
            pattern: "^((http[s]?|nfs):\\/)?\\/?([^:\\/\\s]*)((\\/\\w+)*(:[0-9]+)*?\\\
              /)([\\w\\-\\.]+[^#?\\s]+)(.*)?(#[\\w\\-]+)?$"
            type: string
            description: Intersight connection url
            example: string
          deploymentType:
            $ref: '#/components/schemas/security.v4.1.config.IntersightConnectionType'
          type:
            type: string
            description: Pre-defined type of credential.
            readOnly: true
            example: string
        additionalProperties: false
        description: Intersight connection used for authentication.
