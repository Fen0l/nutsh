    lifecycle.v4.2.resources.ConnectivityType:
      title: "LCM framework's mode of operation on the cluster. LCM operates in three\
        \ modes, connected-site & darksite web server & darksite direct upload."
      type: string
      description: This field indicates whether LCM framework on the cluster is running
        in connected-site mode or darksite mode.
      enum:
      - CONNECTED_SITE
      - DARKSITE_WEB_SERVER
      - DARKSITE_DIRECT_UPLOAD
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        CONNECTED_SITE: "In connected-site, LCM on the cluster has internet connectivity\
          \ to reach configured portal for downloading LCM modules/bundles etc."
        DARKSITE_DIRECT_UPLOAD: LCM on the cluster does not have external connectivity
          and will have a facility to upload darksite bundles through LCM.
        DARKSITE_WEB_SERVER: LCM on the cluster does not have external connectivity
          and will have a connection to darksite webserver maintained by the customer.
        $UNKNOWN: |
          Unknown value.
        $REDACTED: |
          Redacted value.
