    lifecycle.v4.2.resources.Config:
      title: LCM configuration.
      description: LCM configuration on the cluster.
      allOf:
      - $ref: '#/components/schemas/common.v1.0.response.ExternalizableAbstractModel'
      - type: object
        properties:
          url:
            pattern: "^((http[s]?|nfs):\\/)?\\/?([^:\\/\\s]*)((\\/\\w+)*(:[0-9]+)*?\\\
              /)([\\w\\-\\.]+[^#?\\s]+)(.*)?(#[\\w\\-]+)?$"
            type: string
            description: URL of the LCM repository.
            example: string
          isAutoInventoryEnabled:
            type: boolean
            description: Indicates if the auto inventory operation is enabled. The
              default value is set to False.
            default: false
          autoInventorySchedule:
            pattern: "^([01]\\d|2[0-3]):([0-5]\\d)$"
            type: string
            description: The scheduled time in "%H:%M" 24-hour format of the next
              inventory execution. Used when auto_inventory_enabled is set to True.
              The default schedule time is 03:00(AM).
            example: 13:45
          version:
            maxLength: 128
            minLength: 1
            type: string
            description: LCM version installed on the cluster.
            readOnly: true
            example: 3.1.45678
          displayVersion:
            maxLength: 128
            minLength: 1
            type: string
            description: User friendly display version of LCM installed on the cluster.
            readOnly: true
            example: "3.1"
          connectivityType:
            $ref: '#/components/schemas/lifecycle.v4.2.resources.ConnectivityType'
          isHttpsEnabled:
            type: boolean
            description: Indicates if the LCM URL has HTTPS enabled. The default value
              is True.
            default: false
          supportedSoftwareEntities:
            maxItems: 100
            minItems: 0
            type: array
            description: List of entities for which One-Click upgrades are supported.
            readOnly: true
            items:
              type: string
              example: string
          deprecatedSoftwareEntities:
            maxItems: 100
            minItems: 0
            type: array
            description: List of entities for which One-Click upgrades are not available.
            readOnly: true
            items:
              type: string
              example: string
          isFrameworkBundleUploaded:
            type: boolean
            description: Indicates if the bundle is uploaded or not.
            readOnly: true
            default: false
          hasModuleAutoUpgradeEnabled:
            type: boolean
            description: Indicates if LCM is enabled to auto-upgrade products. The
              default value is False.
            default: false
        additionalProperties: false
    lifecycle.v4.2.resources.UpdateConfigApiResponse:
