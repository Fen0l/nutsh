          - $ref: '#/components/schemas/lifecycle.v4.2.error.ErrorResponse'
      additionalProperties: false
      description: REST response for all response codes in API path /lifecycle/v4.2/operations/$actions/prechecks
        Post operation
    lifecycle.v4.2.common.ManagementServer:
      title: Cluster management server configuration.
      required:
      - hypervisorType
      - ip
      - password
      - username
      type: object
      properties:
        hypervisorType:
          $ref: '#/components/schemas/lifecycle.v4.2.common.HypervisorType'
        ip:
          pattern: "^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$"
          type: string
          description: IP address of the management server.
          example: 142.137.167.21
        username:
          maxLength: 128
          minLength: 1
          type: string
          description: Username to login to the management server.
          example: admin
        password:
          maxLength: 128
          minLength: 1
          type: string
          description: Password to login to the management server.
          example: '*******'
      additionalProperties: false
      description: Cluster management server configuration used while updating clusters
        with ESX or Hyper-V.
    lifecycle.v4.2.common.SystemAutoMgmtFlag:
      type: string
      description: System auto-management flag to handle system operation during upgrade.
      enum:
      - POWER_OFF_UVMS
      - MIGRATE_POWERED_OFF_UVMS
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        POWER_OFF_UVMS: Power off user virtual machines.
        MIGRATE_POWERED_OFF_UVMS: Migrate Powered off user virtual machines to other
          hosts in the cluster while entering maintenance mode during upgrade.
        $UNKNOWN: |
          Unknown value.
        $REDACTED: |
          Redacted value.
    lifecycle.v4.2.common.HypervisorType:
      type: string
      description: Type of Hypervisor present in the cluster.
      enum:
      - ESX
      - AHV
      - HYPERV
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        HYPERV: Hyper-V Hypervisor.
        ESX: ESX Hypervisor.
        $UNKNOWN: |
          Unknown value.
        $REDACTED: |
          Redacted value.
        AHV: Nutanix AHV Hypervisor.
    lifecycle.v4.2.common.PreloadSpec:
