        - NTNX
        - AZURE
        - AWS
        - GCP
        - VSPHERE
      enum:
      - NTNX
      - AZURE
      - AWS
      - GCP
      - VSPHERE
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        VSPHERE: Vsphere cloud provider.
        AZURE: Azure cloud provider.
        NTNX: Nutanix cloud provider.
        GCP: GCP cloud provider.
        $UNKNOWN: |
          Unknown value.
        AWS: AWS cloud provider.
        $REDACTED: |
          Redacted value.
    prism.v4.0.config.ProvisioningType:
      type: string
      description: |
        Enums denoting the instance type of the cloud PC. It indicates whether the PC is created on bare-metal
        or on a cloud-provisioned VM. Hence, it supports two possible values:
        - NTNX
        - NATIVE
      enum:
      - NTNX
      - NATIVE
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        NATIVE: Native instance.
        NTNX: Nutanix instance.
        $UNKNOWN: |
          Unknown value.
        $REDACTED: |
          Redacted value.
