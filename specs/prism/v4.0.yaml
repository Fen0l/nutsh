        - ONPREM
        - NTNX_CLOUD
      enum:
      - ONPREM
      - NTNX_CLOUD
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        NTNX_CLOUD: Nutanix cloud environment.
        ONPREM: On-prem environment.
        $UNKNOWN: |
          Unknown value.
        $REDACTED: |
          Redacted value.
    prism.v4.0.config.ProviderType:
      type: string
      description: |
        Enums denoting the provider of the cloud, in case of environment type a cloud PC.<br>
