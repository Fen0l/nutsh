      summary: |
        Create a category
      description: |
        ___Create a category taking the input from the request body___

        At the minimum, the `key` and the `value` fields must be provided in the payload.
        The `description` field can also be provided.
        Creation of a category succeeds only if there is no other category in the system with the same key-value combination.

        A sample request body:
        ```
        {
          "key":"pet",
          "value": "cat",
          "description": "This is a sample category"
        }
        ```

        __Other fields__
        * All other fields, if specified in the payload, are ignored.
        * The field `extId` is autogenerated as a random (type 4) UUID. It does not  depend on the contents of any other fields.
        * Re-creation of a category with the same key-value combination after deleting the existing one, will generate a different extId to the previous category.
        * The field `ownerUuid` is set as the UUID of the currently logged in user.
        * The field `type` is set to be 'USER'
