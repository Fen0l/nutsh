            description: Possible resolutions to troubleshoot this alert.
          detail:
            type: string
            description: Additional details to troubleshoot this alert.
        additionalProperties: false
    prism.v4.r0.a2.common.ComparisonOperator:
      type: string
      description: The comparison operator used for the condition evaluation.
      enum:
      - $UNKNOWN
      - $REDACTED
      - EQUAL_TO
      - GREATER_THAN
      - GREATER_THAN_OR_EQUAL_TO
      - LESS_THAN
      - LESS_THAN_OR_EQUAL_TO
      x-enumDescriptions:
        GREATER_THAN: "Indicates a > operator used in conjunction with a metric in\
          \ a condition. Depending on the trigger condition set, an alert may be generated\
          \ when the metric value equals the static threshold set."
        LESS_THAN_OR_EQUAL_TO: "Indicates a <= operator used in conjunction with a\
          \ metric in a condition. Depending on the trigger condition set, an alert\
          \ may be generated when the metric value is less than or equal to the static\
          \ threshold set."
        EQUAL_TO: "Indicates an = operator used in conjunction with a metric in a\
          \ condition. Depending on the trigger condition set, an alert may be generated\
          \ when the metric value equals the static threshold set."
        GREATER_THAN_OR_EQUAL_TO: "Indicates a >= operator used in conjunction with\
          \ a metric in a condition. Depending on the trigger condition set, an alert\
          \ may be generated when the metric value is greater than or equal to the\
          \ static threshold set."
        LESS_THAN: "Indicates a < operator used in conjunction with a metric in a\
          \ condition. Depending on the trigger condition set, an alert may be generated\
          \ when the metric value is less than the static threshold set."
    prism.v4.r0.a2.common.ConditionType:
      type: string
      description: "Indicating if this symptom is caused by static threshold or anomaly\
        \ (dynamic threshold) evaluation.  If an indicator is raised, there may have\
        \ another indicator indicating the safeguard zone value."
      enum:
      - $UNKNOWN
      - $REDACTED
      - STATIC_THRESHOLD
      x-enumDescriptions:
        STATIC_THRESHOLD: Indicates that the condition for when the policy should
          generate an alert is based on a static threshold value.
    prism.v4.r0.a2.common.DataType:
      type: string
      description: Data type of the metric value as stored in database.
      enum:
      - $UNKNOWN
      - $REDACTED
      - STRING
      - BOOLEAN
      - DOUBLE
      - LONG
      x-enumDescriptions:
        STRING: Indicates that the value of the metric is a string.
        DOUBLE: Indicates that the value of the metric is a decimal.
        BOOLEAN: Indicates that the value of the metric is a boolean.
        LONG: Indicates that the value of the metric is a whole number.
