              // Please add authorization information here if needed.
              CategoriesApiInstance = api.NewCategoriesApi(ApiClientInstance)

              category := import1.NewCategory()

              // Category object initializations here...

              extId := "09AEAf4f-CccB-8b94-ef58-cA3Edcd1cbb2"

              getResponse, err := CategoriesApiInstance.GetCategoryByExtId(&extId, &$expand)
              if err != nil {
                  fmt.Println(err)
                  return
              }

              // Extract E-Tag Header
              etagValue := ApiClientInstance.GetEtag(getResponse)

              args := make(map[string] interface{})
              args["If-Match"] = etagValue
              response, error := CategoriesApiInstance.UpdateCategory(&extId, category, args)
              if error != nil {
                  fmt.Println(error)
                  return
              }
              data, _ := response.GetData().(import1.Category)
              fmt.Println(data)
          }

