            type: string
            description: The time in ISO 8601 format when the audit was created.
            format: date-time
        additionalProperties: false
    prism.v4.r0.a2.common.OperationType:
      type: string
      description: "The operation type associated with the audit. For example, CREATE,\
        \ UPDATE, DELETE and so on."
      enum:
      - $UNKNOWN
      - $REDACTED
      - CREATE
      - UPDATE
      - DELETE
      - POWERSTATECHANGE
      - HA
      - RESTORE
      - MIGRATE
      - ENABLE
      - DISABLE
      - RESET
      - LOGIN
      - LOGOUT
      - VALIDATE
      - FAILOVER
      - INPROGRESS
      - "ON"
      - "OFF"
      - JOINED
      - UNJOINED
      - PROTECTED
      - UNPROTECTED
      - QUARENTINED
      - UNQUARENTINED
      - START
      - END
      - TESTFAILOVER
      - IMPORT
      - EXPORT
      - IMAGEIMPORT
      - IMAGETRANSFER
      - IMAGEREMOVE
      - IMAGEUPLOAD
      - TEMPLATEGUESTUPDATEINITIATE
      - TEMPLATEGUESTUPDATECANCEL
      - TEMPLATEGUESTUPDATECOMPLETE
      - TEMPLATEDEPLOY
      - TEMPLATEVERSIONPUBLISH
      - CROSSCLUSTERMIGRATE
      - FLOWCLUSTERMIGRATE
      x-enumDescriptions:
        CREATE: Indicates an entity was created.
        IMAGEIMPORT: Indicates a CRUD operation on images.
        EXPORT: "Indicates an export of a policy, configuration, or any other entity."
        RESET: Indicates a reset operation on a configuration or entity.
        JOINED: "Indicates that an entity - a cluster, for example - has joined a\
          \ domain."
        IMAGETRANSFER: Indicates an image was transferred to an entity.
        UNJOINED: "Indicates that an entity - a cluster, for example - has unjoined\
          \ from a domain."
        "true": Indicates that an entity was powered on.
        IMPORT: "Indicates an import of a policy, configuration, or any other entity."
        DELETE: Indicates an entity was deleted.
        "false": Indicates that an entity was powered off.
        INPROGRESS: Indicates that a task is in progress.
        RESTORE: Indicates an entity/configuration was restored.
        UPDATE: Indicates an entity was updated.
        LOGIN: Indicates a user/service account logged in to the system.
        TESTFAILOVER: Indicates an operation related to test failover.
        PROTECTED: Indicates that an entity is protected/being protected in a Protection
          Domain.
        TEMPLATEGUESTUPDATECANCEL: Indicates that guest changes were cancelled for
          a VM template.
        FAILOVER: Indicates an operation related to HA failover.
        DISABLE: Indicates a feature/functionality was disabled.
        LOGOUT: Indicates a user/service account logged out of the system.
        TEMPLATEGUESTUPDATEINITIATE: Indicates that guest changes were initiated for
          a VM template.
        UNQUARENTINED: Indicates that an entity is unquarantined.
        MIGRATE: "Indicates an entity, like VM, was migrated from one host to another."
        ENABLE: Indicates a feature/functionality was enabled.
        IMAGEREMOVE: Indicates an image was removed from an entity.
        QUARENTINED: Indicates that an entity is quarantined.
        TEMPLATEDEPLOY: Indicates that a VM template was deployed.
        TEMPLATEVERSIONPUBLISH: Indicates that a version was published for a VM template.
        UNPROTECTED: Indicates that an entity is now unprotected.
        HA: Indicates an operation related to HA (High Availability).
        VALIDATE: Indicates a validation operation on a user request or entity/system
          state.
        START: Indicates an operation has started.
        END: Indicates an operation ended.
        IMAGEUPLOAD: Indicates an image was uploaded to an entity.
        TEMPLATEGUESTUPDATECOMPLETE: Indicates that guest changes were completed for
          a VM template.
