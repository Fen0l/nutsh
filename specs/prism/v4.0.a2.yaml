                type: object
                properties:
                  metadata:
                    $ref: '#/components/schemas/common.v1.r0.a3.response.ApiResponseMetadata'
                  data:
                    $ref: '#/components/schemas/prism.v4.r0.a2.config.Category'
                additionalProperties: false
                description: "REST response for all response codes in API path /prism/v4.0.a2/config/categories/{extId}\
