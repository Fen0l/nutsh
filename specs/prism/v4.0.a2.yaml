          description: "Unit of the metric. For example, percentage, ms, usecs and\
            \ so on."
        triggerWaitTime:
          type: integer
          description: How long the metric breached the given condition before raising
            an event.
          format: int64
        triggerTime:
          type: string
          description: The time in ISO 8601 format when the event was triggered.
          format: date-time
        comparisonOperator:
          $ref: '#/components/schemas/prism.v4.r0.a2.common.ComparisonOperator'
        conditionType:
          $ref: '#/components/schemas/prism.v4.r0.a2.common.ConditionType'
        metricCategory:
          type: string
          description: "Broad category under which this metric falls. For example,\
            \ Disk, CPU, Memory and so on."
        dataType:
          $ref: '#/components/schemas/prism.v4.r0.a2.common.DataType'
        thresholdValue:
          type: object
          description: The threshold value that was used for the condition evaluation.
          oneOf:
          - $ref: '#/components/schemas/prism.v4.r0.a2.common.StringValue'
          - $ref: '#/components/schemas/prism.v4.r0.a2.common.BoolValue'
          - $ref: '#/components/schemas/prism.v4.r0.a2.common.DoubleValue'
          - $ref: '#/components/schemas/prism.v4.r0.a2.common.IntValue'
        metricValue:
          type: object
          description: Raw value of the metric when the condition threshold was exceeded.
          oneOf:
          - $ref: '#/components/schemas/prism.v4.r0.a2.common.StringValue'
          - $ref: '#/components/schemas/prism.v4.r0.a2.common.BoolValue'
          - $ref: '#/components/schemas/prism.v4.r0.a2.common.DoubleValue'
          - $ref: '#/components/schemas/prism.v4.r0.a2.common.IntValue'
      additionalProperties: false
    prism.v4.r0.a2.common.ImpactType:
      type: string
      description: "The impact this alert/event will have on the system. For example,\
        \ availability, performance, capacity and so on."
      enum:
      - $UNKNOWN
      - $REDACTED
      - AVAILABILITY
      - CAPACITY
      - CONFIGURATION
      - PERFORMANCE
      - SYSTEM_INDICATOR
      - CPU_CAPACITY
      - MEMORY_CAPACITY
      - STORAGE_CAPACITY
      x-enumDescriptions:
        CAPACITY: Indicates there might be storage or memory issues in the system.
        SYSTEM_INDICATOR: Indicates that certain operations in the system might fail
          or might be interrupted.
        MEMORY_CAPACITY: Indicates that there might be memory issues in the system.
        AVAILABILITY: "Impacts availability of certain services, data, or functionality\
          \ in the system."
        PERFORMANCE: Indicates that there might be performance issues in the system.
        CONFIGURATION: Indicates that there might be connectivity issues between different
          entities due to incorrect configurations.
        CPU_CAPACITY: Indicates that there might be issues with CPU capacity.
        STORAGE_CAPACITY: Indicates that there might be storage issues in the system.
    prism.v4.r0.a2.common.Severity:
      type: string
      description: Severity of an alert
      enum:
      - $UNKNOWN
      - $REDACTED
      - INFO
      - WARNING
      - CRITICAL
      x-enumDescriptions:
        INFO: Indicates that the severity of the alert is informational. This means
          that an actionable minor problem has been detected. It should be resolved
          relatively soon and not ignored.
        WARNING: "Indicates that the severity of the alert is warning. This means\
          \ that an actionable issue has been detected, and user intervention is required.\
          \ A more serious issue may develop if this is not resolved soon."
        CRITICAL: "Indicates that the severity of the alert is critical. This means\
          \ that an actionable critical situation has been detected, and action is\
          \ required immediately. The cluster may have the potential to stop running,\
          \ or it could run into irreparable issues."
    prism.v4.r0.a2.common.Parameter:
      type: object
      properties:
        paramName:
          type: string
          description: Name or key of additional parameter for an instance.
        paramValue:
          type: object
          description: Value of additional parameter for an instance.
          oneOf:
          - $ref: '#/components/schemas/prism.v4.r0.a2.common.StringValue'
          - $ref: '#/components/schemas/prism.v4.r0.a2.common.BoolValue'
          - $ref: '#/components/schemas/prism.v4.r0.a2.common.IntValue'
      additionalProperties: false
    prism.v4.r0.a2.serviceability.RootCauseAnalysis:
      allOf:
