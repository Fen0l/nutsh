openapi: 3.0.1
info:
  title: Nutanix Prism APIs
  description: "Manage Tasks, Category Associations and Submit Batch Operations."
  version: 4.1.1
  x-repo-name: prism
  x-logo:
    altText: Prism Logo
    url: https://developers.nutanix.com/api/v1/namespaces/prism/images/prism-logo-img.svg
servers:
- url: "https://{pc-ip}:9440/api"
security:
- basicAuthScheme: []
- apiKeyAuthScheme: []
tags:
- name: DomainManager
  description: |
    The domain manager represents the multi-cluster manager, responsible for managing  (registering/viewing) multiple Nutanix clusters to provide a single, centralized management  interface. It has support for backup and restore of domain manager on clusters as well as  s3-compatible object stores. It also exposes the ability manage the lifecycle of multiple  opt-in products such as Intelligent Ops, Leap, and Flow networking, and so on.
  x-displayName: Domain Manager(Prism Central)
- name: DomainManager
  description: |
    The domain manager represents the multi-cluster manager, responsible for managing  (registering/viewing) multiple Nutanix clusters and providing a single, centralized management  interface. It supports backup and restoration of the domain manager on clusters as well as  s3-compatible object stores. Additionally, it allows users to view the current state of multiple  opt-in products such as Disaster Recovery, Intelligent Operations, Flow and more. It also manages the lifecycle of products like Disaster Recovery.
  x-displayName: Domain Manager(Prism Central)
- name: Categories
  description: "Categories are key-value pair constructs used to tag entities and\
    \ policies.\nKeys are used to group functionally similar categories.\nPolicy engines\
    \ use categories to get all entities tagged to a category and apply policies on\
    \ them.\nSome examples are marking VMs for restoration and backup, protecting\
    \ \nvolume groups based on categories, narrowing or denying authorization to a\
    \ user,\nto entities marked by a category, logically grouping entities in the\
    \ UI for convenience, and so on.\n"
- name: Batches
  description: Provides an ability to submit batches of operations that can be performed
    asynchronously.  Status of submitted batches can be checked by querying the task
    returned as a result of the submission. Additionally history of all submitted
    batches in the past 90 days can be listed through a list operation. A Limit of
    500 elements is enforced during submission of the batch.
- name: Tasks
  description: "Tasks are primarily a way of asynchronously executing operations.\
    \ Tasks persistently record the intent,  progress, and other relevant information\
    \ about the long-running operations. Users can interact with  tasks in the system\
    \ using these APIs."
paths:
  /prism/v4.1/operations/$actions/batch:
    post:
      tags:
      - Batches
      summary: Submit a batch operation.
      description: Submit a homogenous batch operation.
      operationId: submitBatch
      parameters:
      - name: NTNX-Request-Id
        in: header
        description: |
          A unique identifier that is associated with each request. The provided value must be opaque and preferably in Universal Unique Identifier (UUID) format. This identifier is also used as an idempotence token for safely retrying requests in case of network errors. All the supported Nutanix API clients add this auto-generated request identifier to each request.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uuid
          example: ec341f98-3fcc-4157-a1ed-da19eceacc64
      requestBody:
        description: The request payload for the batch operation.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/prism.v4.1.operations.BatchSpec'
        required: true
      responses:
        "202":
          description: The batch request has been accepted by the server for processing.
            Please check the task reference in the response on how to query for status
            of the batch operation.
          headers:
            Location:
              style: simple
              explode: false
              schema:
                pattern: "^((http[s]?):\\/)?\\/?([^:\\/\\s]+)((\\/\\w+)*(:[0-9]+)*?\\\
                  /)([\\w\\-\\.]+[^#?\\s]+)(.*)?(#[\\w\\-]+)?$"
                type: string
                description: Indicates the target of a redirection or the URL of a
                  newly created resource.
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    $ref: '#/components/schemas/common.v1.0.response.ApiResponseMetadata'
                  data:
                    $ref: '#/components/schemas/prism.v4.1.config.TaskReference'
                additionalProperties: false
                description: REST response for all response codes in API path /prism/v4.1/operations/$actions/batch
                  Post operation
        "4XX":
          description: Client error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    $ref: '#/components/schemas/common.v1.0.response.ApiResponseMetadata'
                  data:
                    $ref: '#/components/schemas/prism.v4.1.error.ErrorResponse'
                additionalProperties: false
                description: REST response for all response codes in API path /prism/v4.1/operations/$actions/batch
                  Post operation
        "5XX":
          description: Server error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    $ref: '#/components/schemas/common.v1.0.response.ApiResponseMetadata'
                  data:
                    $ref: '#/components/schemas/prism.v4.1.error.ErrorResponse'
                additionalProperties: false
                description: REST response for all response codes in API path /prism/v4.1/operations/$actions/batch
                  Post operation
      x-permissions:
        deploymentList:
        - ON_PREM
        operationName: Submit Batch
        roleList:
        - name: Internal Super Admin
        - name: Prism Admin
        - name: Super Admin
      x-rate-limit:
      - type: small
        count: 6
        timeUnit: minutes
