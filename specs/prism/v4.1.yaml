            pattern: "^(?=.{1,260}$)[a-zA-Z]+([a-zA-Z0-9_.-]+)*(\\/([a-zA-Z]+([a-zA-Z0-9_.-]+)*))*$"
            type: string
            description: |
              The fully qualified name of this category. It is unique for each category.<br>
              It is a read-only field.
