    prism.v4.1.config.ResourceType:
      type: string
      description: |
        An enum denoting the associated resource types.<br>
        Resource types are further grouped into two types: entity or policy.
      enum:
      - VM
      - MH_VM
      - IMAGE
      - SUBNET
      - CLUSTER
      - HOST
      - REPORT
      - MARKETPLACE_ITEM
      - BLUEPRINT
      - APP
      - VOLUMEGROUP
      - IMAGE_PLACEMENT_POLICY
      - NETWORK_SECURITY_POLICY
      - NETWORK_SECURITY_RULE
      - VM_HOST_AFFINITY_POLICY
      - VM_VM_ANTI_AFFINITY_POLICY
      - TEMPLATE_PLACEMENT_POLICY
      - QOS_POLICY
      - NGT_POLICY
      - PROTECTION_RULE
      - ACCESS_CONTROL_POLICY
      - STORAGE_POLICY
      - IMAGE_RATE_LIMIT
      - RECOVERY_PLAN
      - BUNDLE
      - POLICY_SCHEMA
      - HOST_NIC
      - ACTION_RULE
      - VIRTUAL_NIC
      - VM_TEMPLATE
      - NETWORK_ENTITY_GROUP
      - VIRTUAL_NETWORK
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        APP: A resource of type application.
        PROTECTION_RULE: A policy or rule of type protection rule.
        IMAGE_RATE_LIMIT: A resource of type rate limit.
        MH_VM: A resource of type Virtual Machine.
        BLUEPRINT: A resource of type blueprint.
        HOST: "A resource representing the underlying host, the machine hosting the\
          \ hypervisors and VMs."
        IMAGE: A resource of type image.
        VM_VM_ANTI_AFFINITY_POLICY: A policy of type VM-VM anti-affinity; This policy
          decides that the specified set of VMs are running on different hosts.
        ACCESS_CONTROL_POLICY: A policy or rule of type access control policy or ACP;
          the rules that decide authorization of users to access an API.
        VM_HOST_AFFINITY_POLICY: A policy of type VM host affinity; The policy decides
          the affinity between a set of VMs to be run only a specified set of hosts
        NGT_POLICY: A policy or rule of type NGT policy.
        RECOVERY_PLAN: A policy or rule of type recovery plan.
        MARKETPLACE_ITEM: A resource of type marketplace item.
        CLUSTER: "A resource of type cluster, usually refers to a PE cluster."
        NETWORK_SECURITY_RULE: A rule of type network security.
        HOST_NIC: A resource of type Physical NIC.
        ACTION_RULE: A policy of type Playbook.
        VIRTUAL_NIC: A resource of type Virtual NIC
        VIRTUAL_NETWORK: A resource of type Atlas Virtual Network.
        TEMPLATE_PLACEMENT_POLICY: A policy of type Template Placement Policy.
        VOLUMEGROUP: A resource of type volume group.
        NETWORK_ENTITY_GROUP: A resource of type Network Entity Group.
        REPORT: A resource of type report.
        STORAGE_POLICY: A policy or rule of type storage policy.
        $REDACTED: |
          Redacted value.
        BUNDLE: A resource of type bundle.
        QOS_POLICY: A policy or rule of type QoS policy.
        SUBNET: A resource of type network subnets.
        VM_TEMPLATE: A resource of type VM Template.
        VM: A resource of type Virtual Machine.
        $UNKNOWN: |
          Unknown value.
        NETWORK_SECURITY_POLICY: A policy of type network security.
        POLICY_SCHEMA: Policies like user-defined-alerts.
        IMAGE_PLACEMENT_POLICY: A policy of type image placement.
    prism.v4.1.config.ResourceGroup:
      type: string
      description: |
        An enum denoting the resource group.<br>
        Resources can be organised into either an entity or a policy. Hence, it supports two possible values:
          * ENTITY
          * POLICY
      enum:
      - ENTITY
      - POLICY
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        POLICY: |
          A ResourceGroup denoting a nutanix policy like VM host affinity policy, image placement policy, access control policy, and so on.<br>
          A category is generally associated with many entities.<br>
          The policy which is associated with this category, is then applied to those entities which are also associated with the same category.
        ENTITY: |
          A ResourceGroup denoting a nutanix entity like VM, cluster, host, image, and so on.<br>
          A category is generally associated with many entities.<br>
          A policy is then applied to these entities through the category.
        $UNKNOWN: |
          Unknown value.
        $REDACTED: |
          Redacted value.
