      required:
      - location
      description: |
        The backup target for the domain manager, which can be either a cluster or an object store.
      allOf:
      - $ref: '#/components/schemas/common.v1.0.response.ExternalizableAbstractModel'
      - type: object
        properties:
          location:
            required:
            - $objectType
            type: object
            properties:
              $objectType:
                type: string
                example: prism.v4.management.ClusterLocation
            description: |
              The location of the backup target. For example, a cluster or an object store endpoint such as AWS s3.
            oneOf:
            - $ref: '#/components/schemas/prism.v4.1.management.ClusterLocation'
            - $ref: '#/components/schemas/prism.v4.1.management.ObjectStoreLocation'
          lastSyncTime:
            type: string
            description: |
              The time when the domain manager last synchronised or copied its configuration data to the backup target. This field refreshes every 30 minutes.
            format: date-time
            readOnly: true
            example: 2009-09-23T14:30:00-07:00
          isBackupPaused:
            type: boolean
            description: |
              Whether or not the backup is paused on the specified cluster.
            readOnly: true
            example: true
          backupPauseReason:
            type: string
            description: |
              Specifies a reason why the backup might have paused. This is empty if the isBackupPaused field is false.
            readOnly: true
            example: The backup is paused due to an upgrade in progress. It will be
              automatically resumed when the upgrade is complete.
