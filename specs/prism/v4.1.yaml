        Post operation
    prism.v4.1.config.CategoryType:
      type: string
      description: |
        Denotes the type of a category.<br>
        There are three types of categories: SYSTEM, INTERNAL, and USER.<br>
        This field is immutable.
      enum:
      - USER
      - SYSTEM
      - INTERNAL
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        SYSTEM: |
          Predefined categories contained in the system to be used by workflows visible in the UI that involve categories.
          System-defined categories can't be created through the Categories API.
          They are predefined in a configuration file and are created at PC bootup time.
          System-defined categories can't be updated or deleted.
        INTERNAL: |
          Predefined categories contained in the system to be used by internal services, APIs and workflows that involve categories.
          These categories will not be visible in the UI.
          However, these categories will be returned in the response of `listCategories` and `getCategoryById` APIs, and
          are available for filtering as well.
          Internal categories can't be created through the Categories API.
          They are predefined in a configuration file and are created at PC bootup time.
          Internal categories can't be updated or deleted.
        USER: |
          These categories get created by users through the invocation of `createCategory` API.
          User-defined categories can be updated or deleted after creation.
        $UNKNOWN: |
          Unknown value.
        $REDACTED: |
          Redacted value.
    prism.v4.1.config.AssociationSummary:
      type: object
      properties:
        categoryId:
          type: string
          description: |
            External identifier for the given category that is used across all v4 apis/entities/resources where categories are referenced.<br>
            The field is in UUID format.<br>
            A type 4 UUID is generated during category creation.
          example: 0a817535-bca1-4e50-9395-f1970ebaa2db
        resourceType:
          $ref: '#/components/schemas/prism.v4.1.config.ResourceType'
        resourceGroup:
          $ref: '#/components/schemas/prism.v4.1.config.ResourceGroup'
        count:
          type: integer
          description: |
            Count of associations of a particular type of entity or policy
          example: 90
      additionalProperties: false
      description: |
        This attribute contains a list of entities and policies that have been assigned the given category.<br>
        These entities are grouped by entity types (like VM or HOST) or policy types (like PROTECTION_POLICY or NGT_POLICY).<br>
        Each associated object contains the total entities belonging to the given entity type, count, category extId, and
        references (for example, for VM it will be VM UUID).
    prism.v4.1.config.AssociationDetail:
      allOf:
