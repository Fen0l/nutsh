      description: "Creates a restore source pointing to a cluster or object store\
        \ to restore the domain manager. The created \nrestore source is intended\
        \ to be deleted after use. If the restore source is\nnot deleted using the\
        \ deleteRestoreSource API, then it is auto-deleted after sometime. Also note\
        \ that a restore \nsource will not contain a backup policy. It is only used\
        \ to access the backup data at the location from where \nthe Prism Central\
        \ may be restored. Credentials used to access the restore source are not validated\
        \ at the time \nof creation of the restore source. They are validated when\
        \ the restore source is used to fetch data.\n"
