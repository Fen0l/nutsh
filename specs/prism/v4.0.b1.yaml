openapi: 3.0.1
info:
  title: Nutanix Prism Versioned APIs
  description: "Manage Tasks, Category Associations and Submit Batch Operations."
  version: 4.0.1-beta-1
  x-logo:
    altText: Prism Logo
    url: https://developers.nutanix.com/api/v1/namespaces/prism/images/prism-logo-img.svg
  x-repo-name: prism
servers:
- url: "https://{pc-ip}:9440/api"
security:
- basicAuthScheme: []
tags:
- name: Tasks
  description: "Tasks are primarily a way of asynchronous execution of operations.\
    \ Tasks record the intention, progress, and other relevant information about the\
    \ long-running operations in a persistent manner. Users can interact with the\
    \ tasks on the system using these APIs."
- name: Categories
  description: |
    Categories are key-value pair constructs used to tag entities and policies.
    Keys are used to group functionally similar categories.
    Policy engines use categories to get all entities tagged to the a category, and apply policies on them.
    Some examples are: mark vms for restoration and backup, protect volume groups based on categories,
    allow or deny authorization to a user, to entities marked by a category,
    logically group entities in the UI for convenience, etc.
- name: Batches
  description: Provides an ability to submit batches of operations that can be performed
    asynchronously.  Status of submitted batches can be checked by querying the task
    returned as a result of the submission. Additionally history of all submitted
    batches in the past 90 days can be listed through a list operation. A Limit of
    500 elements is enforced during submission of the batch.
paths:
  /prism/v4.0.b1/operations/$actions/batch:
    post:
      tags:
      - Batches
      summary: Submit a batch operation.
      description: Submit a homogenous batch operation.
      operationId: submitBatch
      requestBody:
        description: The request payload for the batch operation.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/prism.v4.r0.b1.operations.BatchSpec'
        required: true
      responses:
        "202":
          description: The batch request has been accepted by the server for processing.
            Please check the task reference in the response on how to query for status
            of the batch operation.
          headers:
            Location:
              style: simple
              explode: false
              schema:
                pattern: "^((http[s]?):\\/)?\\/?([^:\\/\\s]+)((\\/\\w+)*(:[0-9]+)*?\\\
                  /)([\\w\\-\\.]+[^#?\\s]+)(.*)?(#[\\w\\-]+)?$"
                type: string
                description: Indicates the target of a redirection or the URL of a
                  newly created resource.
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    $ref: '#/components/schemas/common.v1.r0.b1.response.ApiResponseMetadata'
                  data:
                    $ref: '#/components/schemas/prism.v4.r0.b1.config.TaskReference'
                additionalProperties: false
                description: REST response for all response codes in API path /prism/v4.0.b1/operations/$actions/batch
