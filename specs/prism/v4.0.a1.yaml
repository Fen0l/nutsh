            type: integer
            format: int64
          impactTypes:
            type: array
            items:
              type: string
          lastUpdatedTimestamp:
            type: integer
            format: int64
          sourceEntity:
            $ref: '#/components/schemas/prism.v4.r0.a1.common.AlertEntityReference'
          cluster:
            type: array
            items:
              type: string
        additionalProperties: false
    common.v1.r0.a3.config.IPAddressOrFQDN:
      type: object
      properties:
        ipv4:
          $ref: '#/components/schemas/common.v1.r0.a3.config.IPv4Address'
        ipv6:
          $ref: '#/components/schemas/common.v1.r0.a3.config.IPv6Address'
        fqdn:
          $ref: '#/components/schemas/common.v1.r0.a3.config.FQDN'
      additionalProperties: false
      description: |
        An unique address that identifies a device on the internet or a local network in IPv4/IPv6 format or a Fully Qualified Domain Name.
    common.v1.r0.a3.config.KVStringPair:
      type: object
      properties:
        name:
          type: string
          description: The key of this key-value string pair
        value:
          type: string
          description: The value associated with the key for this key-value string
            pair
          default: ""
      additionalProperties: false
    common.v1.r0.a3.config.IPv4Address:
      type: object
      properties:
        value:
          pattern: ^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$
          type: string
        prefixLength:
          maximum: 32
          minimum: 0
          type: integer
          description: |
            The prefix length of the network to which this host IPv4 address belongs.
          format: int32
          default: 32
      additionalProperties: false
    common.v1.r0.a3.config.IPv6Address:
      type: object
      properties:
        value:
          pattern: ^(?:(?:(?:[A-Fa-f0-9]{1,4}:){6}|(?=(?:[A-Fa-f0-9]{0,4}:){0,6}(?:[0-9]{1,3}\.){3}[0-9]{1,3}$)(([0-9a-fA-F]{1,4}:){0,5}|:)((:[0-9a-fA-F]{1,4}){1,5}:|:)|::(?:[A-Fa-f0-9]{1,4}:){5})(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])|(?:[A-Fa-f0-9]{1,4}:){7}[A-Fa-f0-9]{1,4}|(?=(?:[A-Fa-f0-9]{0,4}:){0,7}[A-Fa-f0-9]{0,4}$)(([0-9a-fA-F]{1,4}:){1,7}|:)((:[0-9a-fA-F]{1,4}){1,7}|:)|(?:[A-Fa-f0-9]{1,4}:){7}:|:(:[A-Fa-f0-9]{1,4}){7})$
          type: string
        prefixLength:
          maximum: 128
          minimum: 0
          type: integer
          description: |
            The prefix length of the network to which this host IPv6 address belongs.
          format: int32
          default: 128
      additionalProperties: false
    common.v1.r0.a3.config.FQDN:
      type: object
      properties:
        value:
          pattern: ^(?:[a-z0-9][\w\-]*[a-z0-9]*\.)*(?:(?:(?:[a-z0-9][\w\-]*[a-z0-9]*)(?:\.[a-z0-9]+)?))$
          type: string
      additionalProperties: false
      description: |
        A fully qualified domain name specifying its exact location in the tree hierarchy of the Domain Name System.
  securitySchemes:
    basicAuthScheme:
      type: http
      scheme: basic
