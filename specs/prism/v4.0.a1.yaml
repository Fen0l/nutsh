            pattern: ^([a-zA-Z0-9_\-\.]+)@([a-zA-Z0-9_\-\.]+)\.([a-zA-Z]{2,5})$
            type: string
            description: The default Nutanix email ID to which alert emails would
              be sent.
          enable:
            type: boolean
            description: Indicates whether alert emails should be enabled or not.
            default: false
          enableDefaultNutanixEmail:
            type: boolean
            description: Indicates whether alert emails should be enabled or not on
              default Nutanix email ID.
            default: false
          enableEmailDigest:
            type: boolean
            description: Indicates whether alert email digest should be enabled or
              not.
            default: false
          skipEmptyAlertEmailDigest:
            type: boolean
            description: Send alert email digest only if there are one or more alerts.
            default: false
          emailConfigRules:
            type: array
            description: Rules for email configuration.
            items:
              $ref: '#/components/schemas/prism.v4.r0.a1.config.EmailConfigurationRule'
          emailContactList:
            type: array
            description: List of email contacts.
            items:
              pattern: ^([a-zA-Z0-9_\-\.]+)@([a-zA-Z0-9_\-\.]+)\.([a-zA-Z]{2,5})$
              type: string
          emailTemplate:
            $ref: '#/components/schemas/prism.v4.r0.a1.config.EmailTemplate'
          tunnelDetails:
            $ref: '#/components/schemas/prism.v4.r0.a1.config.RemoteTunnelDetails'
        additionalProperties: false
