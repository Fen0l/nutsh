          type: array
          description: List of recipients who will receive emails.
          items:
            pattern: ^([a-zA-Z0-9_\-\.]+)@([a-zA-Z0-9_\-\.]+)\.([a-zA-Z]{2,5})$
            type: string
        severities:
          type: array
          items:
            $ref: '#/components/schemas/prism.v4.r0.a1.common.Severity'
