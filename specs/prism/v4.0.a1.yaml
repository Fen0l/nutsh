            description: Enable/Disable flag for the policy.
            default: false
          autoResolve:
            type: boolean
            description: Indicates whether the auto resolve feature is enabled for
              this policy.
            default: true
          filter:
            type: string
            description: Filter expression for the policy in FIQL.
          triggerConditions:
            type: array
            description: Trigger conditions for the policy. If there are multiple
              trigger conditions, all of them will be considered during the operation.
            items:
              $ref: '#/components/schemas/prism.v4.r0.a1.policies.TriggerCondition'
          impactTypes:
            type: array
            description: Impact Types for the associated resulting alert.
            items:
              $ref: '#/components/schemas/prism.v4.r0.a1.common.ImpactType'
          createdBy:
            type: string
            description: Username of the user who created the policy.
          lastUpdatedTimestamp:
            type: integer
            description: Last updated timestamp of the policy. This value will be
              used as the CAS value during updates.
            format: int64
            readOnly: true
          errorOnConflict:
            type: boolean
            description: Error if conflicting alert policies are found.
            default: true
          policiesToOverride:
            type: array
            description: List of IDs of the alert policies that should be overridden.
            items:
              type: string
          triggerWaitPeriod:
            type: integer
            description: Waiting duration in seconds before triggering the alert,
              when the specified condition is met.
            format: int64
          relatedPolicies:
            type: array
            description: List of alert policies that are related to the entities of
              the current policy.
            items:
              $ref: '#/components/schemas/prism.v4.r0.a1.policies.RelatedPolicy'
          entityType:
            type: string
            description: Entity type associated with the user defined alert policy.
              For example, VM, Node, Cluster etc.
          entityIds:
            type: array
            description: Unique identifiers of the entities associated with the user
              defined alert policy.
            items:
              type: string
        additionalProperties: false
