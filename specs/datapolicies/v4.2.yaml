          recoveryTestNetwork:
            $ref: '#/components/schemas/datapolicies.v4.2.config.NetworkConfig'
          isIpMappingEnabled:
            type: boolean
            description: "Indicates whether the static IPs of recovered VMs should\
              \ be mapped according to the target network and configured inside the\
              \ guest VMs. When specified as false, VMs may recover with any IP address\
              \ allocated by the DHCP server corresponding to the target network."
            default: false
        additionalProperties: false
    datapolicies.v4.2.config.CreateNetworkMappingApiResponse:
