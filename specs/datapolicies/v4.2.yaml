        SYSTEM: Storage Policy created by the system.
        USER: Storage Policy created by the user.
        $UNKNOWN: |
          Unknown value.
        $REDACTED: |
          Redacted value.
    datapolicies.v4.2.config.CompressionState:
      type: string
      description: "Enable or disable Compression for entities governed by the policy.\
        \ If the user has no explicit Compression preference, the system chooses an\
        \ appropriate value."
      enum:
      - INLINE
      - POSTPROCESS
      - DISABLED
      - SYSTEM_DERIVED
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        DISABLED: The user wants the data to be not compressed.
        POSTPROCESS: The user wants the data to be compressed later.
        SYSTEM_DERIVED: The user is not interested in Compression. The system decides
          whether to Compress or not Compress the data.
        INLINE: The user wants the data to be compressed inline.
        $UNKNOWN: |
          Unknown value.
        $REDACTED: |
          Redacted value.
    datapolicies.v4.2.config.EncryptionState:
      type: string
      description: "Enable Encryption for entities. Once enabled, it cannot be disabled.\
        \ If the user does not have an explicit preference to enable Encryption, the\
        \ system decides on an appropriate value."
      enum:
      - ENABLED
      - SYSTEM_DERIVED
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        SYSTEM_DERIVED: The user is not interested in Encryption. The system decides
          whether to Encrypt the data or not.
        ENABLED: The user wants the data to be encrypted.
        $UNKNOWN: |
          Unknown value.
        $REDACTED: |
          Redacted value.
    datapolicies.v4.2.config.ReplicationFactor:
      type: string
      description: Number of data copies for entities governed by the Storage Policy.
      enum:
      - TWO
      - THREE
      - SYSTEM_DERIVED
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        SYSTEM_DERIVED: The user has not provided the number of copies to be created
          through the Storage Policy. The system decides how many copies of data to
          create.
        $UNKNOWN: |
          Unknown value.
        TWO: Two data copies for entities governed by the Storage Policy.
        $REDACTED: |
          Redacted value.
        THREE: Three data copies for entities governed by the Storage Policy.
