        - primaryNetwork
        - recoveryNetwork
        type: object
        properties:
          primaryNetwork:
            $ref: '#/components/schemas/datapolicies.v4.2.config.NetworkConfig'
          recoveryNetwork:
            $ref: '#/components/schemas/datapolicies.v4.2.config.NetworkConfig'
          primaryTestNetwork:
