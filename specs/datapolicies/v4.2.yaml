          $ref: '#/components/schemas/common.v1.0.response.ApiResponseMetadata'
        data:
          oneOf:
          - type: array
            items:
              $ref: '#/components/schemas/datapolicies.v4.2.config.ConsistencyRule'
          - $ref: '#/components/schemas/datapolicies.v4.2.error.ErrorResponse'
      additionalProperties: false
      description: "REST response for all response codes in API path /datapolicies/v4.2/config/protection-policies/{protectionPolicyExtId}/consistency-rules\
        \ Get operation"
    datapolicies.v4.2.config.ConsistencyRule:
      title: Consistency rule model
      description: There are many scenarios in which it is essential to capture an
        application's state as an aggregate of the internal states of a group of related
        entities at a specific moment in time. The consistency rule is a collection
        of all the entities whose snapshot represents the application state at that
        point in time.
      allOf:
      - $ref: '#/components/schemas/common.v1.0.response.ExternalizableAbstractModel'
      - required:
        - categoryIds
        - name
        type: object
        properties:
          name:
            maxLength: 256
            minLength: 1
            type: string
            description: Name of the consistency rule.
            example: Consistency_Rule_1
          categoryIds:
            maxItems: 1
            minItems: 1
            type: array
            description: "Specifies the list of external identifiers of categories\
