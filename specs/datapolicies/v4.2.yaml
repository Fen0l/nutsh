      description: "Mapping between data services IP of primary and recovery Prism\
        \ Elements. This mapping will be used to establish the iSCSI connection between\
        \ the recovered VMs with the recovered Volume groups when network segmentation\
        \ has been enabled.<br><br>\nVMs using the `primaryDataServicesIp` as the\
        \ iSCSI target IP on primary will be updated with `recoveryDataServicesIp`\
        \ or `recoveryTestDataServicesIp` on the recovery depending upon whether the\
        \ failover action is `PLANNED_FAILOVER`, `UNPLANNED_FAILOVER` or `TEST_FAILOVER`.<br><br>\n\
        During failback the VMs using the `recoveryDataServicesIp` as the iSCSI target\
        \ IP on recovery will be updated with `primaryDataServicesIp` or `primaryTestDataServicesIp`\
        \ depending upon whether the failover action is `PLANNED_FAILOVER`, `UNPLANNED_FAILOVER`\
        \ or `TEST_FAILOVER`. "
