openapi: 3.0.1
info:
  title: Nutanix Data Policies APIs
  description: Manage Policies for Disaster Recovery and Storage.
  version: 1.0.0
  x-logo:
    altText: Data Policies Logo
    url: https://developers.nutanix.com/api/v1/namespaces/datapolicies/images/datapolicies-logo-img.svg
  x-repo-name: datapolicies
  x-minimum-negotiation-version: v4.2
servers:
- url: "https://{host}:{port}/api"
security:
- basicAuthScheme: []
- apiKeyAuthScheme: []
tags:
- name: ProtectionPolicies
  description: "A protection policy automates the process of creating and replicating\
    \ recovery points.\n  When a protection policy is configured to create local recovery\
    \ points, the request includes:<br>\n    - The recovery point objective<br> \n\
    \    - The retention policy<br>\n    - The entities that need to be protected\
    \ by specifying the categories in which they are tagged.<br>\n  To automate recovery\
    \ point replication, you can also specify the replication location(s).\n\n  In\
    \ many scenarios, capturing the state of an application requires aggregating the\
    \ internal state of related \n  entities at a specific point in time. The consistency\
    \ rule ensures these entities are captured in a synchronized \n  and coordinated\
    \ manner, creating a unified snapshot of the application's state.\n"
  x-displayName: Protection Policies
- name: RecoveryPlans
  description: "A recovery plan orchestrates disaster recovery from the replicated\
    \ recovery points of specified\n entities to the secondary Nutanix clusters registered\
    \ to the same or different Domain manager.<br>\n The recovery plan and its sub\
    \ resources created using these APIs are not accessible using V3 \n endpoints\
    \ and similarly Recovery plan and its sub-resources created using V3 APIs are\
    \ not \n accessible using V4 APIs.\n"
  x-displayName: Recovery Plans
- name: StoragePolicies
  description: |
    Storage Policy helps in ease of storage management at scale. It brings storage configurations such as  Encryption, Data Redundancy, Compression and IOPS Throttling to the application level.
  x-displayName: Storage Policies
- name: EntitySyncPolicies
  description: |
    The entity sync policy helps automate the synchronisation of entities across domain managers to ensure consistent infrastructure configurations.
  x-displayName: Entity Sync Policies
