    datapolicies.v4.2.config.RecoveryStage:
      title: Recovery stage.
      description: Recovery stages defines a group of VMs or a group of Volumes to
        be recovered.
      allOf:
      - $ref: '#/components/schemas/common.v1.0.response.ExternalizableAbstractModel'
      - required:
        - entityType
        type: object
        properties:
          entityType:
            $ref: '#/components/schemas/datapolicies.v4.2.config.RecoverableEntityType'
          entities:
            maxItems: 1000
            minItems: 0
            type: array
            description: "List of external references of entities of type {entityType}\
              \ to be recovered in the Recovery stage."
            items:
