          example: Vlan_1234
        vpc:
          $ref: '#/components/schemas/datapolicies.v4.2.config.EntityReference'
        ipConfig:
          $ref: '#/components/schemas/datapolicies.v4.2.config.IPConfig'
      additionalProperties: false
      description: Network configuration. VPC is required if the subnet is an overlay
        network.
    datapolicies.v4.2.config.IPConfig:
      title: Subnet IP Configuration
      required:
      - ipv4
      type: object
      properties:
        ipv4:
          $ref: '#/components/schemas/datapolicies.v4.2.config.IPv4Config'
      additionalProperties: false
      description: IP configuration of the subnet.
    datapolicies.v4.2.config.IPv4Config:
      title: Subnet IPv4 configuration.
      required:
      - defaultGatewayIp
      - prefixLength
      type: object
      properties:
        defaultGatewayIp:
          pattern: "^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$"
          type: string
          description: Subnet gateway IP address.
          example: 142.137.167.21
        prefixLength:
          maximum: 32
          minimum: 0
          type: integer
          description: Subnet prefix length.
          format: int32
          example: 0
        ipPool:
          $ref: '#/components/schemas/networking.v4.2.config.IPv4Pool'
      additionalProperties: false
      description: "IPv4 configuration of the subnet. Within `ipPool`, the prefix\
        \ length for exact IP addresses must be 32."
    datapolicies.v4.2.config.GetNetworkMappingApiResponse:
