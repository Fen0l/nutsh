            $ref: '#/components/schemas/datapolicies.v4.2.config.ProtectionPolicyEntityType'
        additionalProperties: false
    datapolicies.v4.2.config.ProtectionPolicyEntityType:
      title: Protection policy entity type.
      type: string
      description: A model representing the type of entity (VM or volume group) of
        the protection policy object.
      enum:
      - VM
      - VOLUME_GROUP
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        VOLUME_GROUP: Entity of type volume group that has been protected under a
