          format: uuid
          example: e1d6456d-f4e6-448e-ac61-b1cb95226fc7
      requestBody:
        description: "A protection policy automates the process of creating and replicating\
          \ recovery points. When a protection policy is configured to create local\
          \ recovery points, the request includes:<br> - The recovery point objective<br>\
          \ - The retention policy<br> - The entities that need to be protected by\
          \ specifying the categories in which they are tagged.<br> To automate recovery\
          \ point replication, you can also specify the replication location(s). Only\
          \ users with legacy roles, such as admin, can create a Cross-AZ protection\
