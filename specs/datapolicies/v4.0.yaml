    datapolicies.v4.0.config.AutoRollupRetention:
      title: Auto rollup retention.
      required:
      - local
      type: object
      properties:
        local:
          $ref: '#/components/schemas/datapolicies.v4.0.config.AutoRollupRetentionDetails'
        remote:
          $ref: '#/components/schemas/datapolicies.v4.0.config.AutoRollupRetentionDetails'
      additionalProperties: false
      description: "Maintains a rolling window of recovery points for every schedule,\
        \ starting with the hourly schedule and ending with the schedule created for\
        \ the specified retention period. For example, if the retention period is\
        \ 4 weeks, at any given time, you will have 24 of the latest hourly recovery\
        \ points, 7 of the latest daily recovery points, and 4 of the latest weekly\
        \ recovery points."
