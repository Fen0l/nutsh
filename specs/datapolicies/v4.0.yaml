  x-repo-name: datapolicies
servers:
- url: "https://{pc-ip}:9440/api"
security:
- basicAuthScheme: []
- apiKeyAuthScheme: []
tags:
- name: ProtectionPolicies
  description: "A protection policy automates the process of creating and replicating\
    \ recovery points.\n  When a protection policy is configured to create local recovery\
    \ points, the request includes:<br>\n    - The recovery point objective<br> \n\
    \    - The retention policy<br>\n    - The entities that need to be protected\
    \ by specifying the categories in which they are tagged.<br>\n  To automate recovery\
    \ point replication, you can also specify the replication location(s).\n"
  x-displayName: Protection Policies
