    monitoring.v4.0.serviceability.ClusterConfig:
      description: SDA policy parameters that may differ across clusters since each
        cluster can run on different NCC versions. Each cluster will have an individual
        entry.
      allOf:
      - $ref: '#/components/schemas/common.v1.0.response.ExternalizableAbstractModel'
      - type: object
        properties:
          isEnabled:
            type: boolean
            description: Indicates whether the SDA policy is enabled or not on the
              cluster.
            example: false
          lastModifiedByUser:
            type: string
            description: Name of the user who made the latest update to this policy.
              Its value will be Nutanix if the last update is due to an upgrade event.
            readOnly: true
            example: test_user
          lastModifiedTime:
            type: string
            description: Time in ISO 8601 format when the SDA policy was last modified.
              It gets automatically updated by the Nutanix service from the user context
              during an update event.
            format: date-time
            readOnly: true
            example: 2009-09-23T14:30:00-07:00
          scheduleIntervalSeconds:
            type: integer
            description: Interval in seconds for periodically executing the SDA policy.
              This will not be set for policies with the type NOT_SCHEDULED & EVENT_DRIVEN.
            example: 50
          configurableParameters:
            maxItems: 5
            minItems: 0
            type: array
            description: Parameters of the SDA that are configurable by a user.
            items:
              $ref: '#/components/schemas/monitoring.v4.0.serviceability.AlertPolicyConfigurableParameter'
          alertConfig:
            $ref: '#/components/schemas/monitoring.v4.0.serviceability.AlertConfig'
        additionalProperties: false
