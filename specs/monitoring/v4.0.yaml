    monitoring.v4.0.serviceability.SystemDefinedPolicy:
      description: Attributes of System-Defined Alert Policy across all clusters.
      allOf:
      - $ref: '#/components/schemas/common.v1.0.config.TenantAwareModel'
      - type: object
        properties:
          extId:
            maxLength: 100
            pattern: ^\d+$
            type: string
            description: Unique ID of the System-Defined Alert Policy.
            example: "111053"
          links:
            maxItems: 20
            minItems: 0
            type: array
            description: A HATEOAS style link for the response. Each link contains
              a user-friendly name identifying the link and an address for retrieving
              the particular resource.
            readOnly: true
            items:
              $ref: '#/components/schemas/common.v1.0.response.ApiLink'
          name:
            maxLength: 1000
            type: string
            description: Name of the System-Defined Alert Policy.
            example: AHV Crash File Check
          description:
            maxLength: 400
            type: string
            description: System-defined alert policy description.
            example: Identify recent AHV crash file(s) on host.
          policyId:
            pattern: "^{A}\\d+$"
            type: string
            description: Unique ID associated with the policy.
            example: A111053
          title:
            maxLength: 250
            type: string
            description: Title of a System-Defined Alert Policy.
            example: Recent AHV Crash File Detected
          type:
            $ref: '#/components/schemas/monitoring.v4.0.serviceability.SdaType'
          subType:
            $ref: '#/components/schemas/monitoring.v4.0.serviceability.SdaSubType'
          scope:
            $ref: '#/components/schemas/monitoring.v4.0.serviceability.Scope'
          entityType:
            $ref: '#/components/schemas/monitoring.v4.0.serviceability.EntityType'
          classifications:
            maxItems: 15
            minItems: 0
            type: array
            description: "Various categories into which this alert type can be classified.\
              \ For example, hardware, storage, or license."
            items:
              maxLength: 100
              type: string
              example: Node
          impactTypes:
            maxItems: 8
            minItems: 0
            type: array
            description: Impact types to which this rule applies.
            items:
              $ref: '#/components/schemas/monitoring.v4.0.common.ImpactType'
          kbArticles:
            type: array
            description: List of knowledge base article numbers.
            items:
              pattern: ^http:\/\/portal.nutanix.com\/kb\/\d+$
              maxItems: 10
              minItems: 0
              type: string
              example: http://portal.nutanix.com/kb/4866
          targetClusters:
            maxItems: 2
            minItems: 1
            type: array
            description: Indicates the cluster type against which this policy can
              be executed.
            items:
              $ref: '#/components/schemas/monitoring.v4.0.serviceability.ClusterType'
            default:
            - PE
          publisher:
            minLength: 1
            type: string
            description: "Publisher of the policy. For example, NCC for all health\
              \ check policies."
            default: NCC
          clusterConfigs:
            maxItems: 350
            minItems: 1
            type: array
            description: SDA policy parameters that may differ across clusters since
              each cluster can run on different NCC versions. Each cluster will have
              an individual entry.
            items:
              $ref: '#/components/schemas/monitoring.v4.0.serviceability.ClusterConfig'
        additionalProperties: false
    monitoring.v4.0.serviceability.SdaType:
      type: string
      description: Defines the type of the System-Defined Alert Policy.
      enum:
      - HEALTH_CHECK
      - SERVICE_DEFINED
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        HEALTH_CHECK: Indicates that the policy is defined and executed through NCC
          Health Check framework. These kinds of policies can generally be executed
          on demand to check the current state of the system.
        SERVICE_DEFINED: Indicates that the policy is defined and executed by other
          Nutanix services. These cannot be executed on demand.
        $UNKNOWN: |
          Unknown value.
        $REDACTED: |
          Redacted value.
    monitoring.v4.0.serviceability.SdaSubType:
      type: string
      description: Specifies the sub-type for a SDA. It is only applicable to policies
        with type as HEALTH_CHECK.
      enum:
      - SCHEDULED
      - NOT_SCHEDULED
      - EVENT_DRIVEN
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        EVENT_DRIVEN: Indicates that the policy will only be executed on the occurrence
          of an event. This policy cannot be executed on demand.
        NOT_SCHEDULED: Indicates that the policy is not scheduled to run at a certain
          periodic frequency. These policies will only be executed on demand either
          individually or as a part of executing all checks through run_all.
        $UNKNOWN: |
          Unknown value.
        SCHEDULED: Indicates that the policy is scheduled to run at a certain periodic
          frequency. The frequency is defined through scheduleIntervalInSecs parameter.
        $REDACTED: |
          Redacted value.
    monitoring.v4.0.serviceability.Scope:
      type: string
      description: Scope for the policy execution.
      enum:
      - CLUSTER
      - NODE
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        NODE: Indicates that the policy will be executed on all nodes of the cluster.
        CLUSTER: Indicates that the policy will be executed only on Health Server
          Leader.
        $UNKNOWN: |
          Unknown value.
        $REDACTED: |
          Redacted value.
