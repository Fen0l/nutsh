openapi: 3.0.1
info:
  title: Nutanix Monitoring APIs
  description: "Manage Alerts, Alert policies, Events and Audits"
  version: "4.0"
  x-logo:
    altText: Monitoring Logo
    url: https://developers.nutanix.com/api/v1/namespaces/monitoring/images/monitoring-logo-img.svg
  x-repo-name: monitoring
servers:
- url: "https://{pc-ip}:9440/api"
security:
- basicAuthScheme: []
tags:
- name: ClusterLogs
  description: The cluster logs APIs can collect logs and configuration files from
    Controller VMs and various other services.
  x-displayName: Cluster Logs
- name: Alerts
  description: |
    Alerts or Alert Email Configuration may be fetched, updated, or managed using these APIs.
- name: Audits
  description: |
    Audits may be fetched using these APIs.
- name: Events
  description: |
    Events may be fetched using these APIs.
- name: SystemDefinedPolicies
  description: |
    The system-defined alert policies can be utilized to fetch or manage using these APIs.
  x-displayName: System Defined Policies
- name: UserDefinedPolicies
  description: User-Defined Alert policies may be fetched or managed using these APIs.
  x-displayName: User Defined Policies
