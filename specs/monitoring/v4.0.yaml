      properties:
        name:
          maxLength: 100
          type: string
          description: Unique identifier name for the parameter.
          example: fan_speed_lower_threshold
        displayName:
          maxLength: 200
          type: string
          description: Equivalent name for the parameter used to display it on Prism
            UI.
          readOnly: true
          example: Lower threshold for fan speed in RPM
        unit:
          maxLength: 100
          type: string
          description: "Unit for the parameter. For example, sec, %, MB, GB, and so\
            \ on."
          readOnly: true
          example: rpm
        paramValue:
          required:
          - $objectType
          type: object
          properties:
            $objectType:
              type: string
              example: monitoring.v4.serviceability.IntConfigurableParamValue
          description: "Captures the parameter value. Currently, it supports 4 data\
            \ type, that is, string, integer, float, and boolean."
          oneOf:
          - $ref: '#/components/schemas/monitoring.v4.0.serviceability.IntConfigurableParamValue'
          - $ref: '#/components/schemas/monitoring.v4.0.serviceability.FloatConfigurableParamValue'
          - $ref: '#/components/schemas/monitoring.v4.0.serviceability.BooleanConfigurableParamValue'
          - $ref: '#/components/schemas/monitoring.v4.0.serviceability.StringConfigurableParamValue'
      additionalProperties: false
      description: Parameters of the SDA that are configurable by a user.
    monitoring.v4.0.serviceability.AlertConfig:
      type: object
      properties:
        autoResolve:
