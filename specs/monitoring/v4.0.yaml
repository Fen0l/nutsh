        resolution:
          type: string
          description: Possible resolutions to troubleshoot this alert.
          example: Change the replication factor on the Storage Container with the
            nCLI command "container edit name='ctr_name' rf='2'" (or higher if appropriate
            for your environment).
        detail:
          type: string
          description: Additional details to troubleshoot this alert.
