    monitoring.v4.0.serviceability.IntConfigurableParamValue:
      required:
      - currentIntValue
      type: object
      properties:
        defaultIntValue:
          type: integer
          description: Captures the default value of the parameter.
          format: int64
          readOnly: true
          example: 90
        currentIntValue:
          type: integer
          description: Captures the current value of the parameter.
          format: int64
          example: 60
        validValueRanges:
          maxItems: 5
          minItems: 0
          type: array
          description: Valid values for the parameter.
          readOnly: true
          items:
            $ref: '#/components/schemas/monitoring.v4.0.serviceability.ConfigurableParamValueRange'
      additionalProperties: false
      description: Captures values of the parameter when it’s an integer type.
    monitoring.v4.0.serviceability.FloatConfigurableParamValue:
      required:
      - currentFloatValue
      type: object
      properties:
        defaultFloatValue:
          type: number
          description: Captures the default value of the parameter.
          format: float
          readOnly: true
          example: 63.78339
        currentFloatValue:
          type: number
          description: Captures the current value of the parameter.
          format: float
          example: 64.69143
        validValueRanges:
          maxItems: 5
          minItems: 0
          type: array
          description: Valid values for the parameter.
          readOnly: true
          items:
            $ref: '#/components/schemas/monitoring.v4.0.serviceability.ConfigurableParamValueRange'
      additionalProperties: false
      description: Captures values of the parameter when it's of type float.
    monitoring.v4.0.serviceability.BooleanConfigurableParamValue:
      required:
      - currentBoolValue
      type: object
      properties:
        defaultBoolValue:
          type: boolean
          description: Captures the default value of the parameter.
          readOnly: true
          example: false
        currentBoolValue:
          type: boolean
          description: Captures the current value of the parameter.
          example: true
      additionalProperties: false
      description: Captures values of the parameter when it's of type boolean.
    monitoring.v4.0.serviceability.StringConfigurableParamValue:
      required:
      - currentStrValue
      type: object
      properties:
        defaultStrValue:
          type: string
          description: Captures the default value of the parameter.
          readOnly: true
          example: medium
        currentStrValue:
          type: string
          description: Captures the current value of the parameter.
          example: low
      additionalProperties: false
      description: Captures values of the parameter when it's of type string.
    monitoring.v4.0.serviceability.ConfigurableParamValueRange:
      required:
      - maximumValue
      - minimumValue
      type: object
      properties:
        minimumValue:
          type: object
          description: Captures the minimum value the parameter can have.
          oneOf:
          - type: integer
            format: int64
            example: 95
          - type: number
            format: float
            example: 38.805603
        maximumValue:
          type: object
          description: Captures the maximum value the parameter can have.
          oneOf:
          - type: integer
            format: int64
            example: 14
          - type: number
            format: float
            example: 45.795345
      additionalProperties: false
      description: Valid values for the parameter.
    monitoring.v4.0.serviceability.AutoResolveState:
      type: string
      description: Indicates the auto-resolve configuration for the alert generated
        through the policy.
      enum:
      - ENABLED
      - DISABLED
      - NOT_SUPPORTED
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        DISABLED: Indicates that the alerts generated by this policy will not be auto-resolved.
        NOT_SUPPORTED: Indicates that auto-resolution of alerts generated by the policy
          is not supported.
        ENABLED: "Indicates that the alerts generated by this policy will be auto-resolved.\
          \ The system will automatically resolve alerts under certain conditions,\
          \ such as when the system recognizes that the error has been resolved or\
          \ when the initiating event has not reoccurred for 48 hours."
        $UNKNOWN: |
          Unknown value.
        $REDACTED: |
          Redacted value.
    monitoring.v4.0.serviceability.SeverityConfig:
      type: object
      properties:
        state:
