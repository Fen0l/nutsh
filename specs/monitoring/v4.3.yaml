    multidomain.v4.3.b1.config.Project:
      description: A logical grouping construct
      allOf:
      - $ref: '#/components/schemas/common.v1.0.response.ExternalizableAbstractModel'
      - required:
        - id
        - name
        type: object
        properties:
          name:
            maxLength: 64
            minLength: 1
            pattern: "^[\\S]+(?: +[\\S]+)*$"
            type: string
            description: Name of the project
            example: string
          description:
            maxLength: 1024
            pattern: "^[\\S]+(?: +[\\S]+)*$"
            type: string
            description: Description of the project
            nullable: true
            example: string
          id:
            maxLength: 64
            minLength: 1
            pattern: "^[\\S]+(?: +[\\S]+)*$"
            type: string
            description: ID of the project
            example: string
          createdTimestamp:
            type: integer
            description: The timestamp when the project was created
            format: int64
            readOnly: true
            example: 1
          modifiedTimestamp:
            type: integer
            description: The timestamp when the project was last modified
            format: int64
            readOnly: true
            example: 96
          createdBy:
            maxLength: 64
            minLength: 1
            pattern: "^[\\S]+(?: +[\\S]+)*$"
            type: string
            description: The ID of the user who created the project
            readOnly: true
            example: string
          updatedBy:
            maxLength: 64
            minLength: 1
            pattern: "^[\\S]+(?: +[\\S]+)*$"
            type: string
            description: The ID of the user who last updated the project
            readOnly: true
            example: string
          state:
            description: "The state of the project. Possible values are: ACTIVE, DELETING"
            $ref: '#/components/schemas/multidomain.v4.3.b1.config.ProjectState'
            readOnly: true
          isSystemDefined:
            type: boolean
            description: Indicates if the project is system defined
            readOnly: true
            example: true
          isDefault:
            type: boolean
            description: Indicates if the project is the default project
            readOnly: true
            example: false
        additionalProperties: false
      x-permissions:
        operationName: View Project
        deploymentList:
        - ON_PREM
        - CLOUD
        roleList:
        - name: Developer
        - name: Operator
        - name: Consumer
        - name: Prism Admin
        - name: Prism Viewer
        - name: NCM Viewer
        - name: NCM Admin
        - name: Project Admin
        - name: Project Manager
        - deprecated: true
          name: Self-Service Admin
        - name: Super Admin
        - name: CSI System
        - name: Kubernetes Data Services System
        - name: Kubernetes Infrastructure Provision
        - name: Virtual Machine Admin
        - name: Virtual Machine Operator
    multidomain.v4.3.b1.config.ProjectState:
      type: string
      description: "The state of the project. Possible values are: ACTIVE, DELETING"
      enum:
      - ACTIVE
      - DELETING
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        ACTIVE: The project is active and available for use
        DELETING: The project is being deleted
        $UNKNOWN: |
          Unknown value.
        $REDACTED: |
          Redacted value.
