      properties:
        startTime:
          type: string
          description: "The time marking the start of a log collection window.\nIt\
            \ should be in the following format: \nYYYY-MM-DDTHH:MM:SSZ or YYYY-MM-DDTHH:MM:SS+HH:MM\
            \ or YYYY-MM-DDTHH:MM:SS-HH:MM.\nThe start time of log collection should\
            \ be within the past three months.\nFor example:\n- 1985-04-12T23:20:50.52Z\
            \ represents 20 minutes and 50.52 seconds after the 23rd hour of\n  April\
            \ 12th, 1985 in UTC.\n- 1996-12-19T16:39:57-08:00 represents 39 minutes\
            \ and 57 seconds after the 16th hour\n  of December 19th, 1996 with an\
            \ offset of -08:00 from UTC (Pacific Standard Time).\n  Note that this\
            \ is equivalent to 1996-12-20T00:39:57Z in UTC.\n"
          format: date-time
          example: 2009-09-23T14:30:00-07:00
        endTime:
          type: string
          description: "The time marking the end of a log collection window.\nIt should\
            \ be in the following format: \nYYYY-MM-DDTHH:MM:SSZ or YYYY-MM-DDTHH:MM:SS+HH:MM\
            \ or YYYY-MM-DDTHH:MM:SS-HH:MM.\nThe end time of log collection should\
            \ be within the past three months.\nFor example:\n- 1985-04-12T23:20:50.52Z\
            \ represents 20 minutes and 50.52 seconds after the 23rd hour of\n  April\
            \ 12th, 1985 in UTC.\n- 1996-12-19T16:39:57-08:00 represents 39 minutes\
            \ and 57 seconds after the 16th hour\n  of December 19th, 1996 with an\
            \ offset of -08:00 from UTC (Pacific Standard Time).\n  Note that this\
            \ is equivalent to 1996-12-20T00:39:57Z in UTC.\n"
          format: date-time
          example: 2009-09-23T14:30:00-07:00
        includeTags:
