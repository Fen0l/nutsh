          - type: number
            format: float
            example: 38.805603
        maximumValue:
          type: object
          description: Captures the maximum value the parameter can have.
          oneOf:
          - type: integer
            format: int64
            example: 14
          - type: number
            format: float
            example: 45.795345
      additionalProperties: false
      description: Valid values for the parameter.
    monitoring.v4.3.serviceability.AutoResolveState:
      type: string
      description: Indicates the auto-resolve configuration for the alert generated
        through the policy.
      enum:
      - ENABLED
      - DISABLED
      - NOT_SUPPORTED
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        DISABLED: Indicates that the alerts generated by this policy will not be auto-resolved.
        NOT_SUPPORTED: Indicates that auto-resolution of alerts generated by the policy
          is not supported.
        ENABLED: "Indicates that the alerts generated by this policy will be auto-resolved.\
          \ The system will automatically resolve alerts under certain conditions,\
          \ such as when the system recognizes that the error has been resolved or\
          \ when the initiating event has not reoccurred for 48 hours."
        $UNKNOWN: |
          Unknown value.
        $REDACTED: |
          Redacted value.
    monitoring.v4.3.serviceability.SeverityConfig:
      type: object
      properties:
        state:
          description: Indicates whether an alert of the specific severity type is
            configured to be raised or not.
          $ref: '#/components/schemas/monitoring.v4.3.serviceability.PropertyState'
        thresholdParameters:
          maxItems: 5
          minItems: 0
          type: array
          description: Captures alert-related thresholds that correspond to a particular
            severity.
          items:
            $ref: '#/components/schemas/monitoring.v4.3.serviceability.AlertPolicyConfigurableParameter'
      additionalProperties: false
      description: Captures details of each of the severity types and their associated
        configurable parameters if applicable.
    monitoring.v4.3.serviceability.PropertyState:
      type: string
      description: Indicates the state of the given property.
      enum:
      - ENABLED
      - DISABLED
      - NOT_SUPPORTED
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        DISABLED: "Indicates that the associated property is supported, but disabled\
          \ at the moment."
        NOT_SUPPORTED: Indicates that the associated property is not supported and
          cannot be enabled/disabled.
        ENABLED: "Indicates that the associated property is supported, and enabled\
          \ at the moment."
        $UNKNOWN: |
          Unknown value.
        $REDACTED: |
          Redacted value.
