    monitoring.v4.3.serviceability.AlertStatus:
      type: string
      description: Status of the alert.
      enum:
      - OPEN
      - ACKNOWLEDGED
      - RESOLVED
      - AUTO_RESOLVED
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        ACKNOWLEDGED: Indicates that the alert has been acknowledged.
        RESOLVED: Indicates that the alert has been resolved.
        $UNKNOWN: |
          Unknown value.
        $REDACTED: |
          Redacted value.
        OPEN: Indicates that the alert is in open state and no action is performed
          on the alert. This is the initial status when the alert is created.
        AUTO_RESOLVED: Indicates that the alert has been auto-resolved.
    monitoring.v4.3.common.ComparisonOperator:
      type: string
      description: The comparison operator used for the condition evaluation.
      enum:
      - EQUAL_TO
      - GREATER_THAN
      - GREATER_THAN_OR_EQUAL_TO
      - LESS_THAN
      - LESS_THAN_OR_EQUAL_TO
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        GREATER_THAN: Indicates a > operator used in conjunction with a metric in
          a condition. An alert may be generated when the metric value equals the
          static threshold set depending on the trigger condition set.
        LESS_THAN_OR_EQUAL_TO: Indicates a <= operator used in conjunction with a
          metric in a condition. An alert may be generated when the metric value is
          less than or equal to the static threshold set depending on the trigger
          condition set.
        EQUAL_TO: Indicates an = operator used in conjunction with a metric in a condition.
          An alert may be generated when the metric value equals the static threshold
          set depending on the trigger condition set.
        GREATER_THAN_OR_EQUAL_TO: Indicates a >= operator used in conjunction with
          a metric in a condition. An alert may be generated when the metric value
          is greater than or equal to the static threshold set depending on the trigger
          condition set.
        LESS_THAN: Indicates a < operator used in conjunction with a metric in a condition.
          An alert may be generated when the metric value is less than the static
          threshold set depending on the trigger condition set.
        $UNKNOWN: |
          Unknown value.
        $REDACTED: |
          Redacted value.
    monitoring.v4.3.common.ConditionType:
      type: string
      description: "Indicating if this symptom is caused by a static threshold or\
        \ anomaly (dynamic threshold) evaluation.  If an indicator is raised, there\
        \ may have another indicator indicating the safeguard zone value."
      enum:
      - STATIC_THRESHOLD
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        $UNKNOWN: |
          Unknown value.
        $REDACTED: |
          Redacted value.
        STATIC_THRESHOLD: Indicates that the condition for when the policy should
          generate an alert based on a static threshold value.
    monitoring.v4.3.common.DataType:
      type: string
      description: Data type of the metric value as stored in the database.
      enum:
      - STRING
      - BOOLEAN
      - DOUBLE
      - LONG
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        STRING: Indicates that the metric value is a string.
        DOUBLE: Indicates that the metric value is a decimal.
        $UNKNOWN: |
          Unknown value.
        BOOLEAN: Indicates that the metric value is a boolean.
        $REDACTED: |
          Redacted value.
        LONG: Indicates that the metric value is a whole number.
