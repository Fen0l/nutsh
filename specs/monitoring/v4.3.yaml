      enum:
      - SUCCEEDED
      - FAILED
      - ABORTED
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        FAILED: The operation indicated by audit failure.
        SUCCEEDED: The operation indicated by the successful audit.
        ABORTED: The operation indicated by the aborted audit.
        $UNKNOWN: |
          Unknown value.
        $REDACTED: |
          Redacted value.
