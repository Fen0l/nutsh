    monitoring.v4.3.common.ImpactType:
      type: string
      description: "The impact this alert or event will have on the system. For example,\
        \ availability, performance, or capacity."
      enum:
      - AVAILABILITY
      - CAPACITY
      - CONFIGURATION
      - PERFORMANCE
      - SYSTEM_INDICATOR
      - CPU_CAPACITY
      - MEMORY_CAPACITY
      - STORAGE_CAPACITY
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        CAPACITY: Indicates that there may be storage or memory issues in the system.
        SYSTEM_INDICATOR: Indicates that certain operations in the system may fail
          or be interrupted.
        MEMORY_CAPACITY: Indicates that the system may have memory issues.
        AVAILABILITY: "Impacts availability of certain services, data, or functionality\
          \ in the system."
        PERFORMANCE: Indicates that there might be performance issues in the system.
        CONFIGURATION: Indicates that there may be connectivity issues between different
          entities due to incorrect configurations.
        CPU_CAPACITY: Indicates that there may be issues with CPU capacity.
        STORAGE_CAPACITY: Indicates that there may be storage issues in the system.
        $UNKNOWN: |
          Unknown value.
        $REDACTED: |
          Redacted value.
    monitoring.v4.3.common.Severity:
      type: string
      description: Severity of an alert.
      enum:
      - INFO
      - WARNING
      - CRITICAL
      - $UNKNOWN
      - $REDACTED
      x-enumDescriptions:
        INFO: Indicates that the severity of the alert is informational. This means
          that an actionable minor problem has been detected. It should be resolved
          relatively soon and should not be ignored.
        $UNKNOWN: |
          Unknown value.
        WARNING: "Indicates that the severity of the alert is a warning. This means\
          \ an actionable issue has been detected, and user intervention is required.\
          \ A more serious issue may develop if this is not resolved soon."
        CRITICAL: "Indicates that the severity of the alert is critical. This means\
          \ an actionable critical situation has been detected, and action is required\
          \ immediately. The cluster may have the potential to stop running or run\
          \ into irreparable issues."
        $REDACTED: |
          Redacted value.
