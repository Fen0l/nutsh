          import { ApiClient, UserDefinedPoliciesApi, UserDefinedPolicy } from "@nutanix-api/monitoring-js-client";

          // Configure the client
          let apiClientInstance = new ApiClient();
          // IPv4/IPv6 address or FQDN of the cluster
          apiClientInstance.host = 'localhost';
          // Port to which to connect to
          apiClientInstance.port = '9440';
          // Max retry attempts while reconnecting on a loss of connection
          apiClientInstance.maxRetryAttempts = 5;
          // Interval in ms to use during retry attempts
          apiClientInstance.retryInterval = 5000;
          // UserName to connect to the cluster
          apiClientInstance.username = 'username';
          // Password to connect to the cluster
          apiClientInstance.password = 'password';
          // Please add authorization information here if needed.
          let userDefinedPoliciesApi = new UserDefinedPoliciesApi(apiClientInstance);

          function sample() {
              let userDefinedPolicy = new UserDefinedPolicy();

              // UserDefinedPolicy object initializations here...
              userDefinedPolicy.setEntityType("string_sample_data");  // required field
              userDefinedPolicy.setTitle("string_sample_data");  // required field
              userDefinedPolicy.setTriggerConditions([]);  // required field





              userDefinedPoliciesApi.findConflictingUdaPolicies(userDefinedPolicy).then(({data, response}) => {
                  console.log(`API returned the following status code: ${response.status}`);
                  console.log(data.getData());
              }).catch((error) => {
                  console.log(`Error is: ${error}`);
              });
          }
          sample()
      - lang: Python
        source: |2

          import ntnx_monitoring_py_client

          if __name__ == "__main__":
              # Configure the client
              config = ntnx_monitoring_py_client.Configuration()
              # IPv4/IPv6 address or FQDN of the cluster
              config.host = "localhost"
              # Port to which to connect to
              config.port = 9440
              # Max retry attempts while reconnecting on a loss of connection
              config.max_retry_attempts = 3
              # Backoff factor to use during retry attempts
              config.backoff_factor = 3
              # UserName to connect to the cluster
              config.username = "username"
              # Password to connect to the cluster
              config.password = "password"
              # Please add authorization information here if needed.
              client = ntnx_monitoring_py_client.ApiClient(configuration=config)
              user_defined_policies_api = ntnx_monitoring_py_client.UserDefinedPoliciesApi(api_client=client)
              userDefinedPolicy = ntnx_monitoring_py_client.UserDefinedPolicy()

              # UserDefinedPolicy object initializations here...
              userDefinedPolicy.entity_type = "string_sample_data"  # required field
              userDefinedPolicy.title = "string_sample_data"  # required field
              userDefinedPolicy.trigger_conditions = []  # required field

              try:
                  api_response = user_defined_policies_api.find_conflicting_uda_policies(body=userDefinedPolicy)
                  print(api_response)
              except ntnx_monitoring_py_client.rest.ApiException as e:
                  print(e)
      - lang: Go
        source: |2+

          package main

          import (
              "fmt"
              "github.com/nutanix/ntnx-api-golang-clients/monitoring-go-client/v4/api"
              "github.com/nutanix/ntnx-api-golang-clients/monitoring-go-client/v4/client"
              import1 "github.com/nutanix/ntnx-api-golang-clients/monitoring-go-client/v4/models/monitoring/v4/serviceability"
          )

          var (
              ApiClientInstance *client.ApiClient
              UserDefinedPoliciesApiInstance *api.UserDefinedPoliciesApi
          )

          func main() {
              ApiClientInstance = client.NewApiClient()
              // IPv4/IPv6 address or FQDN of the cluster
              ApiClientInstance.Host = "localhost"
              // Port to which to connect to
              ApiClientInstance.Port = 9440
              // Interval in ms to use during retry attempts
              ApiClientInstance.RetryInterval = 5000
              // Max retry attempts while reconnecting on a loss of connection
              ApiClientInstance.MaxRetryAttempts = 5
              // UserName to connect to the cluster
              ApiClientInstance.Username = "username"
              // Password to connect to the cluster
              ApiClientInstance.Password = "password"
              // Please add authorization information here if needed.
              UserDefinedPoliciesApiInstance = api.NewUserDefinedPoliciesApi(ApiClientInstance)

              userDefinedPolicy := import1.NewUserDefinedPolicy()

              // UserDefinedPolicy object initializations here...



              response, error := UserDefinedPoliciesApiInstance.FindConflictingUdaPolicies(userDefinedPolicy)
              if error != nil {
                  fmt.Println(error)
                  return
              }
              data, _ := response.GetData().([]import1.ConflictingPolicy)
              fmt.Println(data)
          }

