      - EQUAL_TO
      - GREATER_THAN
      - GREATER_THAN_OR_EQUAL_TO
      - LESS_THAN
      - LESS_THAN_OR_EQUAL_TO
      x-enumDescriptions:
        GREATER_THAN: "Indicates a > operator used in conjunction with a metric in\
          \ a condition. Depending on the trigger condition set, an alert may be generated\
          \ when the metric value equals the static threshold set."
        LESS_THAN_OR_EQUAL_TO: "Indicates a <= operator used in conjunction with a\
          \ metric in a condition. Depending on the trigger condition set, an alert\
          \ may be generated when the metric value is less than or equal to the static\
          \ threshold set."
        EQUAL_TO: "Indicates an = operator used in conjunction with a metric in a\
          \ condition. Depending on the trigger condition set, an alert may be generated\
          \ when the metric value equals the static threshold set."
        GREATER_THAN_OR_EQUAL_TO: "Indicates a >= operator used in conjunction with\
          \ a metric in a condition. Depending on the trigger condition set, an alert\
          \ may be generated when the metric value is greater than or equal to the\
          \ static threshold set."
        LESS_THAN: "Indicates a < operator used in conjunction with a metric in a\
